version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/platform/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/platform/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_empty_slices: true
        rename:
          documento_proposta: "DocumentoProposta"
          documento_propostum: "DocumentoProposta"
          thread_offerta: "ThreadOfferta"
          thread_offertum: "ThreadOfferta"
          rimozione_proposta: "RimozioneProposta"
          rimozione_propostum: "RimozioneProposta"
          componente_proposta: "ComponenteProposta"
          componente_propostum: "ComponenteProposta"
          relazione_proposta: "RelazioneProposta"
          relazione_propostum: "RelazioneProposta"
          v_documento_storia: "VDocumentoStoria"
          v_documento_storium: "VDocumentoStoria"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          # --- correzioni di nullabilità che sqlc non inferisce (COALESCE, LEFT JOIN LATERAL, array_agg)
          - column: "v_fascicolo.documento_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_fascicolo.proposta_aperta"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_fascicolo.atteso_da_portale"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_fascicolo.stato_nas"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_fascicolo.path_relativo"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          # 0018: anomalia_id viene da un LEFT JOIN LATERAL, rev_diversa non e' mai NULL (ogni ramo
          # senza revisione nota da' false), percorso e' un uuid[]
          - column: "v_fascicolo.anomalia_id"
            go_type: "github.com/jackc/pgx/v5/pgtype.Int8"
          - column: "v_fascicolo.rev_diversa"
            go_type: { type: "bool" }
          - column: "v_componente_albero.percorso"
            go_type: { import: "github.com/google/uuid", type: "UUID", slice: true }
          # 0020: v_step_prodotto. Le colonne dei LEFT JOIN LATERAL possono essere NULL; motivo_parziale
          # e' NULL quando non c'e' un riferimento corrente; analisi_completa e' un AND di due IS NULL,
          # mai NULL.
          - column: "v_step_prodotto.motivo_parziale"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_step_prodotto.deroga_struttura_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_step_prodotto.altro_3d_documento_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_step_prodotto.proposta_aperta"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_step_prodotto.atteso_da_portale"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_step_prodotto.analisi_completa"
            go_type: { type: "bool" }
          # 0020: superata e corrente sono confronti fra colonne NOT NULL; corrente di
          # v_documento_storia e' un IS NULL
          - column: "v_bom_versioni.superata"
            go_type: { type: "bool" }
          - column: "v_bom_versioni.corrente"
            go_type: { type: "bool" }
          - column: "v_documento_storia.corrente"
            go_type: { type: "bool" }
          # 0020: v_thread_da_riesaminare e' una UNION ALL: motivo e' sempre un format(),
          # numero_riferito e' NULL nel ramo delle evidenze nuove
          - column: "v_thread_da_riesaminare.motivo"
            go_type: { type: "string" }
          - column: "v_thread_da_riesaminare.numero_riferito"
            go_type: "github.com/jackc/pgx/v5/pgtype.Int4"
          - column: "v_cruscotto.identificativi"
            go_type: { type: "[]string" }
          - column: "v_inbox.cliente_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_inbox.cliente"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.dominio"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.triage_esito"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.triage_confidenza"
            go_type: "github.com/jackc/pgx/v5/pgtype.Int2"
          - column: "v_inbox.triage_motivi"
            go_type: { import: "encoding/json", type: "RawMessage", pointer: true }
          # 0004: gli aggregati delle presenze. COALESCE li rende non nulli, ma sqlc non lo vede
          # dentro una vista: senza questi override uscirebbero come puntatori da controllare a ogni
          # uso, e un `if` in più in ogni template è il modo più sicuro per dimenticarne uno.
          - column: "v_inbox.caselle"
            go_type: { type: "[]string" }
          - column: "v_inbox.caselle_id"
            go_type: { import: "github.com/google/uuid", type: "UUID", slice: true }
          - column: "v_inbox.n_caselle"
            go_type: { type: "int32" }
          - column: "v_inbox.non_letto"
            go_type: { type: "bool" }
          - column: "v_inbox.ricevuto_il"
            go_type: { import: "time", type: "Time", pointer: true }
          - column: "v_inbox.casella_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_inbox.cartella_outlook"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.entry_id"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          # 0014: la controparte, in coda alla vista. `controparte_tipo` viene da una colonna NOT NULL
          # castata a text; `controparte` e' un CASE e puo' essere NULL.
          - column: "v_inbox.controparte_tipo"
            go_type: { type: "string" }
          - column: "v_inbox.controparte"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"

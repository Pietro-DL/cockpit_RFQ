version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_empty_slices: true
        rename:
          documento_proposta: "DocumentoProposta"
          documento_propostum: "DocumentoProposta"
          thread_offerta: "ThreadOfferta"
          thread_offertum: "ThreadOfferta"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          # --- correzioni di nullabilità che sqlc non inferisce (COALESCE, LEFT JOIN LATERAL, array_agg)
          - column: "v_fascicolo.documento_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_fascicolo.proposta_aperta"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_fascicolo.atteso_da_portale"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_fascicolo.stato_nas"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_fascicolo.path_relativo"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_cruscotto.identificativi"
            go_type: { type: "[]string" }
          - column: "v_inbox.cliente_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_inbox.cliente"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.dominio"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.triage_esito"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.triage_confidenza"
            go_type: "github.com/jackc/pgx/v5/pgtype.Int2"
          - column: "v_inbox.triage_motivi"
            go_type: { import: "encoding/json", type: "RawMessage", pointer: true }
          # 0004: gli aggregati delle presenze. COALESCE li rende non nulli, ma sqlc non lo vede
          # dentro una vista: senza questi override uscirebbero come puntatori da controllare a ogni
          # uso, e un `if` in più in ogni template è il modo più sicuro per dimenticarne uno.
          - column: "v_inbox.caselle"
            go_type: { type: "[]string" }
          - column: "v_inbox.caselle_id"
            go_type: { import: "github.com/google/uuid", type: "UUID", slice: true }
          - column: "v_inbox.n_caselle"
            go_type: { type: "int32" }
          - column: "v_inbox.non_letto"
            go_type: { type: "bool" }
          - column: "v_inbox.ricevuto_il"
            go_type: { import: "time", type: "Time", pointer: true }
          - column: "v_inbox.casella_id"
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - column: "v_inbox.cartella_outlook"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "v_inbox.entry_id"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"

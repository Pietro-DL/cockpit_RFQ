<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Mockup di Anagrafica: dati inventati, niente viene salvato. Le tre pagine (Inbox, Richieste, Anagrafica) si linkano fra loro. -->
<title>Anagrafica Cockpit RFQ</title>
<!-- Mockup della pagina Anagrafica del Cockpit RFQ: dati inventati, niente viene salvato. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

/* Layout: un banco di smistamento. A sinistra le cartelle (i quadranti) e lo stato della posta; poi la lista,
   raggruppata per giorno; a destra la lettura, divisa in due: la mail da leggere e, accanto, «Che cosa fare»,
   sempre in vista. I moduli (Nuova RFQ, Aggancia, Censisci) si aprono sopra la lettura, con la mail accanto.
   Fondo bianco, grigi neutri; il colore dice solo lo stato (proposta chiara, da scegliere, manca) e l'evento. */
:root {
  --bg: #f4f4f2;
  --surface: #ffffff;
  --surface-2: #fafaf9;
  --surface-3: #efefec;
  --ink: #1c1c1a;
  --ink-2: #5f5f5a;
  --ink-3: #8a8a84;
  --line: #e3e3df;
  --line-strong: #c6c6c0;
  --accent: #0f5a66;
  --accent-ink: #ffffff;
  --accent-soft: #e7f1f2;
  --ok: #1e7445; --ok-soft: #e9f5ee;
  --warn: #945800; --warn-soft: #fdf4e3;
  --bad: #b0332a; --bad-soft: #fcece9;
  --e-cad: #2957a8; --e-cad-soft: #ebf0fa;
  --e-rev: #5e44ad; --e-rev-soft: #f1edfa;
  --e-off: #86561a; --e-off-soft: #f8f0e3;
  --nov: #c77d00;
  --shadow: 0 1px 2px rgba(28,28,26,.06), 0 3px 10px rgba(28,28,26,.05);
  --shadow-alto: 0 12px 40px rgba(28,28,26,.18);
  --velo: rgba(28,28,26,.42);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --r: 8px;
  color-scheme: light;
}

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; background: var(--bg) }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--f-body); margin: 0; overflow: hidden }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
p { margin: 0 }
.mono { font-family: var(--f-mono); font-weight: 600; letter-spacing: .01em }
.k { color: var(--ink-2) }
.k3 { color: var(--ink-3) }
.label { font-family: var(--f-display); font-size: .76rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2) }
.sp { flex: 1 }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.ico.s { width: 13px; height: 13px }
kbd { font: 600 .72rem var(--f-mono); padding: 0 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--ink-2) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

/* ---------------------------------------------------------------- struttura */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 16px; background: var(--surface); border-bottom: 1.5px solid var(--line-strong) }
.topbar .app-nome { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .01em }
.topbar nav { display: flex; gap: 2px }
.topbar nav a { padding: 5px 12px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-weight: 500 }
.topbar nav a:hover { background: var(--surface-3); color: var(--ink) }
.topbar nav a[aria-current] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.postazione { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--ink-2) }
.postazione select { padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: .88rem }
.postazione select.manca { border-color: var(--bad); color: var(--bad); background: var(--bad-soft) }
.utente { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--surface); font: 700 .8rem var(--f-display); letter-spacing: .04em }
.mockup-tag { font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); border: 1px solid currentColor; white-space: nowrap }
.menu-mock { position: relative }
.menu-mock > button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: .85rem; font-weight: 600 }
.menu-mock .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: 300px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow-alto); padding: 12px; display: grid; gap: 10px }
.menu-mock label { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem }
.menu-mock label small { display: block; color: var(--ink-2) }

.spazio { min-height: 0; display: grid; gap: 12px; padding: 12px 16px; grid-template-columns: 214px 400px minmax(0, 1fr); grid-template-areas: "cart lista lettura" }
.col { min-height: 0; min-width: 0; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: var(--r) }

/* ---------------------------------------------------------------- cartelle */
.cartelle { grid-area: cart; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding: 12px 10px }
.gruppo { display: grid; gap: 2px }
.gruppo > .label { padding: 0 8px 4px }
.voce { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; color: var(--ink); font-weight: 500 }
.voce:hover { background: var(--surface-2) }
.voce[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.voce .punto { width: 9px; height: 9px; border-radius: 3px; flex: none; background: var(--q, var(--ink-3)) }
.voce .n { margin-left: auto; font: 600 .8rem var(--f-mono); color: var(--ink-2); min-width: 22px; text-align: right }
.voce .n.pieno { color: var(--surface); background: var(--q, var(--accent)); border-radius: 999px; padding: 0 7px; min-width: 0 }
.voce.adesso { font-family: var(--f-display); font-size: 1.05rem; font-weight: 700; padding-block: 9px }
.voce.adesso .punto { background: var(--accent); border-radius: 50% }
.voce .aiuto { display: none }
.aiuto-quad { font-size: .8rem; color: var(--ink-2); padding: 4px 8px 0; line-height: 1.4 }
.seg { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 4px }
.seg button { flex: 1 1 auto; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: .84rem; color: var(--ink-2); white-space: nowrap }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.seg button small { font-family: var(--f-mono); opacity: .8 }
.cartelle select { margin: 0 4px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: .88rem }
.posta { margin-top: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 10px; display: grid; gap: 8px; font-size: .84rem }
.posta .cas { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: baseline }
.posta .cas small { grid-column: 2; color: var(--ink-2) }
.stato-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); display: inline-block }
.stato-dot.off { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft) }
.stato-dot.lavora { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft) }
.posta .bottoni { display: flex; flex-wrap: wrap; gap: 6px }
.posta .nota { color: var(--ink-2); font-size: .78rem; line-height: 1.4 }

/* ---------------------------------------------------------------- bottoni e chip (come nella Distinta) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--ink) }
.btn:hover { border-color: var(--accent); color: var(--accent) }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.primario:hover { filter: brightness(1.1); color: var(--accent-ink) }
.btn.piccolo { padding: 3px 9px; font-size: .84rem }
.btn.pieno { width: 100% }
.btn.pericolo { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)) }
.btn.quieto { border-color: transparent; background: transparent; color: var(--ink-2) }
.btn.quieto:hover { background: var(--surface-3); color: var(--ink) }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none }
.btn kbd { margin-left: 2px }
.btn.primario kbd { background: transparent; color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent-ink) 50%, transparent) }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; background: var(--surface-3); color: var(--ink-2); line-height: 1.55 }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 28%, transparent) }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 28%, transparent) }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 28%, transparent) }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 22%, transparent) }
.chip.vuoto { background: transparent; border-color: var(--line-strong) }
.chip.mono { font-family: var(--f-mono); font-size: .74rem }
/* l'evento: che cosa sta succedendo con la mail (M2). Non aggancia niente, si legge e basta */
.ev { font-family: var(--f-display); font-size: .8rem; font-weight: 700; letter-spacing: .03em; padding: 1px 8px; border-radius: 4px; white-space: nowrap; background: var(--surface-3); color: var(--ink-2) }
.ev.NUOVA_RFQ { background: var(--ok-soft); color: var(--ok) }
.ev.ARRIVO_CAD { background: var(--e-cad-soft); color: var(--e-cad) }
.ev.REVISIONE_CAD { background: var(--e-rev-soft); color: var(--e-rev) }
.ev.RISPOSTA_COMMERCIALE { background: var(--accent-soft); color: var(--accent) }
.ev.OFFERTA_FORNITORE { background: var(--e-off-soft); color: var(--e-off) }
.ev.ORDINE { background: var(--ok); color: var(--surface) }
.ev.SOLLECITO { background: var(--warn-soft); color: var(--warn) }
.ctp { font-size: .8rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.ctp b { color: var(--ink); font-weight: 600 }
.ctp.ignoto { color: var(--bad); font-style: italic }

/* novità rispetto all'Inbox di oggi: si vedono con «Evidenzia le novità» */
body.novita .nov { outline: 2px dashed var(--nov); outline-offset: 2px; position: relative }
body.novita .nov::before { content: "nuovo"; position: absolute; top: -9px; right: 8px; z-index: 3; font: 700 .64rem/1.5 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; background: var(--nov); color: var(--surface) }

/* ---------------------------------------------------------------- pezzi comuni (carte, ricerca, note) */
.cerca { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface) }
.cerca:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.cerca input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent }
.cerca .ico { color: var(--ink-3) }
.sez { padding: 14px 22px; display: grid; gap: 10px; border-bottom: 1px solid var(--line) }
.sez-titolo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px }
.sez-titolo h3 { font-size: 1.05rem; font-weight: 700 }
.nota { font-size: .82rem; color: var(--ink-2); line-height: 1.45 }
.carta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0 }
.carta h3 { font-size: 1.12rem; font-weight: 700 }
.carta .sotto { font-size: .86rem; color: var(--ink-2) }
.carta.tono-ok { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); box-shadow: inset 4px 0 0 var(--ok) }
.carta.tono-warn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); box-shadow: inset 4px 0 0 var(--warn) }
.carta.tono-bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); box-shadow: inset 4px 0 0 var(--bad) }
.carta.tono-acc { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: inset 4px 0 0 var(--accent) }
.decisione h3 { font-size: 1.3rem }
.azioni { display: grid; gap: 6px }
.azioni .fila { display: flex; gap: 6px }
.azioni .fila .btn { flex: 1 }
.perche { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: .86rem }
.perche li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; line-height: 1.4 }
.perche li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); margin-top: 7px }
.perche li.forte::before { background: var(--ok) }
.perche li.contro::before { background: var(--bad) }
.cand { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 6px; background: var(--surface) }
.cand.primo { border-color: var(--line-strong); border-width: 1.5px }
.cand.chiuso { background: var(--surface-2) }
.cand .testa { display: flex; gap: 8px; align-items: flex-start }
.cand .testa .t { min-width: 0; flex: 1 }
.cand .testa .t b { font-family: var(--f-mono); font-size: .9rem; overflow-wrap: anywhere }
.cand .testa .t small { display: block; color: var(--ink-2); font-size: .8rem }
.liv { font: 700 .72rem var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; white-space: nowrap }
.liv.forte { background: var(--ok); color: var(--surface) }
.liv.medio { background: var(--ok-soft); color: var(--ok) }
.liv.debole { background: var(--surface-3); color: var(--ink-2) }
.cand ul { margin: 0; padding-left: 16px; font-size: .82rem; color: var(--ink-2); display: grid; gap: 2px }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: .86rem }
.dl dt { color: var(--ink-2) }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chips .chip { white-space: normal; text-align: left }
.carta details > summary { cursor: pointer; font-size: .84rem; color: var(--ink-2); font-weight: 500 }
.carta details[open] > summary { margin-bottom: 6px }
.carta select, .carta textarea, .carta input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: .88rem }
.carta textarea { resize: vertical; min-height: 90px }

/* ---------------------------------------------------------------- i moduli: si aprono sopra la lettura, con la mail accanto */
.foglio { position: absolute; inset: 0; z-index: 10; background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: sale .18s ease-out }
@keyframes sale { from { transform: translateY(8px); opacity: .4 } to { transform: none; opacity: 1 } }
.foglio-testa { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 18px; border-bottom: 1.5px solid var(--line-strong) }
.foglio-testa h2 { font-size: 1.45rem; font-weight: 700 }
.foglio-testa .k { font-size: .88rem }
.foglio-corpo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 38%); min-height: 0 }
.modulo { overflow: auto; padding: 18px; display: grid; gap: 16px; align-content: start; min-width: 0 }
.fonte { overflow: auto; background: var(--surface-2); border-left: 1px solid var(--line); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0 }
.fonte .corpo { padding: 0; max-width: none; font-size: .9rem }
.blocco { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0 }
.blocco > .testa { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px }
.blocco > .testa h3 { font-size: 1.08rem; font-weight: 700 }
.blocco > .testa small { color: var(--ink-2); font-size: .82rem }
.blocco.tono-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)) }
.campi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px }
.campo { display: grid; gap: 3px; min-width: 0; font-size: .84rem; color: var(--ink-2); font-weight: 500 }
.campo.largo { grid-column: 1 / -1 }
.campo input, .campo select, .campo textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: .92rem; font-weight: 400 }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.campo small { font-weight: 400; color: var(--ink-2); font-size: .78rem; line-height: 1.35 }
.campo small.letto { color: var(--warn) }
.campo .con-bottone { display: flex; gap: 6px }
.sola-lettura { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: .88rem; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line) }
.sola-lettura code { font: 600 .88rem var(--f-mono) }
.percorso { font: 500 .84rem var(--f-mono); color: var(--ink); overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center }
.percorso span { color: var(--ink-3) }
.codici-lista { display: grid; gap: 6px }
.codice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer }
.codice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.codice input { width: 17px; height: 17px; accent-color: var(--accent) }
.codice .c { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center }
.codice .c b { font: 600 .95rem var(--f-mono) }
.codice small { grid-column: 2; color: var(--ink-2); font-size: .8rem }
.seg-campo { display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; width: max-content; max-width: 100% }
.seg-campo button { border: 0; border-left: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; font-size: .88rem; color: var(--ink-2) }
.seg-campo button:first-child { border-left: 0 }
.seg-campo button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600 }
.seg-campo button.urg[aria-pressed="true"] { background: var(--bad) }
.seg-campo button.alta[aria-pressed="true"] { background: var(--warn) }
.interruttore { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; color: var(--ink) }
.interruttore input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s; margin: 0 }
.interruttore input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s }
.interruttore input:checked { background: var(--accent) }
.interruttore input:checked::after { left: 16px }
.foglio-piede { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 18px; border-top: 1.5px solid var(--line-strong); background: var(--surface-2) }
.foglio-piede .riep { flex: 1; min-width: 200px; font-size: .88rem; color: var(--ink-2) }
.foglio-piede .riep b { color: var(--ink) }
.risultati { display: grid; gap: 6px }
.risultato { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px }
.risultato small { color: var(--ink-2); font-size: .8rem }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; color: var(--ink); font-weight: 400 }
.check input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent); flex: none }
.lavorazioni { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 12px }

/* ---------------------------------------------------------------- visore, guida, avvisi */

.guida-box { width: min(760px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-alto); padding: 22px; display: grid; gap: 18px }

/* ---------------------------------------------------------------- pannelli che si allargano e si stringono
   Un bordo fra due pannelli si trascina; doppio clic lo rimette com'era; un pannello che si può chiudere
   si chiude trascinandolo quasi a zero e si riapre con la linguetta sul bordo. Le larghezze restano su questo PC. */
.maniglia { position: relative; cursor: col-resize; touch-action: none; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; z-index: 5; border-radius: 6px; outline-offset: -3px }

.spazio { gap: 0; grid-template-columns: var(--w-elenco, 318px) 12px minmax(0, 1fr) 12px var(--w-prova, 380px); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "testa testa testa testa testa" "elenco m1 scheda m2 prova" }

<script>

/* ---------------------------------------------------------------- comune alle tre pagine */
const OGGI = "2026-09-29";
const GIORNI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const clona = x => JSON.parse(JSON.stringify(x));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ico = (n, cl = "") => `<svg class="ico ${cl}"><use href="#i-${n}"/></svg>`;
const giorno = d => d.slice(0, 10);
const ora = d => d.slice(11, 16);
const dataIt = d => { const [y, m, g] = d.slice(0, 10).split("-"); return `${g}/${m}`; };
const dt = d => new Date(d.slice(0, 10) + "T12:00:00");
function nomeGiorno(d) {
  const x = dt(d), oggi = dt(OGGI), diff = Math.round((oggi - x) / 864e5);
  const pieno = `${GIORNI[x.getDay()]} ${x.getDate()} ${MESI[x.getMonth()]}`;
  return diff === 0 ? ["Oggi", pieno] : diff === 1 ? ["Ieri", pieno] : [pieno, ""];
}
function quando(d) {
  const diff = Math.round((dt(OGGI) - dt(d)) / 864e5);
  return diff === 0 ? ora(d) : diff === 1 ? "ieri " + ora(d) : dataIt(d);
}
function giorniA(d) { return Math.round((dt(d) - dt(OGGI)) / 864e5); }
function iniziali(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase(); }
function leggi(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
function scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

let toastTimer = null;
function toast(testo, annulla) {
  const root = $("#toast-root");
  root.innerHTML = `<div class="toast" role="status">${ico("ok")}<span>${testo}</span>${annulla ? `<button type="button" class="btn piccolo" id="btn-annulla">Annulla</button>` : ""}</div>`;
  if (annulla) $("#btn-annulla").onclick = () => { annulla(); root.innerHTML = ""; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => root.innerHTML = "", 7000);
}

/* ---------------------------------------------------------------- la barra in alto, uguale per tutte le pagine */
const PAGINA = { chiave: "", tasti: [], preset: [], mock: [], guida: null, reset: null, dopoPannelli: null };
function topbar() {
  const nav = [["inbox", "Inbox", "mockup_inbox.html"], ["richieste", "Richieste", "mockup_richieste.html"], ["anagrafica", "Anagrafica", "mockup_anagrafica.html"]];
  $("#topbar").innerHTML = `
    <span class="app-nome">Cockpit RFQ</span>
    <nav aria-label="Sezioni">${nav.map(([k, t, h]) => `<a href="${h}" ${k === PAGINA.chiave ? 'aria-current="page"' : ""}>${t}</a>`).join("")}</nav>
    <span class="sp"></span>
    <div class="postazione" title="Il PC su cui lavori: «Apri in Outlook» e le bozze si aprono lì">
      <label for="postazione"><span>Sei su</span></label>
      <select id="postazione"><option value="">— scegli il PC —</option><option value="ufficio-1" selected>UFFICIO-1</option><option value="tecnico-2">TECNICO-2</option></select>
    </div>
    <div class="menu-mock">
      <button type="button" id="btn-mock" aria-expanded="false">Mockup ${ico("giu", "s")}</button>
      <div class="pop" id="pop-mock" hidden>
        ${PAGINA.mock.map(m => `<label><input type="checkbox" id="${m.id}"> <span>${esc(m.testo)}<small>${esc(m.sotto)}</small></span></label>`).join("")}
        <label><input type="checkbox" id="mk-novita"> <span>Evidenzia le novità<small>Contorno arancione su tutto ciò che la pagina di oggi non ha.</small></span></label>
        <button type="button" class="voce-menu" id="mk-guida">${ico("guida")}<span>Che cosa c'è di nuovo<small>L'elenco delle novità e che cosa serve dal server.</small></span></button>
        <button type="button" class="voce-menu" id="mk-reset">${ico("aggiorna")}<span>Ricomincia<small>Rimette i dati com'erano all'apertura del mockup.</small></span></button>
      </div>
    </div>
    <div class="menu-mock ingranaggio">
      <button type="button" id="btn-imp" aria-expanded="false" title="Impostazioni" aria-label="Impostazioni"><svg class="ico"><use href="#i-ingranaggio"/></svg></button>
      <div class="pop" id="pop-imp" hidden style="width:330px"></div>
    </div>
    <span class="utente" title="SV">SV</span>
    <span class="mockup-tag">MOCKUP · dati inventati</span>`;
}
function scorciatoie() { return !!leggi("cockpit.scorciatoie", false); }
function renderImpostazioni() {
  const on = scorciatoie();
  $("#pop-imp").innerHTML = `
    <div class="sez-imp"><b>Pannelli</b><small>Trascina i bordi fra i pannelli per allargarli o stringerli. Doppio clic su un bordo lo rimette com'era.</small>
      ${PAGINA.preset.length ? `<div class="preset">${PAGINA.preset.map((p, i) => `<button type="button" data-preset="${i}"><span class="schema">${p.schema.map(([w, f]) => `<i style="flex:${w}" class="${f ? "forte" : ""}"></i>`).join("")}</span>${esc(p.nome)}<small>${esc(p.sotto)}</small></button>`).join("")}</div>` : ""}
      <button type="button" class="btn quieto piccolo" data-preset="reset" style="justify-self:start">Ripristina le larghezze</button></div>
    <div class="sez-imp"><label class="interruttore" for="imp-tasti"><input type="checkbox" id="imp-tasti" ${on ? "checked" : ""}> Scorciatoie da tastiera</label>
      <small>Spente di base: si decidono a fine lavori. Accese qui valgono solo su questo PC.</small>
      ${on && PAGINA.tasti.length ? `<div class="tasti-mini">${PAGINA.tasti.map(([k, t]) => `<div><kbd>${esc(k)}</kbd>${esc(t)}</div>`).join("")}</div>` : ""}</div>`;
}

/* ---------------------------------------------------------------- i bordi trascinabili */
const MANIGLIE = {};   // id → { v: "--w-lista", def, min, max, dir: 1 | -1, chiudi: "cart" | null, nome }
function statoPannelli() { return leggi("cockpit.pannelli." + PAGINA.chiave, {}); }
function applicaPannelli() {
  const st = statoPannelli(), root = document.documentElement;
  for (const [id, m] of Object.entries(MANIGLIE)) {
    const s = st[id] || {};
    const chiuso = !!(m.chiudi && s.chiuso);
    root.style.setProperty(m.v, chiuso ? "0px" : (s.w || m.def) + "px");
    if (m.chiudi) root.classList.toggle("chiuso-" + m.chiudi, chiuso);
    document.querySelectorAll(`[data-maniglia="${id}"]`).forEach(el => {
      el.classList.toggle("chiuso", chiuso);
      el.setAttribute("aria-valuenow", chiuso ? 0 : (s.w || m.def));
      el.setAttribute("aria-valuemin", m.min); el.setAttribute("aria-valuemax", m.max);
    });
  }
  if (PAGINA.dopoPannelli) PAGINA.dopoPannelli();
}
function salvaPannello(id, w, chiuso) { const st = statoPannelli(); st[id] = { w, chiuso }; scrivi("cockpit.pannelli." + PAGINA.chiave, st); applicaPannelli(); }
function maniglia(id, interna = false) {
  const m = MANIGLIE[id], chiuso = !!(m.chiudi && (statoPannelli()[id] || {}).chiuso);
  return `<div class="maniglia ${interna ? "interna" : ""} ${chiuso ? "chiuso" : ""}" data-maniglia="${id}" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Allarga o stringi ${esc(m.nome)}" title="Trascina per allargare o stringere ${esc(m.nome)} · doppio clic: com'era">
    ${m.chiudi ? `<button type="button" class="riapri" data-riapri="${id}" title="Riapri ${esc(m.nome)}" aria-label="Riapri ${esc(m.nome)}">${ico(m.dir > 0 ? "freccia" : "sx", "s")}</button>` : ""}</div>`;
}
let tiro = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".maniglia"); if (!h || e.target.closest(".riapri")) return;
  const id = h.dataset.maniglia, m = MANIGLIE[id], s = statoPannelli()[id] || {};
  tiro = { id, h, x: e.clientX, w: s.chiuso ? 0 : (s.w || m.def) };
  try { h.setPointerCapture(e.pointerId); } catch (err) { } h.classList.add("tira"); document.body.classList.add("tirando"); e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!tiro) return;
  const m = MANIGLIE[tiro.id], grezza = tiro.w + (e.clientX - tiro.x) * m.dir;
  const chiude = m.chiudi && grezza < m.min - 70;
  const w = Math.max(m.min, Math.min(m.max, grezza));
  document.documentElement.style.setProperty(m.v, chiude ? "0px" : w + "px");
  if (m.chiudi) document.documentElement.classList.toggle("chiuso-" + m.chiudi, chiude);
  tiro.ultimo = { w: chiude ? (statoPannelli()[tiro.id]?.w || m.def) : w, chiuso: chiude };
});
document.addEventListener("pointerup", () => {
  if (!tiro) return;
  tiro.h.classList.remove("tira"); document.body.classList.remove("tirando");
  if (tiro.ultimo) salvaPannello(tiro.id, tiro.ultimo.w, tiro.ultimo.chiuso);
  tiro = null;
});
document.addEventListener("dblclick", e => {
  const h = e.target.closest(".maniglia"); if (!h) return;
  const m = MANIGLIE[h.dataset.maniglia]; salvaPannello(h.dataset.maniglia, m.def, false);
});
document.addEventListener("keydown", e => {
  const h = e.target.closest && e.target.closest(".maniglia"); if (!h) return;
  const id = h.dataset.maniglia, m = MANIGLIE[id], s = statoPannelli()[id] || {}, w = s.chiuso ? m.min : (s.w || m.def);
  const passo = e.shiftKey ? 64 : 16;
  const k = { ArrowLeft: -passo * m.dir, ArrowRight: passo * m.dir }[e.key];
  if (k !== undefined) { e.preventDefault(); salvaPannello(id, Math.max(m.min, Math.min(m.max, w + k)), false); h.focus(); }
  if (e.key === "Enter" && m.chiudi) { e.preventDefault(); salvaPannello(id, w, !s.chiuso); }
});

/* ---------------------------------------------------------------- menu della barra in alto */
document.addEventListener("click", e => {
  const t = e.target;
  const ri = t.closest("[data-riapri]"); if (ri) { const m = MANIGLIE[ri.dataset.riapri]; return salvaPannello(ri.dataset.riapri, (statoPannelli()[ri.dataset.riapri] || {}).w || m.def, false); }

    if (!t.closest(p)) { $(p).hidden = true; $(b).setAttribute("aria-expanded", "false"); }
  }
  const pr = t.closest("[data-preset]");
  if (pr) { if (pr.dataset.preset === "reset") scrivi("cockpit.pannelli." + PAGINA.chiave, {});
    else { const p = PAGINA.preset[+pr.dataset.preset], st = {}; for (const [id, w, chiuso] of p.valori) st[id] = { w: w || MANIGLIE[id].def, chiuso: !!chiuso }; scrivi("cockpit.pannelli." + PAGINA.chiave, st); }
    applicaPannelli(); return; }
  if (t.closest("#mk-guida")) { $("#pop-mock").hidden = true; return PAGINA.guida && PAGINA.guida(); }
  if (t.closest("#mk-reset")) { $("#pop-mock").hidden = true; return PAGINA.reset && PAGINA.reset(); }
}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "imp-tasti") { scrivi("cockpit.scorciatoie", t.checked); renderImpostazioni(); return toast(t.checked ? "Scorciatoie accese su questo PC" : "Scorciatoie spente"); }
  if (t.id === "mk-novita") return document.body.classList.toggle("novita", t.checked);
  const mk = PAGINA.mock.find(m => m.id === t.id); if (mk) mk.on(t.checked);
});
function avvia() { topbar(); applicaPannelli(); }

/* ---------------------------------------------------------------- dagli esempi a una regola
   Ogni esempio diventa una sequenza: cifre, lettere e separatori. Se gli esempi hanno la stessa forma, le lettere uguali
   restano scritte, il numero di cifre si allarga al minimo e al massimo visti, e un separatore visto anche una sola volta
   diventa facoltativo. Se hanno forme diverse, la regola le elenca tutte. */
function pezzi(s) {
  const out = []; let sep = "";
  for (const m of s.trim().matchAll(/(\d+)|([A-Za-z]+)|([ _\-./])|(.)/g)) {
    if (m[3]) { sep += m[3]; continue; }
    out.push({ t: m[1] ? "d" : m[2] ? "L" : "x", v: m[0], sep }); sep = "";
  }
  return out;
}
function genera(esempi) {
  const ee = esempi.map(s => s.trim()).filter(Boolean);
  if (!ee.length) return null;
  const pp = ee.map(pezzi), forma = p => p.map(x => x.t).join("");
  const scappa = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const parti = (p, lista) => p.map((x, i) => {
    const tutti = lista.map(q => q[i]), seps = [...new Set(tutti.map(q => q.sep).join(""))].join(""), sempre = tutti.every(q => q.sep);
    const sp = seps ? (seps.length === 1 ? scappa(seps) : `[${seps.replace(/[\]\\-]/g, "\\$&")}]`) + (sempre ? "" : "?") : "";
    const vv = [...new Set(tutti.map(q => q.v.toUpperCase()))];
    let re, parole;
    if (x.t === "d") { const n = tutti.map(q => q.v.length), a = Math.min(...n), b = Math.max(...n); re = a === b ? `\\d{${a}}` : `\\d{${a},${b}}`; parole = a === b ? `${a} cifr${a === 1 ? "a" : "e"}` : `da ${a} a ${b} cifre`; }
    else if (x.t === "L") { if (vv.length === 1 && vv[0].length > 1) { re = scappa(vv[0]); parole = `«${vv[0]}»`; } else { const n = tutti.map(q => q.v.length), a = Math.min(...n), b = Math.max(...n); re = a === b ? (a === 1 ? "[A-Z]" : `[A-Z]{${a}}`) : `[A-Z]{${a},${b}}`; parole = a === 1 && b === 1 ? "una lettera" : `${a === b ? a : a + "-" + b} lettere`; } }
    else { re = scappa(x.v); parole = `«${x.v}»`; }
    const sepParole = seps ? `${sempre ? "" : "con o senza "}${[...seps].map(c => ({ " ": "spazio", "_": "trattino basso", "-": "trattino", ".": "punto", "/": "barra" }[c] || `«${c}»`)).join(" o ")} e ` : "";
    return { re: sp + re, parole: (i ? sepParole : "") + parole };
  });
  const forme = [...new Set(pp.map(forma))];
  let re, parole;
  if (forme.length === 1) { const pr = parti(pp[0], pp); re = pr.map(x => x.re).join(""); parole = pr.map(x => x.parole).join(", poi "); }
  else { const alt = forme.map(f => { const g = pp.filter(p => forma(p) === f), pr = parti(g[0], g); return { re: pr.map(x => x.re).join(""), p: pr.map(x => x.parole).join(", poi ") }; });
    re = `(?:${alt.map(a => a.re).join("|")})`; parole = "una di queste forme: " + alt.map(a => a.p).join(" · oppure "); }
  return { re: `\\b${re}\\b`, parole };
}

document.addEventListener("click", e => {

  const vs = t.closest("[data-vai-sez]"); if (vs) { e.preventDefault(); A.sez = vs.dataset.vaiSez; return renderScheda(); }

  if (t.closest("[data-togli-dom]")) return cambia(x => x.domini.splice(ix("togli-dom"), 1));
  if (t.closest("[data-togli-domf]")) return cambia(x => x.domini.splice(ix("togli-domf"), 1));

  if (t.closest("[data-togli-suff]")) return cambia(x => x.regole.suff.splice(ix("togli-suff"), 1));
  if (t.closest("[data-togli-frase]")) return cambia(x => x.regole.frasi.splice(ix("togli-frase"), 1));
  if (t.closest("[data-togli-dato]")) return cambia(x => x.regole.dati.splice(ix("togli-dato"), 1));
  if (t.closest("[data-togli-conv]")) return cambia(x => x.conv.splice(ix("togli-conv"), 1));
  if (t.closest("[data-conv-att]")) return cambia(x => { const cv = x.conv[ix("conv-att")]; cv.attiva = !cv.attiva; });
  const ed = t.closest("[data-es-del]"); if (ed) { const [i, j] = ed.dataset.esDel.split(":").map(Number); return cambia(x => x.regole.fam[i].esempi.splice(j, 1)); }

document.addEventListener("input", e => {
  const t = e.target;

  if (t.id === "prova-cod") { provaDi(cur()).cod = t.value; return $("#prova-cod-esito").innerHTML = esitoCodice(cur()); }
  if (t.dataset.campo) {
    const v = t.type === "checkbox" ? t.checked : t.dataset.num ? Number(t.value) : t.value;
    const path = t.dataset.campo;
    modifica(x => metti(x, path, v));
    if (t.type === "range") t.nextElementSibling.value = v;
    if (/^(rs|peso|attivo)$/.test(path)) renderElencoA();
    if (/^regole\.(fam|rif)/.test(path) || t.type === "checkbox" || t.tagName === "SELECT") return conFuoco(() => { renderScheda(); renderProva(); });
    mostraBarra();
    if (/^regole/.test(path)) $("#prova-esito").innerHTML = esitoProva(cur());
    return;
  }
});

document.addEventListener("keydown", e => {
  const t = e.target, scrive = t.matches("input, textarea, select");
  if (e.key === "Escape") { if ($("#strato").innerHTML) return $("#strato").innerHTML = ""; if (scrive) return t.blur(); return; }
  if (!scorciatoie() || scrive || t.closest(".maniglia") || e.ctrlKey || e.metaKey || e.altKey || $("#strato").innerHTML) return;

  if (k === "/") { e.preventDefault(); return $("#cerca-a") && $("#cerca-a").focus(); }
  if ((k === "j" || k === "k") && A.tab !== "articoli") { e.preventDefault(); if (!puoLasciare()) return;

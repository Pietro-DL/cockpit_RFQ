<style>
/* v15 · Inbox, elenco delle RFQ e impostazioni (SPEC §2.1). Correzioni: A1 (.fsize), A2 (.brand-sub), M1 (date nowrap,
   colonne auto), B6 (title sui nomi tagliati). Solo token: nessun colore scritto qui. */

/* ---------------- Inbox: quattro riquadri ---------------- */
.panes{display:grid;grid-template-columns:238px 350px minmax(0,1fr) 312px;min-height:0;height:100%}
.pane{min-width:0;min-height:0;overflow:auto;border-right:1px solid var(--line);background:var(--surf)}
.pane:last-child{border-right:0}
.p-rail{background:var(--surf2)}
.p-conv{background:var(--paper)}
.p-ctx{background:var(--surf2)}
.search{position:relative;margin:var(--sp4)}
.search input{width:100%;min-height:32px;padding:5px 10px 5px 32px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);font-size:var(--t-ms)}
.search .ic{position:absolute;left:9px;top:8px;color:var(--ink3)}
.railg{padding:var(--sp4) var(--sp4) var(--sp2)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 var(--sp3)}
.navb{display:flex;align-items:center;gap:var(--sp3);width:100%;text-align:left;background:none;border:0;border-radius:var(--r2);
  padding:6px var(--sp3);min-height:32px;cursor:pointer;color:var(--ink);font-size:var(--t-ms)}
.navb:hover{background:var(--sunken)}
.navb[aria-current="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600;box-shadow:inset 0 0 0 1px var(--acc-line)}
.navb .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-family:var(--fm);font-size:var(--t-xs);background:var(--sunken);color:var(--ink2);border-radius:999px;padding:1px 7px;white-space:nowrap}
.navb[aria-current="true"] .cnt{background:var(--surf);color:var(--acc)}
.lhead{position:sticky;top:0;z-index:4;background:var(--surf);border-bottom:1px solid var(--line2);padding:var(--sp4) var(--sp5) var(--sp3)}
.lhead h2{font-size:var(--t-lg)}
.lhead .meta{display:flex;align-items:center;gap:var(--sp2);margin-top:3px;font-size:var(--t-sm);color:var(--ink3);flex-wrap:wrap}
.lsub{display:flex;align-items:center;gap:var(--sp3);padding:8px var(--sp5) 6px;background:var(--surf2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lsub .n{font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp4);width:100%;text-align:left;background:var(--surf);
  border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;padding:10px var(--sp5);cursor:pointer;color:var(--ink)}
.row:hover{background:var(--surf2)}
.row[aria-current="true"]{background:var(--acc-soft);border-left-color:var(--acc)}
.r1{display:flex;align-items:baseline;gap:var(--sp3);min-width:0}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tm{margin-left:auto;font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3);white-space:nowrap}
.snip{font-size:var(--t-sm);color:var(--ink2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rchips{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:6px}
/* conversazione */
.chead{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);padding:var(--sp4) var(--sp5)}
.bc{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink3);margin-bottom:var(--sp3);flex-wrap:wrap}
.bc b{color:var(--ink2);font-weight:500}
.bc svg{width:14px;height:14px;color:var(--ink3)}
.cart{border:1.5px solid var(--ink-line);border-radius:var(--r1);background:var(--surf);overflow:hidden}

/* il titolo prende una riga intera, le altre celle sotto: nessuna cella schiaccia il titolo (M1) */
.cart .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.cart .cell:first-child{grid-column:1/-1;border-bottom:1px solid var(--line2)}
.cart .cell:nth-child(2){border-left:0}
.cart .cell{padding:8px var(--sp4);border-left:1px solid var(--line2);min-width:0;display:flex;flex-direction:column;gap:2px}
.cart .cell:first-child{border-left:0;background:var(--surf2)}
.cart .cell .v{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart .cell .v.wrap{white-space:normal;overflow-wrap:anywhere}
.cart h1{font-family:var(--fd);font-size:var(--t-lg);color:var(--ink);overflow-wrap:break-word;word-break:normal}
.cart .nome{font-size:var(--t-ms);color:var(--ink2)}
.cart .chip{align-self:flex-start}
.stream{padding:var(--sp5) var(--sp5) var(--sp7);display:flex;flex-direction:column;gap:var(--sp5);max-width:900px}
.day{display:flex;align-items:center;gap:var(--sp4);font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.day::before,.day::after{content:"";height:5px;flex:1;background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 7px)}
.msg{display:flex;flex-direction:column;gap:5px;max-width:92%}
.msg.out{align-self:flex-end;align-items:flex-end}
.who{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink3);flex-wrap:wrap}
.who b{color:var(--ink);font-weight:600}
.who .rl{font-size:var(--t-xs);white-space:nowrap}
.bub{background:var(--surf);border:1px solid var(--line);border-radius:var(--r3);border-top-left-radius:var(--r1);padding:11px 14px}
.msg.out .bub{background:var(--acc-soft);border-color:var(--acc-line);border-top-left-radius:var(--r3);border-top-right-radius:var(--r1)}
.bub p{margin:0 0 7px}.bub p:last-child{margin-bottom:0}
.quote{border-left:2px solid var(--line2);padding:1px 0 1px 10px;margin:var(--sp3) 0;color:var(--ink3);font-size:var(--t-ms)}
mark.hl{background:var(--ver-soft);box-shadow:inset 0 -1.5px 0 var(--ver-line);border-radius:2px;padding:0 3px;color:inherit;font-weight:500}
.files{display:grid;gap:var(--sp2);margin-top:var(--sp4)}
.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp3);align-items:center;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r2);padding:6px 9px}
.msg.out .file{background:var(--surf);border-color:var(--acc-line)}
.ext{min-width:34px;height:24px;padding:0 4px;border-radius:var(--r1);display:grid;place-items:center;font-family:var(--fd);font-size:var(--t-xs);font-weight:700;letter-spacing:.04em;background:var(--sunken);color:var(--ink2);border:1px solid var(--line2)}
.ext.pdf{background:var(--ko-soft);color:var(--ko);border-color:var(--ko-line)}
.ext.step,.ext.stp,.ext.dxf,.ext.igs{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.ext.zip{background:var(--ver-soft);color:var(--ver);border-color:var(--ver-line)}
.ext.xlsx{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.ext.msg{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.fn{font-family:var(--fm);font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.fsize{font-size:var(--t-xs);color:var(--ink3);white-space:nowrap}
.mline{display:flex;align-items:flex-start;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink2);padding-left:2px}
.mline svg{width:14px;height:14px;color:var(--acc);margin-top:2px}
.msg.out .mline{flex-direction:row-reverse}
.catena{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);color:var(--ink3)}
.xref{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp4);align-items:center;max-width:92%;background:var(--surf);
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r2);padding:9px var(--sp4)}
.xref .ib{width:28px;height:28px;border-radius:var(--r2);background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.xref b{display:block;font-family:var(--fd);font-size:var(--t-md)}
.xref .m{font-size:var(--t-sm);color:var(--ink3)}
.card{border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf2);padding:var(--sp4);max-width:92%}
.card>.lab{display:flex;align-items:center;gap:6px;margin-bottom:var(--sp3)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp4);align-items:start;padding:9px 0;border-top:1px dashed var(--line2)}
.cand:first-of-type{border-top:0;padding-top:0}
.src{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:5px}
.why{font-size:var(--t-ms);color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:var(--sp2);margin-top:var(--sp4)}
.pfilter{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp2);margin-top:var(--sp3)}
.pf{border:1px solid var(--line2);background:var(--surf);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:var(--t-sm);min-height:28px}
.pf[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pf .n{font-family:var(--fm);font-size:var(--t-xs);opacity:.8}
/* il blocco RFQ */
.rfqblock{display:flex;flex-wrap:wrap;gap:var(--sp3) var(--sp5);align-items:center;margin-top:var(--sp3);
  padding:var(--sp3) var(--sp4);border-radius:var(--r2);border:1.5px solid var(--acc-line);background:var(--surf)}
.rfqblock.nuova{border-style:dashed;border-color:var(--line2);background:var(--surf2)}
.rfqblock .ib{width:40px;height:40px;border-radius:var(--r2);display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.rfqblock h3{font-size:var(--t-lg);display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap}
.rfqblock .num{font-family:var(--fm);font-weight:600;color:var(--acc)}
.rfqblock p{margin-top:2px;font-size:var(--t-ms);color:var(--ink2)}
.rfqblock>div:not(.acts){flex:1 1 260px;min-width:0}
.rfqblock .ib{flex:none}
.rfqblock .acts{margin:0;justify-content:flex-end;flex:0 1 auto;margin-left:auto}
/* colonna di contesto */
.sec{padding:var(--sp5);border-bottom:1px solid var(--line)}
.sec h3{display:flex;align-items:center;gap:6px;margin-bottom:var(--sp3)}
.dati{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px var(--sp4);margin:0;font-size:var(--t-ms)}
.dati dt{color:var(--ink3)}
.dati dd{margin:0;min-width:0;overflow-wrap:anywhere}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp3);align-items:start;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r2);padding:9px 10px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.prow[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.prow .assi{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rfqmini{display:grid;gap:var(--sp3)}
.itm{display:flex;align-items:flex-start;gap:var(--sp3);padding:var(--sp3) 0;border-top:1px solid var(--line);font-size:var(--t-ms)}
.itm:first-of-type{border-top:0}
.itm .g{flex:1;min-width:0}
.pers{display:flex;align-items:center;gap:var(--sp3);padding:5px 0}
.link-piccolo{font-size:var(--t-sm);color:var(--acc);padding:4px 10px;text-decoration:underline;text-underline-offset:2px}
.nota-lettura{font-size:var(--t-xs);color:var(--ink3);margin-top:var(--sp3)}

/* ---------------- elenco delle RFQ ---------------- */
.gest{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;height:100%;background:var(--paper)}
.ghead{display:flex;align-items:center;gap:var(--sp4);flex-wrap:wrap;padding:var(--sp5) var(--sp6) var(--sp3)}
.ghead h2{font-size:var(--t-xl)}
.ghead .search{margin:0;width:min(340px,100%)}
.ghead select{min-height:32px;border:1px solid var(--line2);border-radius:var(--r2);padding:4px 8px}
.gfasi{display:flex;flex-wrap:wrap;gap:4px;padding:0 var(--sp6) var(--sp3)}
.gfase{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surf);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:var(--t-ms);min-height:30px;white-space:nowrap}
.gfase[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gfase[aria-pressed="true"] .cnt{background:var(--surf);color:var(--ink)}
.gbody{overflow:auto;padding:0 var(--sp6) var(--sp7);min-height:0}
.gwrap{display:grid;gap:var(--sp5);align-items:start}
.gwrap.con-senza{grid-template-columns:minmax(0,1fr) 360px}
.gmain{min-width:0}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:var(--surf2)}
.senza{border:1px dashed var(--line2);border-radius:var(--r2);background:var(--surf);padding:var(--sp4);display:grid;gap:var(--sp3)}
.senza .riga{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp3);align-items:start;padding-top:var(--sp3);border-top:1px solid var(--line)}
.senza .riga .acts{grid-column:2;margin:0}
.cards{display:none;gap:var(--sp3)}
.rcard{display:grid;gap:4px;text-align:left;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:var(--sp4);cursor:pointer;color:var(--ink);width:100%}

/* ---------------- impostazioni ---------------- */
.esito{display:flex;gap:var(--sp3);align-items:flex-start;padding:9px var(--sp4);border-radius:var(--r2);border:1px solid var(--line2);background:var(--surf2);font-size:var(--t-ms)}
.esito.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.esito.no{background:var(--ver-soft);border-color:var(--ver-line);color:var(--ver)}
.go{display:flex;align-items:center;gap:var(--sp3);padding:9px var(--sp4);border-radius:var(--r2);background:var(--surf);border:1px solid var(--line2);font-size:var(--t-sm);color:var(--ink2)}
.go span{flex:1;min-width:0}
.set{display:grid;grid-template-columns:238px 358px minmax(0,1fr);min-height:0;height:100%}
.set.due{grid-template-columns:238px minmax(0,1fr)}
.form{padding:var(--sp6) var(--sp6) var(--sp7);max-width:860px;display:grid;gap:var(--sp6)}
.fs{border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:var(--sp5);display:grid;gap:var(--sp4)}
.fs>header{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap}
.fs>header h3{font-size:var(--t-md)}
.fs .hint{font-size:var(--t-sm);color:var(--ink3);max-width:70ch}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--sp4)}
.send{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:var(--sp4);align-items:center;padding:9px var(--sp4);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.send.off{opacity:.7}
.send .em{font-family:var(--fm);font-size:var(--t-sm);overflow-wrap:anywhere}
.send .nmr{font-weight:500}
.send .rl{font-size:var(--t-xs);color:var(--ink3)}
.addsend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) auto;gap:var(--sp3);align-items:end;padding:var(--sp4);border:1px dashed var(--line2);border-radius:var(--r2);background:var(--surf2)}
.sw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp4);align-items:start;padding:10px var(--sp4);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.sw .tr{width:38px;height:22px;border-radius:999px;background:var(--sunken);border:1px solid var(--line2);position:relative}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surf);border:1px solid var(--line2)}
.sw[aria-pressed="true"] .tr{background:var(--acc);border-color:var(--acc)}
.sw[aria-pressed="true"] .tr::after{left:18px}
.sw .d{font-size:var(--t-sm);color:var(--ink3);margin-top:2px}
.pick{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:var(--sp3);align-items:center;padding:7px var(--sp4);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.pick input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.fldi{min-height:30px;padding:4px 8px;border:1px solid var(--line2);border-radius:var(--r2)}
.rfqhead{padding:var(--sp5) var(--sp6) var(--sp4);background:var(--paper)}
.rfqbody{overflow:auto;min-height:0}
.rfq{padding:0 var(--sp6) var(--sp6);display:grid;gap:var(--sp5);max-width:1060px}

.inbox-pann{display:none}
@media (max-width:1320px) and (min-width:821px){
  .inbox-pann{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line)}
  .panes{position:relative}
  .panes.panes--dati .p-ctx{display:block;position:absolute;top:0;right:0;bottom:0;width:min(360px,45vw);z-index:40;overflow:auto;background:var(--paper);border-left:1px solid var(--line2);box-shadow:-10px 0 24px var(--ombra)}
}
@media (min-width:1041px){ .inbox-pann [data-inbox-rail]{display:none} }
@media (max-width:1040px) and (min-width:821px){
  .panes.panes--rail .p-rail{display:block;position:absolute;top:0;left:0;bottom:0;width:260px;z-index:40;overflow:auto;background:var(--paper);border-right:1px solid var(--line2);box-shadow:10px 0 24px var(--ombra)}
}
@media (max-width:1320px){.panes{grid-template-columns:224px 330px minmax(0,1fr)}.p-ctx{display:none}
  .set{grid-template-columns:224px 320px minmax(0,1fr)}.gwrap.con-senza{grid-template-columns:1fr}}
@media (max-width:1040px){.panes{grid-template-columns:320px minmax(0,1fr)}.panes .p-rail{display:none}
  .set{grid-template-columns:300px minmax(0,1fr)}.set .p-rail{display:none}}
@media (max-width:820px){
  .panes,.set,.set.due{grid-template-columns:minmax(0,1fr);height:auto}
  .pane{overflow:visible;border-right:0;border-bottom:1px solid var(--line2)}
  .panes .p-rail,.p-ctx{display:block}
  .stream{max-width:none;padding:var(--sp4) 16px var(--sp6)}
  .msg,.card,.xref{max-width:100%}
  .cart .grid{grid-template-columns:1fr 1fr;grid-auto-flow:row}
  .cart .cell:first-child{grid-column:1/-1}
  .cart .cell{border-left:0;border-top:1px solid var(--line2)}
  .chead,.lhead{position:static;padding-left:16px;padding-right:16px}
  .rfqblock{grid-template-columns:auto minmax(0,1fr)}
  .rfqblock .acts{flex:1 1 100%;justify-content:stretch}
  .rfqblock .acts .btn{width:100%}
  .gest{height:auto}.ghead,.gfasi,.gbody{padding-left:16px;padding-right:16px}
  .desk{display:none}.cards{display:grid}
  .form{padding:var(--sp5) 16px var(--sp7)}
  .send{grid-template-columns:auto minmax(0,1fr);row-gap:var(--sp2)}
  .row{padding-left:13px;padding-right:16px}
  .navb{min-height:40px}
}
</style>

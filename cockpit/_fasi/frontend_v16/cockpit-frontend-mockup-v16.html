<title>Cockpit Inbox Promatec</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* v16 · il sistema visivo (SPEC_v16 §1). Un solo tema, chiaro, come la pagina vera di Pietro (motore_a.css).
   Carta e inchiostro, verde petrolio per l'azione, colore solo per lo stato.
   TUTTI i colori stanno qui, nei token su :root. Fuori da questo blocco nessun colore scritto a mano (M12): il test lo cerca.
   Nel Cockpit vero i font non si scaricano da internet: qui è solo per l'artifact (nota per Pietro). */
:root{
  color-scheme:light;
  --paper:#F2F4F6; --surf:#FFFFFF; --surf2:#F8FAFB; --sunken:#EDF0F3;
  --ink:#141A21; --ink2:#4F5966; --ink3:#5C6673; --ink4:#8A939E;
  --line:#E1E5EA; --line2:#CBD2DA; --ink-line:#2F363D;
  --acc:#0F4C5C; --acc-ink:#FFFFFF; --acc-soft:#E2EFF2; --acc-line:#9DC0C8; --acc-hover:#0B3B47;
  --ok:#1D6B41; --ok-soft:#E2F1E8; --ok-line:#A6CDB5;
  --ver:#8A5A00; --ver-soft:#FAF0DA; --ver-line:#DEC48C;
  --ko:#B03A16; --ko-soft:#FAE9E2; --ko-line:#E4B3A1;
  --info:#2B5F8A; --info-soft:#E4EEF7; --info-line:#A9C4DD;
  --prop:#27707F; --prop-soft:#EEF7F9; --prop-line:#A9D0D8;
  --pa:#7A3E6E; --pa-soft:#F7EDF4; --pa-line:#D8B3CF;
  --off:#5C6570; --off-soft:#EEF0F2;
  --line-campo:#7E8792;
  --t-finito:var(--acc); --t-sottoassieme:var(--info); --t-sciolto:#6B3FB5; --t-sciolto-soft:#F1ECF9; --t-commerciale:var(--ver);
  --linea-file:1.5px dashed var(--ink4); --linea-conf:2px solid var(--ok);
  --sk-tratto:#2F363D; --sk-fondo:#FFFFFF; --sk-quota:#8A939E;
  --carta:#FFFFFF; --carta-ink:#171715; --carta-k:#5B5B55; --carta-line:#E2E2DD; --carta-th:#F4F4F1;
  --ombra:rgba(20,26,33,.10); --velo:rgba(20,26,33,.38);
  /* avatar dei clienti e settori: colori di riconoscimento, non di stato */
  --av1:#A93127; --av2:#4A6B2A; --av3:#2B5D9E; --av4:#8A5300; --av5:#574099; --av6:#4F5A63; --av7:#8A4B2A; --av8:#3F7A5C; --av9:#6B7D2A; --av-off:#9AA3AD; --av-ink:#FFFFFF;
  --s-agri:#4A6B2A; --s-off:#8A5300; --s-lift:#2B5D9E; --s-rail:#4F5A63; --s-auto:#574099; --s-constr:#8A4B2A; --s-altri:#6B6B64;
  /* misure: griglia di 4 px */
  --t-xs:.6875rem; --t-sm:.78125rem; --t-ms:.84375rem; --t-base:.90625rem; --t-md:1rem; --t-lg:1.1875rem; --t-xl:1.5rem;
  --sp1:4px; --sp2:6px; --sp3:8px; --sp4:12px; --sp5:16px; --sp6:20px; --sp7:28px;
  --r1:3px; --r2:6px; --r3:10px;
  --sh1:0 1px 2px var(--ombra);
  --fd:"Barlow Semi Condensed","Bahnschrift SemiCondensed","Arial Narrow",sans-serif;
  --fb:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --h-testa:48px; --h-barra:40px;
}
/* ======================= fine dei token: sotto, solo var(--…) ======================= */
html{scrollbar-color:var(--line2) var(--surf2);scrollbar-width:thin}
*{scrollbar-color:var(--line2) transparent}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 var(--t-base)/1.5 var(--fb);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surf)}
input:not([type=checkbox]):not([type=radio]),select,textarea{border-color:var(--line-campo)}
h1,h2,h3,h4{margin:0;font-family:var(--fd);line-height:1.15;font-weight:700}
p{margin:0}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
::selection{background:var(--acc-soft)}
svg{display:block;flex:none}
a{color:var(--acc)}
.grid>*,.g>*{min-width:0}
.mono{font-family:var(--fm);font-weight:500;letter-spacing:-.01em}
.k{color:var(--ink2)}
.k3{color:var(--ink3)}
.piccolo{font-size:var(--t-sm)}
.lab{font-family:var(--fd);font-size:var(--t-xs);line-height:1.2;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}
.hr{height:1px;background:var(--line);border:0;margin:0}
.ticks{height:5px;background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 8px);opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .row,.navb,.btn,.ma-btn,.chip,.staz,.ma-scheda{transition:background-color .12s ease,border-color .12s ease,color .12s ease}
}

/* ---------------- pulsanti: uno solo pieno per schermata ---------------- */
.btn,.ma-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:4px 12px;border-radius:var(--r2);
  border:1px solid var(--line2);background:var(--surf);color:var(--ink);font-weight:500;font-size:var(--t-ms);cursor:pointer;
  white-space:nowrap;line-height:1.2;text-decoration:none}
.btn:hover,.ma-btn:hover{border-color:var(--acc);color:var(--acc)}
.btn svg,.ma-btn svg{width:14px;height:14px}
.btn.pri,.ma-btn--pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600;font-family:var(--fd);font-size:var(--t-md);letter-spacing:.01em}
.btn.pri:hover,.ma-btn--pri:hover{background:var(--acc-hover);border-color:var(--acc-hover);color:var(--acc-ink)}
.btn.sm,.ma-btn--sm{min-height:26px;padding:2px 9px;font-size:var(--t-sm)}
.btn.sm.pri,.ma-btn--sm.ma-btn--pri{font-size:var(--t-ms)}
.btn.xl{min-height:42px;padding:0 18px;font-size:var(--t-md)}
.btn.ghost,.ma-btn--ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover,.ma-btn--ghost:hover{background:var(--sunken);color:var(--ink);border-color:transparent}
.btn.danger,.ma-btn--danger{color:var(--ko);border-color:var(--ko-line)}
.btn.danger:hover,.ma-btn--danger:hover{background:var(--ko-soft);color:var(--ko);border-color:var(--ko)}
.btn[disabled],.ma-btn[disabled]{cursor:not-allowed;opacity:1;color:var(--off);background:var(--off-soft);border:1px dashed var(--off);
  background-image:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 6px);font-weight:500;font-family:var(--fb);font-size:var(--t-sm)}
.btn[disabled]:hover,.ma-btn[disabled]:hover{color:var(--off);border-color:var(--off)}
.btn.pa,.pa-btn{border-color:var(--pa-line);color:var(--pa);background:var(--surf)}
.btn.pa:hover,.pa-btn:hover{background:var(--pa-soft);border-color:var(--pa);color:var(--pa)}

/* ---------------- chip e stati: mai solo colore, sempre la parola ---------------- */
.chip,.ma-st{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-size:var(--t-xs);font-weight:500;line-height:1.35;
  border-radius:var(--r1);padding:1px 7px;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip svg{width:12px;height:12px}
.chip.ok,.ma-st--ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.chip.prop,.ma-st--prop{background:var(--prop-soft);color:var(--prop);border-color:var(--prop-line)}
.chip.warn,.chip.ver,.ma-st--ver{background:var(--ver-soft);color:var(--ver);border-color:var(--ver-line)}
.chip.bad,.chip.ko,.ma-st--ko{background:var(--ko-soft);color:var(--ko);border-color:var(--ko-line)}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.chip.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.chip.neu,.ma-st--neu{background:var(--sunken);color:var(--ink2);border-color:var(--line2)}
.chip.ghost,.ma-st--na{background:transparent;color:var(--ink3);border-color:var(--line2)}
.chip.pa{background:var(--pa-soft);color:var(--pa);border-color:var(--pa-line)}
.ma-st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.ma-st--na::before{display:none}
.ma-st--sm{font-size:var(--t-xs)}
.ma-st--piatto::before{display:none}
/* chip della fonte del dato (zona B) e del dato di prova */
.fonte{display:inline-block;font:500 var(--t-xs)/1.4 var(--fm);text-transform:uppercase;letter-spacing:.02em;padding:0 5px;border-radius:var(--r1);
  background:var(--sunken);color:var(--ink2);border:1px solid var(--line)}
.dato{display:inline-block;font:500 var(--t-xs)/1.4 var(--fb);padding:0 6px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.dato.mod99{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.dato.inventato{color:var(--ver);border-color:var(--ver-line);background:var(--ver-soft)}
.dato.prova{color:var(--ink2);background:var(--sunken)}

/* ---------------- moduli ---------------- */
.fld{display:grid;gap:4px;min-width:0;align-content:start}
.fld>span{font-size:var(--t-sm);color:var(--ink2);font-weight:500}
.fld input,.fld select,.fld textarea{min-height:30px;padding:4px 9px;border:1px solid var(--line-campo);border-radius:var(--r2);background:var(--surf);width:100%}
.fld input:hover,.fld select:hover{border-color:var(--ink3)}
.fld small{font-size:var(--t-xs);color:var(--ink3)}
.fld.mono input{font-family:var(--fm);font-size:var(--t-sm)}
input::placeholder,textarea::placeholder{color:var(--ink3)}

/* ---------------- tabelle ---------------- */
table.tb{width:100%;border-collapse:collapse}
table.tb th{font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:6px var(--sp4);background:var(--surf2);border-bottom:1px solid var(--line2);white-space:nowrap}
table.tb td{padding:7px var(--sp4);border-bottom:1px solid var(--line);vertical-align:middle;font-size:var(--t-ms)}
table.tb tr:last-child td{border-bottom:0}
.wrap-tb{border:1px solid var(--line);border-radius:var(--r2);overflow:auto;background:var(--surf)}

/* ---------------- guscio dell'applicazione ---------------- */
.shell{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.shell.ws-on{grid-template-rows:minmax(0,1fr)}
.shell.ws-on>.top,.shell.ws-on>.ticks{display:none}
.top{display:flex;align-items:center;gap:var(--sp5);height:48px;padding:0 var(--sp5);background:var(--surf);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:var(--sp3);min-width:0}
.brand .mark{width:26px;height:26px;border-radius:5px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.brand-nm{font-family:var(--fd);font-weight:700;font-size:1.0625rem;letter-spacing:.02em;line-height:1;display:block}
.brand-sub{display:block;font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);line-height:1.2}
.tabs{display:flex;gap:2px;margin-left:var(--sp4);min-width:0}
.tabs button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 11px;border-radius:var(--r2);cursor:pointer;font-weight:500;color:var(--ink2);white-space:nowrap}
.tabs button:hover{background:var(--sunken);color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.tag{font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;
  background:var(--ver-soft);color:var(--ver);border:1px solid var(--ver-line);white-space:nowrap}
.me{display:flex;align-items:center;gap:var(--sp3);font-size:var(--t-ms);color:var(--ink2);white-space:nowrap}
.body{min-height:0;display:grid;overflow:hidden}
.av{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;font-family:var(--fd);font-size:var(--t-xs);font-weight:700;
  letter-spacing:.02em;color:var(--av-ink);flex:none}
.av.lg{width:30px;height:30px;font-size:var(--t-sm);border-radius:var(--r2)}
.sett{display:inline-block;width:6px;height:6px;border-radius:2px;flex:none}
.empty{max-width:440px;margin:var(--sp7) auto;text-align:center;color:var(--ink2);padding:0 var(--sp5)}
.empty .ib{width:44px;height:44px;border-radius:var(--r3);background:var(--sunken);color:var(--ink3);display:grid;place-items:center;margin:0 auto var(--sp4)}
.empty h3{font-size:var(--t-md);margin-bottom:var(--sp2);color:var(--ink)}
.empty p{font-size:var(--t-ms)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp3);padding:8px var(--sp4);border-radius:var(--r2);font-size:var(--t-ms);border:1px solid var(--line2);background:var(--surf2)}
.strip svg{width:15px;height:15px}
.strip.okk{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.strip.terzisti{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.strip b{font-weight:600}
@media (max-width:820px){
  html,body{height:auto}
  body{overflow:auto}
  .shell{height:auto;min-height:100%}
  .top{height:auto;min-height:48px;flex-wrap:wrap;gap:var(--sp3);padding:6px 16px}
  .tabs{margin-left:0;order:3;width:100%;overflow-x:auto}
  .tabs button{min-height:40px}
  .btn,.ma-btn{min-height:40px}
  .btn.sm,.ma-btn--sm{min-height:36px}
  .me .nmr{display:none}
}
</style>

<div class="shell" id="shell">
  <header class="top">
    <span class="brand">
      <span class="mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg></span>
      <span><span class="brand-nm">PROMATEC</span><span class="brand-sub">Cockpit RFQ</span></span>
    </span>
    <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
    <span class="sp"></span>
    <span class="tag">Mockup</span>
    <span class="me"><span class="av" style="background:var(--av6)">FP</span><span class="nmr">Franco · commerciale</span></span>
  </header>
  <div class="ticks" aria-hidden="true"></div>
  <div class="body" id="body"></div>
</div>
<style>
/* v15 · Inbox, elenco delle RFQ e impostazioni (SPEC §2.1). Correzioni: A1 (.fsize), A2 (.brand-sub), M1 (date nowrap,
   colonne auto), B6 (title sui nomi tagliati). Solo token: nessun colore scritto qui. */

/* ---------------- Inbox: quattro riquadri ---------------- */
.panes{display:grid;grid-template-columns:238px 350px minmax(0,1fr) 312px;min-height:0;height:100%}
.pane{min-width:0;min-height:0;overflow:auto;border-right:1px solid var(--line);background:var(--surf)}
.pane:last-child{border-right:0}
.p-rail{background:var(--surf2)}
.p-conv{background:var(--paper)}
.p-ctx{background:var(--surf2)}
.search{position:relative;margin:var(--sp4)}
.search input{width:100%;min-height:32px;padding:5px 10px 5px 32px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);font-size:var(--t-ms)}
.search .ic{position:absolute;left:9px;top:8px;color:var(--ink3)}
.railg{padding:var(--sp4) var(--sp4) var(--sp2)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 var(--sp3)}
.navb{display:flex;align-items:center;gap:var(--sp3);width:100%;text-align:left;background:none;border:0;border-radius:var(--r2);
  padding:6px var(--sp3);min-height:32px;cursor:pointer;color:var(--ink);font-size:var(--t-ms)}
.navb:hover{background:var(--sunken)}
.navb[aria-current="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600;box-shadow:inset 0 0 0 1px var(--acc-line)}
.navb .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-family:var(--fm);font-size:var(--t-xs);background:var(--sunken);color:var(--ink2);border-radius:999px;padding:1px 7px;white-space:nowrap}
.navb[aria-current="true"] .cnt{background:var(--surf);color:var(--acc)}
.lhead{position:sticky;top:0;z-index:4;background:var(--surf);border-bottom:1px solid var(--line2);padding:var(--sp4) var(--sp5) var(--sp3)}
.lhead h2{font-size:var(--t-lg)}
.lhead .meta{display:flex;align-items:center;gap:var(--sp2);margin-top:3px;font-size:var(--t-sm);color:var(--ink3);flex-wrap:wrap}
.lsub{display:flex;align-items:center;gap:var(--sp3);padding:8px var(--sp5) 6px;background:var(--surf2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lsub .n{font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp4);width:100%;text-align:left;background:var(--surf);
  border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;padding:10px var(--sp5);cursor:pointer;color:var(--ink)}
.row:hover{background:var(--surf2)}
.row[aria-current="true"]{background:var(--acc-soft);border-left-color:var(--acc)}
.r1{display:flex;align-items:baseline;gap:var(--sp3);min-width:0}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tm{margin-left:auto;font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3);white-space:nowrap}
.snip{font-size:var(--t-sm);color:var(--ink2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rchips{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:6px}
/* conversazione */
.chead{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);padding:var(--sp4) var(--sp5)}
.bc{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink3);margin-bottom:var(--sp3);flex-wrap:wrap}
.bc b{color:var(--ink2);font-weight:500}
.bc svg{width:14px;height:14px;color:var(--ink3)}
.cart{border:1.5px solid var(--ink-line);border-radius:var(--r1);background:var(--surf);overflow:hidden}

/* il titolo prende una riga intera, le altre celle sotto: nessuna cella schiaccia il titolo (M1) */
.cart .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.cart .cell:first-child{grid-column:1/-1;border-bottom:1px solid var(--line2)}
.cart .cell:nth-child(2){border-left:0}
.cart .cell{padding:8px var(--sp4);border-left:1px solid var(--line2);min-width:0;display:flex;flex-direction:column;gap:2px}
.cart .cell:first-child{border-left:0;background:var(--surf2)}
.cart .cell .v{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart .cell .v.wrap{white-space:normal;overflow-wrap:anywhere}
.cart h1{font-family:var(--fd);font-size:var(--t-lg);color:var(--ink);overflow-wrap:break-word;word-break:normal}
.cart .nome{font-size:var(--t-ms);color:var(--ink2)}
.cart .chip{align-self:flex-start}
.stream{padding:var(--sp5) var(--sp5) var(--sp7);display:flex;flex-direction:column;gap:var(--sp5);max-width:900px}
.day{display:flex;align-items:center;gap:var(--sp4);font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.day::before,.day::after{content:"";height:5px;flex:1;background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 7px)}
.msg{display:flex;flex-direction:column;gap:5px;max-width:92%}
.msg.out{align-self:flex-end;align-items:flex-end}
.who{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink3);flex-wrap:wrap}
.who b{color:var(--ink);font-weight:600}

.cg-lotti input{width:16ch;min-height:28px;border:1px solid var(--line2);border-radius:var(--r1);padding:2px 6px;background:var(--surf);color:var(--ink)}
.ma-zona-c{margin:4px 0;font-size:var(--t-sm)}
.ma-zona-c>summary{cursor:pointer;color:var(--ink3);font-family:var(--fd);font-weight:600;padding:4px 0;list-style-position:inside}
.ma-zona-c[open]>summary{color:var(--ink2)}
.staz-elenco{display:flex;flex:1;min-width:0;overflow:hidden}
.staz[data-staz="1"]{flex:0 0 auto}
.staz{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:0 14px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;cursor:pointer;color:var(--ink2);white-space:nowrap;min-width:0}
.staz:hover{background:var(--surf);color:var(--ink)}
.staz[aria-current="step"]{border-bottom-color:var(--acc);color:var(--ink);background:var(--surf)}
.staz-n{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);font:700 var(--t-sm)/1 var(--fd);flex:none;background:var(--surf)}
.staz[aria-current="step"] .staz-n{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.staz--b .staz-n{border-color:var(--pa-line)}
.staz-t{font-family:var(--fd);font-weight:700;font-size:var(--t-md);white-space:nowrap}
.staz-c{font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.cassetti-btn{display:flex;align-items:stretch;border-left:1px solid var(--line2)}
.cas-btn{display:flex;align-items:center;gap:6px;padding:0 12px;background:none;border:0;border-left:1px solid var(--line);cursor:pointer;color:var(--ink2);white-space:nowrap;font-size:var(--t-sm)}
.cas-btn:hover{background:var(--surf);color:var(--ink)}
.cas-btn[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.cas-btn>span:first-child{font-size:var(--t-md)}

/* zona B: la fascia e la striscia prugna; zona C: spento con il motivo accanto */
.banda-b{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:28px;padding:5px 12px;background:var(--pa-soft);color:var(--pa);
  border-left:4px solid var(--pa);border-radius:0 var(--r1) var(--r1) 0;font-size:var(--t-sm)}
.banda-b-t{font-family:var(--fd);font-weight:700;font-size:var(--t-xs);letter-spacing:.04em;text-transform:uppercase}
.banda-b-r{font-family:var(--fm);font-size:var(--t-xs);margin-left:auto;white-space:nowrap}
.striscia-b{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;margin-top:12px;background:var(--pa-soft);color:var(--pa);border:1px dashed var(--pa-line);border-radius:var(--r2);font-size:var(--t-sm)}
.striscia-b-t{font-family:var(--fd);font-weight:700;font-size:var(--t-xs);letter-spacing:.04em;text-transform:uppercase;width:100%}
.striscia-b i{color:var(--ink2)}
.ma-na{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
.ma-na small{font-size:var(--t-xs);color:var(--off);max-width:46ch}
.staz-vuota{padding:16px 20px;display:grid;gap:12px;align-content:start}

/* ================= stazione ①: il workspace A1d ================= */
.ma{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;height:100%;min-width:0}
.ma>*{min-width:0}
.ma-navi{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:6px 16px;background:var(--surf);border-bottom:1px solid var(--line)}
.ma-viste{display:flex;gap:2px}
.ma-vista{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--r2);color:var(--ink2);text-decoration:none;font-weight:500;font-size:var(--t-ms);min-height:30px;white-space:nowrap}
.ma-vista:hover{background:var(--sunken);color:var(--ink)}
.ma-vista[aria-current="page"]{background:var(--ink);color:var(--paper)}
.ma-vista-n{font-family:var(--fm);font-size:var(--t-xs);opacity:.85}
.ma-thread-gesti{display:flex;gap:4px;flex-wrap:wrap}
#ma-avviso{display:flex;align-items:center;gap:8px;margin:8px 16px 0;padding:7px 8px 7px 12px;border-radius:var(--r2);font-size:var(--t-ms);border:1px solid var(--line2);background:var(--surf2)}
#ma-avviso[hidden]{display:none}
#ma-avviso>span{flex:1;min-width:0}
#ma-avviso[data-esito="ok"]{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
#ma-avviso[data-esito="no"]{background:var(--ver-soft);border-color:var(--ver-line);color:var(--ver)}
#ma-avviso[data-esito="errore"]{background:var(--ko-soft);border-color:var(--ko-line);color:var(--ko)}
/* v16 rev. (P-01, P-16, M-10): UN workspace per Distinta e Documenti, come ma_workspace di motore_a.html. La pagina scorre
   tutta insieme; in alto Documenti (R9) e Da smistare (R8), sotto Analisi, Conferma dell'albero e albero (R3 R4 R5 R7),
   a destra l'anteprima (R6) che resta in vista. Punti di rottura di motore_a.css: 1180 e 860 px. */
.ma-ws{overflow:auto;min-height:0;min-width:0;container:ma-ws / inline-size}
.ma-ws-griglia{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,30%,400px);grid-template-areas:"doc destra" "centro lato";align-items:start;min-width:0}
.ma-ws-griglia>*{min-width:0}
.ma-ws-doc{grid-area:doc;padding:12px 16px 6px;display:grid;gap:10px;align-content:start}
.ma-ws-destra{grid-area:destra;align-self:stretch;border-left:1px solid var(--line2);background:var(--surf);padding:12px 14px 10px}
.ma-ws-centro{grid-area:centro;padding:12px 16px 28px;display:grid;gap:12px;align-content:start;border-top:1px solid var(--line)}
.ma-ws-centro>*{min-width:0}
.ma-ws-lato{grid-area:lato;position:sticky;top:0;align-self:start;max-height:calc(100vh - 150px);overflow:auto;border-left:1px solid var(--line2);border-top:1px solid var(--line);background:var(--surf);padding:12px 14px 28px}
.ma-ws--lato-chiuso .ma-ws-griglia{grid-template-areas:"doc destra" "centro centro"}
.ma-ws--lato-chiuso .ma-ws-lato{display:none}
.ma-riepilogo{overflow:auto;padding:12px 16px 28px;display:grid;gap:12px;align-content:start;min-height:0}
.ma-fs{border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:12px 14px;display:grid;gap:10px;min-width:0}
.ma-fs-testa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ma-fs-testa h2,.ma-fs-testa h3,.ma-fs>summary h2{font-size:var(--t-md)}
.ma-fs-testa svg{color:var(--ink3)}
.ma-muto,.ma-k3{color:var(--ink3)}
.ma-piccolo{font-size:var(--t-sm)}
.ma-mono{font-family:var(--fm)}
.ma-vuoto,.ma-hint{color:var(--ink3);font-size:var(--t-ms)}
.ma-nota{font-size:var(--t-sm);color:var(--ink2);background:var(--surf2);border-left:3px solid var(--line2);padding:5px 10px;border-radius:0 var(--r1) var(--r1) 0}
.ma-nota--cand{border-left-color:var(--prop);background:var(--prop-soft);color:var(--ink2)}
.ma-nota--ver{color:var(--ver)}
.ma-u07{border-left-color:var(--acc)}
.ma-motivo{display:inline-block;font-size:var(--t-xs);color:var(--ink2);background:var(--sunken);border-radius:var(--r1);padding:0 6px;line-height:1.5}
.ma-badge{display:inline-flex;align-items:center;font-size:var(--t-xs);border:1px solid var(--line2);border-radius:999px;padding:0 7px;color:var(--ink2);background:var(--surf);white-space:nowrap}
.ma-badge--conf{border-color:var(--ok-line);color:var(--ok)}
.ma-badge--prop{border-color:var(--prop-line);color:var(--prop);border-style:dashed}
.ma-badge--ver{border-color:var(--ver-line);color:var(--ver)}
.ma-ext{display:inline-grid;place-items:center;min-width:36px;height:20px;padding:0 4px;border-radius:var(--r1);font:700 var(--t-xs)/1 var(--fd);letter-spacing:.04em;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc-line)}
.ma-ext--step{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.ma-btn--acc{border-color:var(--acc);color:var(--acc);font-weight:600}
.ma-btn--acc:hover{background:var(--acc-soft)}
.ma-btn--conferma{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
/* R3 · analisi del prodotto */
.ma-analisi-box{border-left:4px solid var(--prop)}
.ma-analisi-box--ok{border-left-color:var(--ok)}
.ma-analisi-box--chiusa{padding:8px 14px}
.ma-fonte-riga{font-size:var(--t-sm)}
.ma-analisi{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr);gap:8px 20px}
.ma-analisi>*{min-width:0}
.ma-decisioni,.ma-letti,.ma-elenco{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:var(--t-ms)}
.ma-letto{display:grid;gap:4px 12px;padding:8px 10px;border:1px dashed var(--prop-line);border-radius:var(--r2);background:var(--prop-soft)}
.ma-letto--cand{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.ma-letto-dati{display:grid;gap:4px;min-width:0}
.ma-letto--cand .ma-letto-gesti{display:grid;justify-items:end;gap:2px;max-width:240px;text-align:right}
.ma-letto--bom{border-style:solid;border-color:var(--ok-line);background:var(--ok-soft)}
.ma-letto-r1,.ma-letto-r2,.ma-letto-gesti{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ma-letto-r1 .mono{overflow-wrap:anywhere}
.ma-letti-file{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ma-file-n{display:inline-flex;gap:4px;align-items:center;font-family:var(--fm);font-size:var(--t-xs)}
.ma-riferimento{display:grid;gap:6px}
.ma-gesto--riga{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
/* R4 · conferma dell'albero */
.ma-barra-albero{display:grid;gap:6px;padding:8px 14px;border:1.5px solid var(--acc-line);border-radius:var(--r2);background:var(--surf)}
.ma-barra-albero--ok{border-color:var(--ok-line)}
.ma-barra-riga{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ma-barra-t{font-size:var(--t-xs);color:var(--ink)}
.ma-barra-assi{font-size:var(--t-sm);color:var(--ink2);display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.ma-barra-rfq{font-size:var(--t-xs);color:var(--ink3);white-space:nowrap}
.ma-barra-nota{font-size:var(--t-xs);padding:3px 8px}
/* R5 · schede e tela */
.ma-strumenti{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ma-strumenti-perche{font-size:var(--t-xs);color:var(--off);flex:1 1 260px}
.ma-tela-ctl{display:inline-flex;align-items:center;gap:2px;flex-wrap:wrap}
.ma-zoom{font-size:var(--t-xs);color:var(--ink3);min-width:38px;text-align:center}
.ma-schede-riga{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;border-bottom:1px solid var(--line2)}
.ma-schede{display:flex;gap:4px;flex-wrap:wrap}
.ma-schede-riga .ma-strumenti{margin-left:auto;padding-bottom:5px;justify-content:flex-end;max-width:640px}
.ma-schede-riga .ma-strumenti-perche{flex:1 1 100%;text-align:right}
.ma-scheda{display:grid;text-align:left;gap:0;padding:5px 12px;border:1px solid var(--line2);border-bottom:0;border-radius:var(--r2) var(--r2) 0 0;background:var(--surf2);cursor:pointer;color:var(--ink2);margin-bottom:-1px;max-width:100%}
.ma-scheda small{font-family:var(--fm);font-size:var(--t-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma-scheda[aria-selected="true"]{background:var(--surf);color:var(--ink);border-color:var(--line2);box-shadow:inset 0 3px 0 var(--acc)}
.ma-scheda--cand{border-style:dashed}
.ma-scheda--cand[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--prop)}
.ma-pannello-albero{display:grid;gap:8px;min-width:0}
.ma-tela-testa{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ma-tela-testa .ma-nota{width:100%}
.ma-tela{position:relative;overflow:auto;padding:12px 8px 16px;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r2);min-width:0;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
.ma-tela--dx{box-shadow:inset -18px 0 14px -14px var(--ombra)}
.ma-tela--sx{box-shadow:inset 18px 0 14px -14px var(--ombra)}
.ma-tela--sx.ma-tela--dx{box-shadow:inset -18px 0 14px -14px var(--ombra),inset 18px 0 14px -14px var(--ombra)}
.ma-dtree,.ma-dtree ul{margin:0;padding:0}
.ma-dtree{display:flex;justify-content:center;gap:16px;min-width:max-content;zoom:var(--z,1)}
.ma-dtree ul{padding-top:26px;position:relative;display:flex;justify-content:center}
.ma-dtree li{--linea:var(--linea-file);list-style:none;position:relative;padding:26px 6px 0;display:flex;flex-direction:column;align-items:center}
.ma-dtree li.ma-li--conf{--linea:var(--linea-conf)}
.ma-dtree>li{padding-top:0}
.ma-dtree li::before,.ma-dtree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:26px;border-top:var(--linea)}
.ma-dtree li::after{right:auto;left:50%;border-left:var(--linea)}
.ma-dtree>li::before,.ma-dtree>li::after{display:none}
.ma-dtree li:only-child::before,.ma-dtree li:only-child::after{display:none}
.ma-dtree li:first-child::before,.ma-dtree li:last-child::after{border:0}
.ma-dtree li:last-child::before{border-right:var(--linea);border-radius:0 8px 0 0}
.ma-dtree li:first-child::after{border-radius:8px 0 0 0}
.ma-dtree ul::before{content:"";position:absolute;top:0;left:50%;height:26px;border-left:1.5px solid var(--line2)}
.ma-dtree li:only-child>.ma-nodo-box::before{content:"";position:absolute;top:-26px;left:50%;height:26px;border-left:var(--linea)}
.ma-dtree>li:only-child>.ma-nodo-box::before{display:none}
.ma-dtree li:focus{outline:none}
.ma-nodo-box{position:relative;display:flex;flex-direction:column;align-items:center}
.ma-qta-arco{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-bottom:5px;position:relative;z-index:1;max-width:168px}
.ma-qta{display:inline-block;font:600 var(--t-xs)/1.5 var(--fm);border:1px solid var(--line2);border-radius:999px;padding:0 6px;color:var(--ink2);background:var(--surf);white-space:nowrap}
.ma-qta--conf{border-color:var(--ok-line);color:var(--ok)}
.ma-qta--manca{border-style:dotted;color:var(--ink3);font-family:var(--fb);font-weight:500}
.ma-nodo{width:168px;display:grid;gap:4px;padding:7px 9px 8px;border:1.5px solid var(--line2);border-top-width:4px;border-radius:var(--r2);background:var(--surf);cursor:pointer;text-align:left;position:relative}
.ma-nodo:hover{border-color:var(--acc)}
.ma-nodo--finito{border-top-color:var(--t-finito);border-color:var(--ink-line)}
.ma-nodo--sottoassieme{border-top-color:var(--t-sottoassieme)}
.ma-nodo--sciolto{border-top-color:var(--t-sciolto)}
.ma-nodo--commerciale{border-top-color:var(--t-commerciale)}
.ma-nodo:not(.ma-nodo--proposto){border-left-color:var(--ink-line);border-right-color:var(--ink-line);border-bottom-color:var(--ink-line)}
.ma-nodo--proposto{border-style:dashed;border-top-style:solid;border-color:var(--prop-line);background:var(--surf2)}
.ma-nodo--proposto.ma-nodo--finito,.ma-nodo--proposto.ma-nodo--sottoassieme,.ma-nodo--proposto.ma-nodo--sciolto,.ma-nodo--proposto.ma-nodo--commerciale{border-left-color:var(--prop-line);border-right-color:var(--prop-line);border-bottom-color:var(--prop-line)}
.ma-nodo--proposto.ma-nodo--finito{border-top-color:var(--t-finito)}
.ma-nodo--proposto.ma-nodo--sottoassieme{border-top-color:var(--t-sottoassieme)}
.ma-nodo--proposto.ma-nodo--sciolto{border-top-color:var(--t-sciolto)}
.ma-nodo--proposto.ma-nodo--commerciale{border-top-color:var(--t-commerciale)}
.ma-nodo--scartato{opacity:.6;background:var(--sunken)}
.ma-nodo--scartato .ma-nodo-cod{text-decoration:line-through}
.ma-dtree li[aria-selected="true"]>.ma-nodo-box>.ma-nodo{outline:3px solid var(--acc);outline-offset:2px}
.ma-dtree li:focus-visible>.ma-nodo-box>.ma-nodo{outline:2.5px dashed var(--acc);outline-offset:3px}
.ma-nodo.ma-drop{background:var(--acc-soft);outline:3px dashed var(--acc)}
.ma-nodo.ma-drop-no{outline:2px dashed var(--line2);cursor:not-allowed}
.ma-nodo[draggable="true"]{cursor:grab}
.ma-nodo-testa{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:20px;flex-wrap:wrap}
.ma-tipo{display:inline-block;font:700 var(--t-xs)/1.45 var(--fd);letter-spacing:.04em;text-transform:uppercase;padding:0 6px;border:1px solid transparent;border-radius:var(--r1);white-space:nowrap;background:var(--sunken);color:var(--ink2)}
.ma-tipo--finito{color:var(--t-finito);background:var(--acc-soft)}
.ma-tipo--sottoassieme{color:var(--t-sottoassieme);background:var(--info-soft)}
.ma-tipo--sciolto{color:var(--t-sciolto);background:var(--t-sciolto-soft)}
.ma-tipo--commerciale{color:var(--t-commerciale);background:var(--ver-soft)}
.ma-tipo--proposto{background:transparent;border-style:dashed;border-color:currentColor}
.ma-proposto-tag{font-size:var(--t-xs);color:var(--prop);white-space:nowrap}
.ma-proposto-tag--neu{color:var(--ink3)}
.ma-nodo-cod{font:600 var(--t-ms)/1.25 var(--fm);letter-spacing:-.02em;overflow-wrap:anywhere;display:block}
.ma-segno{font-family:var(--fb);font-weight:700;margin-right:3px}
.ma-segno--conf{color:var(--ok)}.ma-segno--man{color:var(--ver)}.ma-segno--prop{color:var(--prop)}
.ma-rev{font-family:var(--fb);font-size:var(--t-xs);color:var(--ink3);margin-left:4px;font-weight:500}
.ma-piu{font-family:var(--fb);font-size:var(--t-xs);color:var(--ink3);margin-left:4px}
.ma-grezzo{color:var(--ink2)}
.ma-nodo-nome{font-size:var(--t-sm);color:var(--ink2);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ma-cat{font-size:var(--t-xs);color:var(--ver);border:1px dashed var(--ver-line);border-radius:var(--r1);padding:0 5px;justify-self:start}
.ma-cat--ok{color:var(--ok);border-style:solid;border-color:var(--ok-line)}
.ma-nodo-badge{display:flex;flex-wrap:wrap;gap:3px}
.ma-celle{display:flex;flex-wrap:wrap;gap:3px}
.ma-cella{font:700 var(--t-xs)/1.45 var(--fd);padding:0 5px;border-radius:var(--r1);border:1px solid var(--line);color:var(--ink2);letter-spacing:.03em;white-space:nowrap}
.ma-cella--ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.ma-cella--sugg{background:var(--prop-soft);color:var(--prop);border-color:var(--prop-line);border-style:dashed}
.ma-cella--manca{background:var(--ko-soft);color:var(--ko);border-color:var(--ko-line)}
.ma-cella--neu{font-family:var(--fb);font-weight:500;letter-spacing:0;color:var(--ink3)}
.ma-cella--b{border:1px dashed var(--pa-line);color:var(--pa);background:var(--pa-soft)}
.ma-dtree ul.ma-rastrello{display:grid;grid-template-columns:repeat(var(--col),184px);gap:14px 10px;justify-content:center;margin-top:24px;padding:16px 12px 10px;
  border:1.5px dashed var(--line2);border-radius:10px;background:var(--surf)}
.ma-dtree ul.ma-rastrello::before{top:-25px;height:24px}
.ma-dtree ul.ma-rastrello>li{padding:0;align-items:stretch}
.ma-dtree ul.ma-rastrello>li::after{display:none}
.ma-dtree ul.ma-rastrello>li::before{display:block;content:"";position:absolute;top:-16px;left:50%;right:auto;width:0;height:15px;border:0;border-left:var(--linea);border-radius:0}
.ma-dtree ul.ma-rastrello .ma-nodo{width:100%}
.ma-dtree ul.ma-rastrello .ma-qta-arco{max-width:none}
.ma-ramo{justify-self:start;font-size:var(--t-xs);background:var(--surf2);border:1px solid var(--line2);border-radius:999px;padding:0 8px;cursor:pointer;color:var(--ink2)}
.ma-legenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--t-xs);color:var(--ink2);align-items:center}
.ma-legenda>span{display:inline-flex;align-items:center;gap:5px}
.ma-leg-linea{display:inline-block;width:26px;height:0}
.ma-leg-linea--file{border-top:var(--linea-file)}
.ma-leg-linea--conf{border-top:var(--linea-conf)}
.ma-regola{display:flex;gap:6px;align-items:flex-start;font-size:var(--t-xs);color:var(--ink3)}
/* R6 · anteprima della casella e testata del pezzo */
.ma-anteprima-vuota{border-style:dashed;text-align:center;padding:20px 12px}
.ma-lato-btn{margin-top:8px}
.ma-anteprima{gap:10px;border:0;padding:0}
.ma-anteprima-testa{display:flex;align-items:flex-start;gap:6px}
.ma-anteprima-testa .lab{flex:1}
.tp{display:grid;gap:6px;padding:10px 12px;border:1.5px solid var(--ink-line);border-radius:var(--r1);background:var(--surf)}
.tp-r1{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.tp-cod{font-size:var(--t-lg);color:var(--ink);overflow-wrap:anywhere}
.tp-nome{color:var(--ink2);font-size:var(--t-ms)}
.tp-r2{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:var(--t-sm);padding-top:6px;border-top:1px solid var(--line)}
.tp-entra-v{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.tp-r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.tp-cella{display:grid;gap:2px;justify-items:start;min-width:0}
.tp-cella .ma-st{white-space:normal;overflow:visible}
.tp-cod .ma-nodo-cod{font-size:var(--t-lg)}
.tp-b{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:6px;border-top:1px dashed var(--pa-line);font-size:var(--t-sm);color:var(--pa)}
.tp-b i{color:var(--ink3)}
.ma-palco-barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ma-palco-file{font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ma-palco{border:1px solid var(--line2);border-radius:var(--r2);background:var(--sk-fondo);overflow:hidden}
.ma-palco--vuoto{display:grid;place-items:center;min-height:80px;color:var(--ink3);font-size:var(--t-sm);background:var(--surf2)}
.ma-palco--piccolo{max-width:260px}
.ma-palco--grande{max-width:900px;margin:0 auto}
.schizzo{display:block;width:100%;height:auto}
.ma-sez{border-top:1px solid var(--line);padding-top:6px}
.ma-sez>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;min-height:28px}
.ma-sez>summary::before{content:"▸";color:var(--ink3);font-size:var(--t-xs)}
.ma-sez[open]>summary::before{content:"▾"}
.ma-sez-t{font-size:var(--t-ms);font-family:var(--fd)}
.ma-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:6px 0 0;font-size:var(--t-sm)}
.ma-dl dt{color:var(--ink3)}
.ma-dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ma-catena{display:inline-flex;flex-wrap:wrap;gap:4px}
.ma-cod{font-family:var(--fm);font-size:var(--t-sm);padding:0 5px;border-radius:var(--r1);border:1px solid var(--line2)}
.ma-cod--conf{color:var(--ok);border-color:var(--ok-line)}
.ma-cod--man{color:var(--ver);border-color:var(--ver-line)}
.ma-cod--prop{color:var(--prop);border-color:var(--prop-line);border-style:dashed}
.ma-rif-tecnico{font-size:var(--t-xs);color:var(--ink3);overflow-wrap:anywhere}
.ma-posizione{display:grid;gap:8px;margin-top:6px}
.ma-pos-col{display:grid;gap:4px;min-width:0}
.ma-elenco li{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.ma-gesti-linea{display:inline-flex;flex-wrap:wrap;gap:4px}
.ma-gesti{display:grid;gap:10px;margin-top:6px}
.ma-gesto{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end;padding:8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.ma-gesto>small{width:100%;font-size:var(--t-xs)}
.ma-gesti-linea .ma-gesto,.ma-gesto--riga{padding:0;border:0;background:none}
.ma-campo{display:grid;gap:3px;min-width:0;flex:1 1 140px}
.ma-campo>span{font-size:var(--t-xs);color:var(--ink2);font-weight:500}
.ma-campo input,.ma-campo select{min-height:30px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r2);width:100%;background:var(--surf)}
.ma-campo--corto{flex:0 1 76px}
.ma-campo--largo{flex:1 1 100%}
.ma-campo--testo{font-size:var(--t-sm);color:var(--ink2);align-self:center}
.ma-gesti-pericolo{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding-top:8px;border-top:1px dashed var(--ko-line)}
.ma-gesti-pericolo .ma-gesto{border-color:var(--ko-line);background:var(--surf)}
/* la barra della domanda: la frase del contratto, sotto il pulsante */
.ma-domanda{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;margin-top:6px;padding:8px 10px;border:1.5px solid var(--acc);border-radius:var(--r2);background:var(--acc-soft);color:var(--ink);font-size:var(--t-sm)}
.ma-domanda-t{flex:1 1 240px;min-width:0}
.ma-domanda-b{display:flex;gap:6px}
td .ma-domanda{min-width:260px}
/* R7, R9, R10 · tabelle */
.ma-conflitti>summary,.ma-fs--chiusa>summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center}
.ma-conflitti>summary::before,.ma-fs--chiusa>summary::before{content:"▸";color:var(--ink3);font-size:var(--t-xs)}
.ma-conflitti[open]>summary::before,.ma-fs--chiusa[open]>summary::before{content:"▾"}
.ma-fs--chiusa>summary h3,.ma-fs--chiusa>summary h2{font-size:var(--t-ms)}
.ma-tabella td,.ma-tabella th{vertical-align:top}
.ma-voce--prodotto td{background:var(--surf2)}
.ma-gruppo-riga th{background:var(--sunken);text-transform:none;letter-spacing:0;font-family:var(--fb);font-size:var(--t-sm);font-weight:600;color:var(--ink2)}
.ma-previsto td{color:var(--ink3)}
.ma-file{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.ma-file-t{display:grid;gap:2px;justify-items:start;min-width:0}
.ma-voce-cod{display:inline-block;font-weight:600}
.ma-voce-regola{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.ma-nome-file{font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:200px;display:inline-block;vertical-align:middle}
.ma-mini{display:inline-block;width:44px;flex:none;border:1px solid var(--line2);border-radius:var(--r1);overflow:hidden;background:var(--sk-fondo)}
.ma-mini--na{display:inline-grid;place-items:center;width:64px;height:44px;font-size:.5625rem;line-height:1.1;text-align:center;color:var(--ink3);background:var(--surf2);padding:2px}
.ma-c-gesti{white-space:normal}
.ma-c-gesti .ma-btn{margin:2px 0}
.ma-doc-testa .ma-sum{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.ma-toolbar{display:flex;flex-wrap:wrap;gap:8px 14px}
.ma-esito{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:var(--r2);font-size:var(--t-sm)}
.ma-esito--no{background:var(--ver-soft);color:var(--ver);border:1px solid var(--ver-line)}
.ma-doc-sotto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.ma-nasbox{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.ma-miss{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:var(--t-sm)}
.ma-chiusi{display:grid;gap:8px}
.ma-wrap-voci{overflow:auto}
.ma-evidenza{border-color:var(--acc-line)}
/* R8 · da smistare */
.ma-pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ma-pick>.ma-mini{width:56px}
.ma-pick-corpo{display:grid;gap:4px;min-width:0}
.ma-fn{font-family:var(--fm);font-size:var(--t-sm);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma-pick-stati,.ma-contesto{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:var(--t-xs)}
.ma-contesto>span{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.ma-pick-k{font-size:var(--t-xs);color:var(--ink3)}
.ma-pick-gesti{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
/* R10 · assi */
.ma-assi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:start}
.ma-asse{display:grid;gap:4px;align-content:start;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:var(--r2);background:var(--surf);font-size:var(--t-sm)}
.ma-asse--ok{border-left-color:var(--ok)}.ma-asse--ver{border-left-color:var(--ver)}.ma-asse--ko{border-left-color:var(--ko)}.ma-asse--prop{border-left-color:var(--prop)}
.ma-riga-scelta td,.ma-riga-scelta th{background:var(--acc-soft)}
.ma-link{background:none;border:0;padding:0;color:var(--acc);cursor:pointer;text-decoration:underline;font-weight:600}
.ma-spenti{list-style:none;margin:0;padding:0;display:grid;gap:6px}

/* ================= finestre (in pagina), cassetti, tasti ================= */
.velo{position:fixed;inset:0;background:var(--velo);z-index:60}
.ma-finestra{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 48px);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surf);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:0 18px 48px var(--ombra)}
.ma-dialogo-testa{display:flex;align-items:flex-start;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ma-dialogo-testa>div{flex:1;min-width:0}
.ma-dialogo-testa h2{font-size:var(--t-md);overflow-wrap:anywhere}
.ma-dialogo-corpo{overflow:auto;padding:12px 16px;display:grid;gap:10px;align-content:start}
.ma-dialogo-piede{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--surf2);border-radius:0 0 var(--r3) var(--r3)}
.ma-dialogo-piede .ma-errore{flex:1 1 100%}
.ma-dialogo-gesti{display:grid;gap:8px;width:100%}
.ma-frasi{margin:0;padding-left:18px;display:grid;gap:4px;font-size:var(--t-ms)}
.ma-frasi--figli{font-size:var(--t-sm)}
.ma-step-figli{display:grid;gap:4px}
.ma-scelta{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf2);cursor:pointer;font-size:var(--t-ms)}
.ma-scelta input{width:17px;height:17px;margin-top:2px;accent-color:var(--acc)}
.ma-firma{border-color:var(--acc-line);background:var(--acc-soft)}
.ma-errore{color:var(--ko);background:var(--ko-soft);border:1px solid var(--ko-line);border-radius:var(--r2);padding:6px 10px;font-size:var(--t-sm)}
.ma-errore[hidden]{display:none}
.ma-spento{color:var(--off);font-size:var(--t-sm)}
.ma-riep{border:1px solid var(--line);border-radius:var(--r2);padding:4px 10px}
.ma-riep>summary{display:flex;justify-content:space-between;cursor:pointer;font-size:var(--t-ms)}
.ma-riep ul{margin:6px 0;padding-left:18px;font-size:var(--t-sm)}
.ma-blocchi{margin:4px 0 0;padding-left:18px}
.cassetto{border-left:1px solid var(--line2);background:var(--surf);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.cas-testa{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cas-testa h2{font-size:var(--t-md)}
.cas-corpo{overflow:auto;padding:12px 14px 24px;display:grid;gap:12px;align-content:start}
.cas-sotto{font-size:var(--t-sm);color:var(--ink2)}
.cas-blocco{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:var(--r2);font-size:var(--t-ms)}
.cas-elenco{margin:0;padding-left:18px;display:grid;gap:4px;font-size:var(--t-sm)}
.cas-tabs{display:flex;gap:4px}
.cas-tab{border:1px solid var(--line2);background:var(--surf);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:var(--t-sm);min-height:28px}
.cas-tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cas-json{font:400 var(--t-xs)/1.45 var(--fm);background:var(--sunken);border:1px solid var(--line);border-radius:var(--r2);padding:8px;overflow:auto;max-height:60vh;white-space:pre}
.cas-reg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:var(--t-xs)}
.cas-reg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cas-reg .mono{overflow-wrap:anywhere}
.cat-riga{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.cat-sub{display:flex;flex-wrap:wrap;gap:3px}
.cat-q{font-family:var(--fm);font-size:var(--t-xs);border:1px solid var(--line2);border-radius:var(--r1);padding:0 5px}
.tasti{position:fixed;z-index:50;right:16px;top:100px;width:min(420px,calc(100vw - 32px));background:var(--surf);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:0 12px 32px var(--ombra)}
.tasti-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;padding:12px 14px;margin:0;font-size:var(--t-sm)}
.tasti-dl dd{margin:0}
kbd{font:600 var(--t-xs)/1 var(--fm);border:1px solid var(--line2);border-bottom-width:2px;border-radius:var(--r1);padding:2px 5px;background:var(--surf2)}

/* ================= stazione ③ · Ciclo (giro 1-2) ================= */
.ciclo{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;height:100%;min-height:0;padding:8px 12px 0}
.ciclo-griglia{display:grid;grid-template-columns:264px minmax(320px,1fr) 600px;gap:0;min-height:0;border:1px solid var(--line2);border-radius:var(--r2) var(--r2) 0 0;background:var(--surf);overflow:hidden}
.ciclo-griglia>*{min-width:0;min-height:0;overflow:auto}
.cl-elenco{border-right:1px solid var(--line2);background:var(--surf2);padding:8px 0}
.cl-testa{display:flex;align-items:baseline;gap:8px;padding:2px 12px 8px;border-bottom:1px solid var(--line)}
.cl-pre{font-size:var(--t-sm);color:var(--ink3)}
.cl-riga{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:2px 8px;align-items:baseline;width:100%;text-align:left;padding:7px 12px;background:none;border:0;border-left:3px solid transparent;cursor:pointer;color:var(--ink)}
.cl-riga:hover{background:var(--surf)}
.cl-riga--su{background:var(--acc-soft);border-left-color:var(--acc)}
.cl-suf{font-size:var(--t-md)}
.cl-nome{font-size:var(--t-sm);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-riga .ma-st{grid-column:3}
.cl-pal{color:var(--ink3)}
.cl-sep{padding:10px 12px 4px;border-top:1px solid var(--line);margin-top:6px}
.cl-disegno{padding:10px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line2)}
.cl-foglio{padding:10px 12px;display:grid;gap:10px;align-content:start}
.cl-dagiro{display:grid;gap:4px;padding:12px;border:1px dashed var(--pa-line);border-radius:var(--r2);background:var(--pa-soft);color:var(--pa);font-size:var(--t-sm)}
.cl-dagiro span{color:var(--ink2)}

/* il cassetto spinge il foglio: la colonna dell'anteprima si stringe (SPEC §2.4) */
.ws--cassetto .ma-ws-griglia{grid-template-columns:minmax(0,1fr) 280px}
.ma-ws-centro{container-type:inline-size}
@container (max-width:760px){
  .ma-analisi{grid-template-columns:minmax(0,1fr)}
  .ma-letto--cand{grid-template-columns:minmax(0,1fr)}
  .ma-letto--cand .ma-letto-gesti{justify-items:start;text-align:left;max-width:none}
  .ma-schede-riga .ma-strumenti{margin-left:0;justify-content:flex-start}
  .ma-schede-riga .ma-strumenti-perche{text-align:left}
}
/* ================= punti di rottura ================= */
@media (max-width:1599px){.staz-t2{display:none}}
@media (max-width:1439px){
  .staz-c{display:none}
  .staz{padding:0 11px}
  .ciclo-griglia{grid-template-columns:240px minmax(0,1fr) 560px}
  .tt-b{padding:0 8px}
}
@media (max-width:1279px){
  .ws--cassetto .ws-corpo{grid-template-columns:minmax(0,1fr) 380px}
  .cas-btn .cas-l{display:none}
  .ma-analisi{grid-template-columns:minmax(0,1fr)}
  .ciclo-griglia{grid-template-columns:200px minmax(0,1fr) 520px}
  .staz-c{display:none}
  .tt-ogg{display:none}
}
@media (max-width:1023px){
  .ciclo{height:auto}
  .ciclo-griglia{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cl-elenco{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line2)}
  .ciclo-griglia>*{overflow:visible}
  .staz-t{font-size:var(--t-ms)}
  .ma-doc-sotto{grid-template-columns:minmax(0,1fr)}
  .ws--cassetto .ws-corpo{grid-template-columns:minmax(0,1fr)}
  .ws--cassetto .ws-main,.ws.ws--cassetto[data-stazione] .ws-main{display:none}
  .cassetto{width:100%;margin:0;border-left:0}
  .tt-ruolo{padding:0 10px}
  .tt-b{display:none}
}
@media (max-width:819px){
  .ws{height:auto;grid-template-rows:auto auto auto}
  .ws-corpo{overflow:visible}
  .ws-main{overflow:visible}
  .tt{height:auto;flex-wrap:wrap}
  .tt>*+*{border-left:0}
  .tt-menu{order:1;height:48px}
  .tt-rfq{order:2;flex:1 1 calc(100% - 110px);max-width:none;padding:0 10px;min-height:48px}
  .tt-cli{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tt-cella{order:5;flex:1 1 0;padding:4px 8px 6px 16px;border-top:1px solid var(--line);min-width:0}
  .tt-cella+.tt-cella{padding-left:8px}
  .tt-prodotti{order:6;flex:1.4 1 0;border-top:1px solid var(--line);min-width:0}
  .tt-prod{padding:4px 22px 6px 8px;max-width:100%;width:100%}
  .tt-prod-v .ma-st{display:none}
  .tt-fase b{font-size:var(--t-ms)}
  .tt-gg{display:none}
  .tt>.sp{display:none}
  .tendina--cartiglio{left:0;right:0}
  .cartiglio{grid-template-columns:1fr 1fr}
  .cg-cella:first-child{grid-column:1/-1}
  .stazioni{height:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(3,40px)}
  .tt-ruolo{order:3;margin:0 12px 0 0;padding:0 4px;gap:4px}
  .tt-rfq{flex-basis:calc(100% - 190px)}
  .tt>.tt-cella{flex:1 1 26%}
  .tt>.tt-prodotti{flex:1.4 1 40%}
  .tt-ruolo .chip{font-size:.625rem;padding:0 4px}
  .staz-elenco,.cassetti-btn{display:contents}
  .staz{flex-direction:column;justify-content:center;gap:2px;padding:4px 2px;min-height:44px}
  .staz-t{display:none}
  .staz-c{display:block;font-size:.5625rem;max-width:100%;text-align:center}
  .staz[data-staz="1"] .staz-c{display:none}
  .cas-btn{justify-content:center;min-height:44px;padding:0}
  .ma-navi{padding:6px 16px}
  .ma-viste{width:100%}
  .ma-vista{flex:1;justify-content:center;min-height:40px}
  #ma-avviso{margin:8px 16px 0}
  .ma-ws-centro,.ma-riepilogo{padding:10px 16px 20px}

.cf{display:grid;gap:6px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.cf-tab{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.cf-tab th,.cf-tab td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.cf-tab th{font:600 var(--t-xs)/1.2 var(--fd);text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.cf-tab tr.cf-scelto td{background:var(--ok-soft)}
.ciclo-sopra{display:flex;flex-direction:column;gap:6px;min-width:0}
.req-riga{display:flex;align-items:center;gap:4px 6px;font-size:var(--t-sm);padding:3px 8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);white-space:nowrap;overflow:hidden;min-height:32px;min-width:0}
.req-riga--aperta{flex-wrap:wrap;white-space:normal}
.req-riga:not(.req-riga--aperta){-webkit-mask-image:linear-gradient(to right,black calc(100% - 40px),transparent);mask-image:linear-gradient(to right,black calc(100% - 40px),transparent)}
.req-tit{border:0;background:none;cursor:pointer;font-family:var(--fd);font-weight:700;font-size:var(--t-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);padding:2px 4px;white-space:nowrap;flex:none}
.req-tit b{color:var(--ver)}
.req-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:999px;padding:0 8px;background:var(--surf2);cursor:pointer;font-size:var(--t-xs);min-height:22px;flex:none;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-chip--no{border-color:var(--ver-line);background:var(--ver-soft);color:var(--ver)}
.req-chip--ok{border-color:var(--ok-line);color:var(--ok)}
.req-riga .chip-b{flex:none}
/* la testata del pezzo nel Ciclo: lo stesso componente di R6 (M11), più compatto */
.cl-foglio-testa{padding:8px 10px 6px}
.cl-foglio-testa .tp{padding:6px 10px;gap:3px}
.cl-foglio-testa .tp-cod{font-size:var(--t-md)}
.cl-foglio-testa .tp-r2,.cl-foglio-testa .tp-r3,.cl-foglio-testa .tp-b{padding-top:3px}
.cl-foglio-testa .tp-r3{display:flex;flex-wrap:wrap;gap:3px 14px}
.cl-foglio-testa .tp-cella{display:flex;gap:6px;align-items:center}
.ciclo-griglia--nodis{grid-template-columns:264px minmax(0,1fr)!important}
.ciclo-griglia--nodis .cl-disegno{display:none}
.cl-filtro{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line)}
.cl-filtro .seg>button{padding:2px 7px;min-height:24px;font-size:var(--t-xs)}
.cl-riga{grid-template-columns:auto auto minmax(0,1fr) auto}
.cl-riga .cl-pals{display:inline-flex;gap:3px;align-items:center}
.cl-riga--sel{box-shadow:inset 0 0 0 1.5px var(--pa)}
.cl-riga .cl-tag{grid-column:3/-1;font-size:var(--t-xs);color:var(--ink3)}
.cl-pal{font-family:var(--fm);font-size:var(--t-sm);width:1.1em;text-align:center}
.cl-pal--b{color:var(--ver)}.cl-pal--c{color:var(--ok)}
.cl-foglio{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:0;gap:0;overflow:hidden!important}
.cl-foglio-testa{padding:10px 12px 6px;border-bottom:1px solid var(--line);background:var(--surf)}
.cl-scroll{overflow:auto;padding:8px 12px 16px;display:grid;gap:8px;align-content:start;min-height:0}
.cl-disegno .cl-note{display:grid;gap:4px;font-size:var(--t-sm)}
/* il disegno è il primo strumento di Lino: alto quanto la colonna, le note sotto */
@media (min-width:1024px){
  .cl-disegno{grid-template-rows:auto minmax(260px,1fr) auto;align-content:stretch}
  .cl-disegno>.ma-palco{min-height:0;height:100%;display:grid;place-items:center;overflow:auto}
  .cl-disegno>.ma-palco>div{height:100%;display:grid;place-items:center}
  .cl-disegno>.ma-palco svg.schizzo{width:100%;height:100%;max-height:100%}
}
.cl-disegno .cl-note form{display:flex;gap:6px}
.cl-disegno .cl-note input{flex:1;min-width:0;min-height:28px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r2)}
.cl-nota-n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pa);color:var(--surf);font:600 var(--t-xs)/1 var(--fm);flex:none}
.tp-b .tp-b-v{display:inline-flex;gap:4px;align-items:center}
/* le preparazioni: una riga di riepilogo in testa, fuori dalla sequenza delle fasi */
.prep{border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf2)}
.prep>summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px;cursor:pointer;font-size:var(--t-sm);list-style:none}
.prep>summary::-webkit-details-marker{display:none}
.prep>summary .lab{color:var(--ink2)}
.prep-corpo{display:grid;gap:6px;padding:4px 10px 10px}
.prep-riga{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 10px;align-items:center;font-size:var(--t-sm);padding:4px 0;border-top:1px solid var(--line)}
.prep-riga input[type=text]{width:90px;min-height:26px;padding:2px 6px;border:1px solid var(--line2);border-radius:var(--r1);font-family:var(--fm)}
.prep-agg{display:flex;flex-wrap:wrap;gap:4px}
/* la riga di fase */
.fase{border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf)}
.fase--aperta{border-color:var(--acc-line);box-shadow:0 0 0 1px var(--acc-line)}
.fase--evidenza{box-shadow:0 0 0 2px var(--ok)}
.fase-t{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto auto;gap:4px 8px;align-items:center;min-height:36px;padding:3px 8px;cursor:pointer}
.fase-t:hover{background:var(--surf2)}
.fase-n{font:600 var(--t-lg)/1 var(--fd);color:var(--ink2)}
.fase-nome{display:grid;min-width:0}
.fase-nome b{font-family:var(--fd);font-size:var(--t-md);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fase-riass{font-family:var(--fm);font-size:var(--t-xs);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fase-stelle{font-family:var(--fm);font-size:var(--t-xs);color:var(--ink2);white-space:nowrap}
.fase-az{display:inline-flex;gap:2px}
.fase-az button{width:26px;height:26px;border:1px solid var(--line2);background:var(--surf);border-radius:var(--r1);cursor:pointer;color:var(--ink);display:grid;place-items:center;font-size:var(--t-sm);padding:0}
.fase-az button:hover{border-color:var(--acc);color:var(--acc)}
.fase-corpo{display:grid;gap:8px;padding:6px 10px 10px;border-top:1px solid var(--line)}
.fase-campi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px;align-items:start}
.fase-acc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.cb{display:grid;gap:2px;min-width:0;grid-column:span 2}
.cb--1{grid-column:span 1}.cb--3{grid-column:span 3}.cb--6{grid-column:1/-1}
.cb-l{font-size:var(--t-xs);color:var(--ink2);font-weight:500;line-height:1.25;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.cb-l .stella{color:var(--ver);font-weight:700}
.cb-in{display:flex;align-items:stretch;border:1px solid var(--line-campo);border-radius:var(--r1);background:var(--surf);min-width:0;min-height:30px}
.cb-in:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.cb-in input,.cb-in select{border:0;background:transparent;padding:4px 7px;min-width:0;width:100%;font-family:var(--fm);font-size:var(--t-ms);color:var(--ink)}
.cb-in input:focus,.cb-in select:focus{outline:none}
.cb-in select{font-family:var(--fb);font-size:var(--t-sm)}
.cb-in b{display:flex;align-items:center;padding:0 7px;font:500 var(--t-xs) var(--fm);color:var(--ink3);background:var(--surf2);border-left:1px solid var(--line)}
.cb--manca .cb-in{border-color:var(--ver-line);border-style:dashed;background:var(--ver-soft)}
.cb--manca .cb-l::after{content:"da scrivere";color:var(--ver);font-weight:600}
.cb-in input.campo--prop{font-style:italic;color:var(--pa)}
.cb--prop .cb-in{border-color:var(--pa-line);background:var(--pa-soft)}
.cb-aiuto{font-size:var(--t-xs);color:var(--ink3);overflow-wrap:anywhere}
.cb-aiuto .warn{color:var(--ver)}
.cb-terzi{display:flex;flex-wrap:wrap;gap:4px}
.cb-terzi button{border:1px solid var(--line2);background:var(--surf);border-radius:999px;padding:1px 9px;cursor:pointer;font-size:var(--t-xs);min-height:24px}
.cb-terzi button[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.cb-terzi button.seg--prop{border-color:var(--pa);color:var(--pa);font-style:italic}
/* il grezzo nella prima fase */
.grz{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.grz-r1{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.grz-r1 .cb{grid-column:auto}
.grz-esito{font-size:var(--t-sm);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.sg{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:var(--t-sm);padding:5px 8px;border-radius:var(--r1);border:1px solid var(--line)}
.sg b{font-family:var(--fd);font-weight:700}
.sg--magazzino{border-color:var(--ok-line);background:var(--ok-soft)}
.sg--non_basta{border-color:var(--ver-line);background:var(--ver-soft)}
.sg--acquistato{border-color:var(--line2);background:var(--surf)}
.sg--mai{border-color:var(--ver-line);background:var(--ver-soft)}
.lav{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:var(--t-xs);color:var(--ink2)}
.lav span b{font-family:var(--fm)}
.lav .lav-ko{color:var(--ver)}
/* la saldatura */
.sald-q{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:var(--t-sm);min-width:0}
.sald-q .seg{flex-wrap:wrap;max-width:100%}
.sald-entra{font-size:var(--t-sm);color:var(--ink2);display:flex;flex-wrap:wrap;gap:3px 10px}
.sald-entra span{white-space:nowrap}
.spunta{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);cursor:pointer}
.spunta input{width:16px;height:16px;accent-color:var(--acc)}
.giunti{display:grid;gap:4px;font-size:var(--t-sm)}
.giunti form{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.giunti input{min-width:180px;flex:1;min-height:28px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r2);font-family:var(--fm)}
.giunti ol{margin:0;padding-left:18px}
.giunto-ant{font-family:var(--fm);font-size:var(--t-xs);color:var(--pa)}
.agg-fase{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--t-sm)}
.agg-fase input{min-height:28px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r2);width:22ch}
.agg-fase-l{display:flex;flex-wrap:wrap;gap:4px}
.ctrl{display:grid;gap:4px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf)}
.ctrl-riga{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:var(--t-sm)}
.ctrl-riga code{font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3)}
.barra-conf{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;min-height:52px;padding:6px 10px;border-top:1.5px solid var(--line2);background:var(--surf);position:relative}
.barra-conf .bc-stato{font-size:var(--t-sm);color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0;overflow:hidden;white-space:nowrap}
.barra-conf .bc-nav{display:inline-flex;gap:2px;align-items:center;font-size:var(--t-sm);color:var(--ink2);margin-left:auto;flex:none;font-family:var(--fm)}
.barra-conf .ma-btn--pri{flex:none}
.barra-conf .bc-menu{position:absolute;right:12px;bottom:52px;background:var(--surf);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:0 10px 24px var(--ombra);display:grid;padding:4px;z-index:5}
.barra-conf .bc-menu button{text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer;border-radius:var(--r1);font-size:var(--t-sm)}
.barra-conf .bc-menu button:hover{background:var(--sunken)}
.cl-segmento{display:none}
.cl-vuoto{display:grid;gap:8px;justify-items:start;padding:12px;border:1px dashed var(--pa-line);border-radius:var(--r2);background:var(--pa-soft);font-size:var(--t-sm)}

/* ---------------- ④ Sequenza ---------------- */
.seq{display:grid;gap:10px}
.seq-stadio{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px 10px;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf)}
.seq-lettera{font:700 var(--t-xl)/1 var(--fd);color:var(--acc)}
.seq-stadio h3{font-size:var(--t-md)}
.seq-righe{display:grid;gap:3px;margin-top:4px}
.seq-riga{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;font-size:var(--t-sm);padding:3px 6px;border-radius:var(--r1)}
.seq-riga--cur{background:var(--acc-soft)}
.seq-riga .mono{font-weight:600}
.seq-proposte{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.seq-prop{display:grid;gap:6px;align-items:start;align-content:start;padding:10px;border:1px dashed var(--pa-line);border-radius:var(--r2);background:var(--pa-soft);font-size:var(--t-sm)}
.seq-prop .fld input,.seq-prop .fld select{min-height:30px}
.seq-viaggi{font-size:var(--t-sm);display:grid;gap:3px}

/* ---------------- ⑤ Esito e consegna ---------------- */
.esito-tab{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line2)}
.esito-tab th{font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:6px 8px;background:var(--surf2);border-bottom:1px solid var(--line2);white-space:nowrap}
.esito-tab td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:var(--t-sm)}
.esito-tab tr.es-cur td{background:var(--acc-soft)}
.esito-tab input.nota{width:100%;min-width:160px;min-height:28px;padding:3px 8px;border:1px solid var(--line-campo);border-radius:var(--r1)}
.esito-perche{display:grid;gap:2px}
.esito-perche span{display:flex;gap:6px;align-items:baseline}
.esito-blocchi{display:grid;gap:10px;margin-top:10px}
.esito-blocco{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf)}
.esito-blocco>header{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.esito-blocco h3{font-size:var(--t-md)}
.req-l{display:grid;gap:4px;font-size:var(--t-sm)}
.req-l>div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dd{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;font-size:var(--t-sm)}
.dd>div{display:flex;gap:6px;align-items:center;justify-content:space-between;border-bottom:1px dotted var(--line2);padding:2px 0}
.firme-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1.5px solid var(--ink-line);border-radius:2px}
.firma-b{display:grid;gap:4px;padding:8px 10px;border-left:1px solid var(--ink-line);justify-items:start;align-content:start;font-size:var(--t-sm)}
.firma-b:first-child{border-left:0}
.lotti-b{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:var(--t-sm)}
.consegne{display:grid;gap:4px;font-size:var(--t-sm)}

/* ---------------- Foglio per Franco, Costi, Listini, Offerta (da v13, sui token) ---------------- */
.off-nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.off-nav button{border:1px solid var(--line2);background:var(--surf);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:var(--t-sm);min-height:28px;white-space:nowrap}
.off-nav button[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dati-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.dati-h h2{font-size:var(--t-xl);margin-top:2px}
.dblock{display:grid;gap:8px}
.dblock>header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.dblock h3{font-size:var(--t-lg)}
.dblock table.tb td{font-size:var(--t-sm);padding:6px 10px}
.wrap-tb.scroll{overflow-x:auto}
.wrap-tb.scroll table{min-width:680px}
.manca-c{display:inline-block;font-size:var(--t-xs);font-weight:700;color:var(--ko);background:var(--ko-soft);border:1px solid var(--ko-line);border-radius:var(--r1);padding:0 5px}
.costi-v,.listini-v,.off-v,.foglio-v{display:grid;gap:16px;max-width:1560px}
.cost-param{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.qv{display:grid;gap:3px;min-width:0}
.qv.largo{grid-column:span 2}
.qv .l{font-size:var(--t-xs);color:var(--ink2);font-weight:500;line-height:1.25}
.qv .in{display:flex;align-items:stretch;border:1px solid var(--line-campo);border-radius:var(--r1);background:var(--surf);min-width:0}
.qv .in:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.qv input,.qv select{border:0;background:transparent;padding:5px 8px;min-width:0;width:100%;font-family:var(--fm);font-size:var(--t-ms);color:var(--ink)}
.qv input:focus,.qv select:focus{outline:none}
.qv select{font-family:var(--fb);font-size:var(--t-sm)}
.qv .in b{display:flex;align-items:center;padding:0 8px;font-weight:500;font-size:var(--t-xs);color:var(--ink3);background:var(--surf2);border-left:1px solid var(--line);font-family:var(--fm);white-space:nowrap}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px 10px;align-items:end}
.scen{grid-column:1/-1;display:grid;gap:4px}
.scen .l{font-size:var(--t-xs);color:var(--ink2);font-weight:500}
.scen-l{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scen-c{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 10px;border:1.5px solid var(--ink-line);border-radius:999px;background:var(--surf);font-size:var(--t-sm);font-weight:600}
.scen-l input{width:96px;padding:4px 8px;border:1px solid var(--line2);border-radius:var(--r1);font-family:var(--fm)}
table.tb.costi{font-size:var(--t-sm)}
table.tb.costi td,table.tb.costi th{padding:6px 10px;vertical-align:top}
table.tb.costi .num{text-align:right;white-space:nowrap}
table.tb.costi tr.blocco th{background:var(--sunken);color:var(--ink);font-size:var(--t-xs);border-top:1.5px solid var(--ink-line)}
table.tb.costi tr.manca td{background:var(--ko-soft)}
table.tb.costi td.drv{color:var(--ink2);min-width:220px}
table.tb.costi tr.tot th,table.tb.costi tr.tot td{border-top:1.5px solid var(--ink-line);background:var(--surf2)}
table.tb.costi tr th[colspan]{text-align:right;font-family:var(--fd);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
table.tb.costi tr.prezzo-r td{background:var(--acc-soft)}
input.prezzo{width:110px;padding:4px 8px;border:1.5px solid var(--acc);border-radius:var(--r1);font-family:var(--fm);font-weight:600;text-align:right;background:var(--surf)}
b.neg{color:var(--ko)}
.cedit{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:var(--t-xs);color:var(--ink3)}
.cedit label{display:inline-flex;align-items:center;gap:4px}
.cedit input:not([type=checkbox]){width:70px;padding:2px 6px;border:1px solid var(--line2);border-radius:var(--r1);font-family:var(--fm);font-size:var(--t-sm)}
.cedit select{max-width:240px;padding:2px 4px;border:1px solid var(--line2);border-radius:var(--r1);font-size:var(--t-xs)}

/* dopo un gesto B: la navigazione che il gesto chiede (presentazione) */
function dopoGestoB(url, r, campi){
  if(r.esito!=="ok") return;
  /* una domanda interna è una bozza in Outlook: l'avviso lo dice, il cassetto resta com'è (nessun gesto in più per chiuderlo) */
  if(/\/rfq\/[^/]+\/domanda$/.test(url) && r.rid){ S.rqSu = r.rid; S.rqAperta = r.rid; }
  if(/\/preparazioni$/.test(url) && campi && campi.apri){ S.cassetto = "richieste"; S.rqSu = campi.apri; S.rqAperta = campi.apri; }
  if(/\/fornitura$/.test(url) || /\/come\/blocco$/.test(url)){ S.comeForm = null; S.blocco = null; if(S.comeSel) S.comeSel.clear(); if(S.cicloSel) S.cicloSel.clear(); }
  if(/\/ciclo\/modello$/.test(url)) S.menuMod = null;
  if(/^\/fase\//.test(url) && campi && campi.catalogo && S.cassetto==="cataloghi"){ S.catDest = null; if(window.innerWidth<1280) S.cassetto = null; }
  if(/\/ciclo\/fase$/.test(url) && r.fid){ S.faseAperta = r.fid; S.aggFase = ""; }
  if(typeof dopoSequenza==="function") dopoSequenza(url, r);
  if(typeof dopoCiclo==="function") dopoCiclo(url, r, campi);
  if(typeof dopoEsito==="function") dopoEsito(url, r, campi);
}
/* ================= 48 · stazione ③ Ciclo: il foglio a righe di fase (zona B · R-10 R-11 R-23…R-30 R-36 R-37) =================
   SPEC_v15 §2.5. Tre colonne, ognuna scorre da sola: elenco · disegno (sempre aperto, D lo nasconde) · foglio.
   Il foglio, dall'alto: testataPezzo() (lo STESSO componente di R6, M11) · preparazioni in testa, FUORI dalla sequenza
   delle fasi (decisione 07/10) · fasi a righe, ognuna con i soli campi della sua famiglia; il grezzo nella prima fase
   che lo consuma, dalla banca dati dei materiali · aggiungi una fase (/) · controlli · barra di conferma come ULTIMA
   riga della colonna (C2, M10, B5).
   v16 (SPEC_v16 §3): il PRIMO disegno è il PDF del prodotto finito (dato A letto: Indice.Voce del prodotto, poi il nodo
   radice; mai un disegno inventato), con le schede Prodotto finito · Componente e il tasto V. Le fasi di unione hanno
   «Entrano» a scelta e «+ fase di unione prima» (pre-unioni in fila, lo stesso pezzo della Sequenza: 49). Le preparazioni
   hanno una riga ciascuna con «Richiedi». Meno pulsanti: «⋯» per fase, un solo «+ nota», fonti solo sulle proposte.
   Regole: il ciclo si lega al componente confermato; senza componente il foglio è in sola lettura (RV-27). Le proposte
   ◇ sono in corsivo prugna con la fonte e diventano dati solo con Invio o «Accetta». Tutti gli stati (grezzo, lavorabilità,
   WPS, completezza, controlli) li dà il finto server A2: qui si sceglie solo come mostrarli. */

/* il prefisso comune è aritmetica sulle stringhe dei codici, non uno stato (SPEC §2.5) */
function prefissoComune(cods){
  if(cods.length<2) return "";
  let meglio = "";
  for(const c of cods){
    for(let k=4;k<c.length;k++){ if(!/[.\-_ ]/.test(c[k-1])) continue;
      const pre = c.slice(0,k), n = cods.filter(x=>x.startsWith(pre) && x.length>pre.length).length;
      if(n>=2 && n>=cods.length/2 && pre.length>meglio.length) meglio = pre; }
  }
  return meglio;
}
function gruppoCiclo(IX, p){ return IX.Gruppi(p.rif).find(x=>x.tipo==="bom") || IX.Gruppi(p.rif).find(x=>x.tipo==="senza") || IX.Gruppi(p.rif).find(x=>x.tipo==="cand") || null; }
/* l'ordine dell'elenco: da fare (con ciclo) · senza ciclo (dal cliente, esclusi, commerciali) · senza componente */
function elencoCiclo(T, p){
  const righe = righeB(T,p);
  const conCiclo = r => r.cid && !r.comm && (()=>{ const c = comeDi(T,r.cid); return !c || MODO_CON_CICLO.has(c.modo); })();
  return { righe, fare: righe.filter(conCiclo), senza: righe.filter(r=>r.cid && !conCiclo(r)), nocomp: righe.filter(r=>!r.cid) };
}
function prossimoDaFare(T, p, cid){
  const {fare} = elencoCiclo(T,p); const i = fare.findIndex(r=>r.cid===cid);
  const giro = [...fare.slice(i+1), ...fare.slice(0, Math.max(0,i))];
  return giro.find(r=>{ const c = cicloB(T,r.cid); return !c || c.stato!=="confermato"; }) || null;
}
function peggiore(cc){ return cc.some(x=>x.liv==="KO"&&!x.inventato)?"KO":cc.some(x=>x.liv==="DB"||x.liv==="KO")?"DB":cc.some(x=>x.liv==="AV")?"AV":null; }

function stazioneCiclo(T, p){
  const IX = indiceDi(T);
  if(!p) return `<p class="ma-vuoto">Nessun prodotto.</p>`;
  const banda = bandaB("R-10 · R-25 · R-36","Il backend di oggi non ha il ciclo, le fasi né il grezzo: quello che scrivi qui resta nel mockup.");
  const g = gruppoCiclo(IX, p);
  const {righe, fare, senza, nocomp} = elencoCiclo(T,p);
  if(!g || !righe.length) return `<div class="staz-vuota">${banda}<div class="empty"><span class="ib">${I("cube",22)}</span><h3>Il foglio del ciclo è in sola lettura</h3>
      <p>Il ciclo si scrive su un componente confermato: prima conferma l'albero: autorizza lo STEP, oppure aggiungi i componenti a mano (R-38).</p>
      <div class="acts" style="justify-content:center"><button type="button" class="ma-btn" data-staz="1">← Vai a Struttura e documenti</button></div></div></div>`;
  const pre = prefissoComune(righe.map(r=>r.cod));
  const scelta = righe.find(r=>r.cid && r.cid===S.cicloCid) || righe.find(r=>r.rif===S.cicloRif) || fare.find(r=>{ const c=cicloB(T,r.cid); return !c||c.stato!=="confermato"; }) || fare[0] || senza[0] || righe[0];
  S.cicloCid = scelta.cid || null; S.cicloRif = scelta.rif;
  const ctrl = controlliB(T,p);
  const filtro = S.cicloFiltro || "da";
  const passaFiltro = r => filtro==="tutti" || (filtro==="da" ? (()=>{ const c=cicloB(T,r.cid); return !c||c.stato!=="confermato"; })() : !!peggiore(ctrl.filter(x=>x.cid===r.cid)));
  const sel = S.cicloSel || (S.cicloSel = new Set());
  const riga = (r, conPal) => { const c = r.cid ? cicloB(T,r.cid) : null, pg = peggiore(ctrl.filter(x=>x.cid===r.cid)), co = r.cid ? comeDi(T,r.cid) : null;
    const st = !c ? "○" : c.stato==="confermato" ? "✓" : "◐";
    const tag = !r.cid ? "non ancora un componente" : r.comm ? "commerciale · nella fase del padre" : co && !MODO_CON_CICLO.has(co.modo) ? nomeModo(co.modo) : !co ? "come: da decidere" : (c && c.copiaDa ? "⧉ "+c.copiaDa.slice(-4) : "");
    return `<button type="button" class="cl-riga${r===scelta?" cl-riga--su":""}${sel.has(r.cid)?" cl-riga--sel":""}" data-ciclo-rif="${esc(r.rif)}" ${r.cid?`data-ciclo-cid="${r.cid}"`:""} aria-current="${r===scelta}" title="${esc(r.cod)} · ${esc(r.descr)}">
      <span class="cl-pal${st==="◐"?" cl-pal--b":st==="✓"?" cl-pal--c":""}" aria-label="ciclo ${st==="○"?"vuoto":st==="✓"?"confermato":"in bozza"}">${conPal?st:"·"}</span><b class="cl-suf mono">${esc(suffisso(r.cod,pre))}</b>
      <span class="cl-nome">${esc(r.descr||"")}</span><span class="cl-pals">${pg?`<i class="pal pal--${pg}" title="controllo peggiore: ${pg}"></i>`:""}</span>
      ${tag?`<span class="cl-tag">${esc(tag)}</span>`:""}</button>`; };
  const nOk = fare.filter(r=>{ const c=cicloB(T,r.cid); return c&&c.stato==="confermato"; }).length;
  const fareVis = fare.filter(passaFiltro);
  const elenco = `<nav class="cl-elenco" aria-label="Componenti del prodotto">
      <div class="cl-testa"><span class="lab">Elenco ${nOk}/${fare.length}${fare.length&&nOk===fare.length?" ✓":""}</span>${pre?`<span class="cl-pre mono" title="prefisso comune">${esc(pre.slice(0,-1))}</span>`:""}</div>
      <div class="cl-filtro"><label class="cl-filtro-l"><span class="vh">Filtro dell'elenco</span><select data-ciclo-filtro-sel="1" aria-label="Filtro dell'elenco">${[["","da fare"],["dubbi","con dubbi"],["tutti","tutti"]].map(([k,l])=>`<option value="${k}" ${(filtro==="da"?"":filtro)===k?"selected":""}>${l}</option>`).join("")}</select></label></div>
      ${sel.size?`<div class="cl-filtro"><span class="piccolo">${sel.size} selezionati</span> <button type="button" class="ma-btn ma-btn--sm" data-ciclo-blocco="1">Applica un modello (A)</button></div>`:""}
      ${fareVis.map(r=>riga(r,true)).join("")||(!fare.length&&nocomp.length?`<div class="cl-vuoto-el"><p class="piccolo"><b>Nessun ciclo si può ancora scrivere</b>: i pezzi non sono ancora componenti. In ①: prima conferma l'albero: autorizza lo STEP, oppure aggiungi i componenti a mano (R-38).</p><button type="button" class="ma-btn ma-btn--sm" data-staz="1">→ ① Struttura</button></div>`
        :!fare.length?`<p class="k3 piccolo" style="padding:8px 12px">Nessun componente con un ciclo: decidi prima come si fa in ② Come.</p>`
        :`<p class="k3 piccolo" style="padding:8px 12px">Niente ${filtro==="da"?"da fare: tutti i cicli sono confermati":"con dubbi"}.</p>`)}
      ${senza.length?`<div class="cl-sep"><span class="lab">senza ciclo</span></div>${senza.map(r=>riga(r,false)).join("")}`:""}
      ${nocomp.length?`<div class="cl-sep"><span class="lab">senza componente · sola lettura</span></div>${nocomp.map(r=>riga(r,false)).join("")}`:""}
    </nav>`;
  const n = g.nodi.find(x=>x.nodo.rif===scelta.rif) || g.nodi[0];
  if(!S.disCiclo) S.disCiclo = "prodotto";   /* entrando nella stazione il primo disegno è il prodotto finito (S-04) */
  const v420 = S.vista420 || "disegno";   /* B-7: a 420 px si apre sul disegno del prodotto finito (S-04) */
  return `<div class="ciclo">${paAvvisoHtml()}
    <div class="ciclo-sopra">${banda}${requisitiLetti(T,p)}${S.blocco&&S.blocco.staz===3?bloccoModelli(T,p):""}
    <div class="cl-segmento"><span class="seg" role="group" aria-label="Che cosa vedere">${[["fasi","Fasi"],["disegno","Disegno"],["elenco","Elenco"]].map(([k,l])=>`<button type="button" data-vista420="${k}" aria-pressed="${v420===k}">${l}</button>`).join("")}</span></div></div>
    <div class="ciclo-griglia${S.disegnoNascosto?" ciclo-griglia--nodis":""}" data-vista420="${v420}">
      ${elenco}
      ${disegnoCiclo(T, p, scelta, n)}
      ${foglioCiclo(T, IX, p, g, n, scelta, pre, fare, ctrl)}
    </div></div>`;
}

/* la riga «requisiti letti» (decisione 1, default): ogni requisito va nella fase che lo copre; «nessuna fase» è REQ-01 */
function requisitiLetti(T, p){
  const rr = REQUISITI[T.key]||[]; if(!rr.length) return "";
  const chip = q => { const c = requisitoCoperto(T,p,q);
    if(q.tipo==="condizione") return `<button type="button" class="req-chip${c.ok?" req-chip--ok":""}" data-vai="5" title="${esc(q.testo)} · condizione dell'ordine: si vede in Esito">${chipF(q.fonte)} ${esc(q.testo)} → Esito ${c.ok?"✓":"⚑"}</button>`;
    return c.ok ? `<button type="button" class="req-chip req-chip--ok" data-vai="3|${c.cid}|${c.fid}" title="${esc(q.testo)} · coperto dalla fase">${chipF(q.fonte)} ${esc(q.testo)} → ${esc(c.dove)} ✓</button>`
      : `<button type="button" class="req-chip req-chip--no" data-vai="3|${(righeB(T,p).find(r=>r.radice)||{}).cid||""}|||${({controllo:"contr",saldatura:"sald",trattamento:"sabb",certificati:"cert"})[q.tipo]||""}" title="${esc(q.testo)} · REQ-01: requisito senza fase · porta ad «Aggiungi una fase»">${chipF(q.fonte)} ${esc(q.testo)} → nessuna fase ⚠</button>`; };
  const no = rr.filter(q=>q.tipo!=="condizione" && !requisitoCoperto(T,p,q).ok).length;
  const ordinati = [...rr.filter(q=>q.tipo!=="condizione" && !requisitoCoperto(T,p,q).ok), ...rr.filter(q=>!(q.tipo!=="condizione" && !requisitoCoperto(T,p,q).ok))];
  /* v16 (SE §4.8): chiuso è UN chip «Requisiti: 1 senza fase ▸»; aperto mostra l'elenco (l'elenco intero sta anche in Esito e Controlli) */
  return `<div class="req-riga${S.reqAperti?" req-riga--aperta":" req-riga--chiusa"}" role="group" aria-label="Requisiti letti"><button type="button" class="req-tit" data-req-toggle="1" aria-expanded="${!!S.reqAperti}" title="Decisione 1 (default, da confermare): i requisiti escono dal foglio e vanno nelle fasi">Requisiti: ${no?`<b>${no} senza fase</b>`:`${rr.length} letti ✓`} ${S.reqAperti?"▴":"▸"}</button>
    ${S.reqAperti?ordinati.map(chip).join("")+`<span class="chip-b" title="Decisione 1: i requisiti escono dal foglio e vanno nelle fasi. Default, da confermare.">dec. 1</span>`:""}</div>`;
}

/* ---------------- il disegno: sempre aperto, note numerate legate alla fase aperta (N, R-14) ----------------
   v16: due schede sopra il disegno. «Prodotto finito» (aperta entrando nella stazione) è il PDF del prodotto, il
   riferimento per capire dove va il pezzo; «Componente» è il 2D del pezzo aperto. V passa dall'uno all'altro, D nasconde.
   Il PDF è un dato A LETTO, nell'ordine (FB §5.1): 1) Indice.Voce(prodotto, componente_id, "disegno_2d") → disegni.primario;
   2) il nodo radice della prima scheda di Indice.Gruppi; 3) niente: «anteprima non disponibile». Si mostra solo con
   «disponibile» e sha256; nel Cockpit vero è GET /allegato/{AllegatoID}/anteprima?v=<Sha256> con pdf.js (mai iframe). */
function disegnoProdotto(T, p){
  const IX = indiceDi(T), v = p.componente_id ? IX.Voce(p.rif, p.componente_id, "disegno_2d") : null;
  let pr = v && v.disegni && v.disegni.primario ? v.disegni.primario : null, da = "voce 2D del prodotto";
  if(!pr){ const gr = IX.Gruppi(p.rif)[0], rad = gr ? gr.nodi.find(x=>!x.parentela.length) : null; if(rad && rad.disegni && rad.disegni.primario){ pr = rad.disegni.primario; da = "nodo radice della scheda"; } }
  const an = pr ? pr.anteprima : null;
  if(!pr) return {ok:false, testo:"anteprima non disponibile: il prodotto non ha un 2D"};
  if(/step|stp/i.test(pr.formato||"") || /\.(step|stp)$/i.test(pr.nome_file||"")) return {ok:false, testo:"anteprima non disponibile: è uno STEP", pr};
  if(!an || !an.disponibile || !an.sha256) return {ok:false, testo:"anteprima non disponibile (il file non è leggibile o non ha l'impronta)", pr};
  return {ok:true, pr, an, da, proposto: pr.provenienza==="proposto", url:`/allegato/${an.allegato_id}/anteprima?v=${an.sha256}`};
}
function disegnoComponente(n){
  const pr = n && n.disegni && n.disegni.primario; if(!pr) return {ok:false, testo:"nessun 2D associato: lo dicono i Documenti (DOC-01)"};
  const an = pr.anteprima; if(!an || !an.disponibile || !an.sha256) return {ok:false, testo:"anteprima non disponibile (il file non è leggibile o non ha l'impronta)", pr};
  return {ok:true, pr, an};
}
function disegnoCiclo(T, p, r, n){
  const S2 = a2Di(T), note = r.cid ? (S2.note[r.cid]||[]) : [], dc = disegnoComponente(n), prC = dc.ok ? dc.pr : null;
  const eRadice = !!r.radice, z = S.disZoom || 1, vista = S.disCiclo==="componente" && !eRadice ? "componente" : "prodotto";
  const dp = disegnoProdotto(T, p), radice = righeB(T,p).find(x=>x.radice);
  const faseNome = id => { const c = r.cid ? cicloB(T,r.cid) : null; const i = c ? c.fasi.findIndex(f=>f.id===id) : -1; return i>=0 ? `f.${(i+1)*10}` : ""; };
  const pr = vista==="prodotto" ? (dp.ok ? dp.pr : null) : prC;
  const schede = `<span class="seg dis-schede" role="group" aria-label="Quale disegno"><button type="button" data-dis-ciclo="prodotto" aria-pressed="${vista==="prodotto"}" title="Il PDF del prodotto finito: il riferimento (V)">Prodotto finito · <span class="mono">${esc(suffisso((radice||{}).cod||p.codice_richiesto, prefissoComune(righeB(T,p).map(x=>x.cod))))}</span></button>${eRadice?`<button type="button" disabled aria-disabled="true" title="È il prodotto finito: il suo disegno è la scheda «Prodotto finito»">Componente</button>`:`<button type="button" data-dis-ciclo="componente" aria-pressed="${vista==="componente"}" title="Il 2D del componente aperto (V)">Componente · <span class="mono">${esc(suffisso(r.cod, prefissoComune(righeB(T,p).map(x=>x.cod))))}</span></button>`}</span>`;
  const menu = S.disMenu ? `<span class="dis-menu" role="menu"><button type="button" role="menuitem" data-dis-zoom="-1">⊖ Riduci</button><button type="button" role="menuitem" data-dis-zoom="1">⊕ Ingrandisci</button><button type="button" role="menuitem" data-dis-zoom="0">⤢ Adatta</button><button type="button" role="menuitem" data-dis-nascondi="1">Nascondi il disegno (D)</button></span>` : "";
  const palco = vista==="prodotto"
    ? (dp.ok ? `<div class="ma-palco" data-anteprima="${esc(dp.url)}" title="${esc(dp.pr.nome_file)} · ${esc(dp.da)}"><div style="width:${Math.round(100*z)}%;margin:auto">${schizzo(dp.pr.nome_file)}</div></div>` : `<div class="ma-palco ma-palco--vuoto"><p>${esc(dp.testo)}</p></div>`)
    : (prC ? `<div class="ma-palco"><div style="width:${Math.round(100*z)}%;margin:auto">${schizzo(prC.nome_file)}</div></div>` : `<div class="ma-palco ma-palco--vuoto"><p>${esc(dc.testo)}</p></div>`);
  const anV = vista==="prodotto" ? (dp.ok ? dp.an : null) : (dc.ok ? dc.an : null);
  return `<section class="cl-disegno" aria-label="Disegno">
    <div class="ma-palco-barra dis-barra">${schede}<span class="sp"></span>
      ${pr&&anV?`<button type="button" class="ma-btn ma-btn--sm" data-pa-visore="1" data-pa-allegato="${esc(anV.allegato_id)}" data-pa-sha="${esc(anV.sha256)}" data-pa-file="${esc(pr.nome_file)}" title="Apre ${esc(pr.nome_file)} nel visore (GET /allegato/{id}/anteprima?v=sha256)">⤢ Visore</button>`:""}
      <span class="dis-piu"><button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-dis-menu="1" aria-expanded="${!!S.disMenu}" aria-label="Zoom e nascondi">⋯</button>${menu}</span></div>
    <div class="dis-file">${pr?`<span class="mono ma-palco-file" title="${esc(pr.nome_file)}">${esc(pr.nome_file)}</span>${vista==="prodotto"&&dp.proposto?` <span class="ma-st ma-st--prop" title="Il 2D del prodotto è solo proposto: lo conferma la vista Documenti (zona A)">proposto</span>`:""}`:`<span class="k3">${vista==="prodotto"?esc(dp.testo):"nessun 2D"}</span>`}</div>
    ${palco}
    <div class="cl-note"><span class="lab" title="R-14: note numerate sul disegno, legate alla fase aperta">Note sul disegno</span>
      ${note.length?note.map(x=>`<span><i class="cl-nota-n">${x.n}</i> ${esc(x.testo)}${x.fase?` → ${esc(faseNome(x.fase))}`:""}</span>`).join(""):""}
      ${r.cid&&note.length?btnB(`/rfq/${T.id}/domanda`, {tipo:"domanda", cid:r.cid, testo:`Domanda sulla nota ${note[note.length-1].n} del disegno: «${note[note.length-1].testo}»`}, "? Domanda tecnica al cliente", "pa-btn ma-btn--ghost"):""}
      ${r.cid?`<form data-pa-gesto="/componente/${r.cid}/nota"><input name="testo" id="nota-in" placeholder="nota legata alla fase aperta (N)" aria-label="Nota sul disegno"><input type="hidden" name="fase" value="${esc(S.faseAperta||"")}"><button class="ma-btn ma-btn--sm">+ nota</button></form>`:""}</div>
  </section>`;
}

/* ---------------- il foglio ---------------- */
function foglioCiclo(T, IX, p, g, n, r, pre, fare, ctrl){
  const c = r.cid ? cicloB(T,r.cid) : null, co = r.cid ? comeDi(T,r.cid) : null, pr = r.cid && !r.comm ? modoComponente(T,p,r) : null;
  const seme = SEMI[r.cod]||{}, ul = ULTIMA[r.cod];
  const zonaB = `<div class="tp-b" role="note" title="Proposta · dopo A2 · R-39 R-36">
      <span class="tp-b-v">modello ${c&&c.modello?`<b title="modello ${esc(c.modello)} · fonte ${esc(c.fonte||"")}">${esc((MODELLI[c.modello]||{}).nome||c.modello)}</b>${c.fonte&&c.fonte.startsWith("⧉")?" ⧉":""}`:pr?`<span class="pr" title="modello ${esc(pr.modello)}">${esc((MODELLI[pr.modello]||{}).nome||pr.modello)}</span> ${chipF(pr.fonte)}`:"—"}</span>
      <span class="tp-b-v">ultima volta ${ul?`<b title="fonte STO · ${esc(ul.rif)}">preventivo ${esc(ul.prev)} · consuntivo ${esc(ul.cons)}</b>`:"<i>—</i>"}</span>
      ${c&&c.delta?`<span class="tp-b-v">delta ECO: <b>${esc(c.delta)}</b></span>`:""}
      <span class="tp-b-v">peso netto ${seme.netto?`<span class="pr">${fmt(seme.netto[0],2)} kg</span> ${chipF(seme.netto[1])}`:"<i>—</i>"}</span></div>`;
  const testa = `<div class="cl-foglio-testa">${testataPezzo(T, IX, p, gruppoCiclo(IX,p), n, zonaB)}${S.copiaDa?pannelloCopia(T,p,r):""}</div>`;
  let corpo, barra = "";
  if(!r.cid){
    corpo = `<p class="ma-esito ma-esito--no">${I("alert",15)}<span>Sola lettura: il ciclo si scrive su un componente confermato. Prima la struttura e i codici: accetta il nodo o conferma l'albero in ①.</span></p>`;
  } else if(r.comm){
    corpo = `<div class="cl-vuoto"><b>Commerciale: nessun ciclo (decisione 07/10).</b><span>Lo compra Fabio ed entra in una fase del padre (saldatura o montaggio). Il 2D si chiede comunque; la conferma della minuteria è spenta (R-08).</span>
      ${na("Conferma la minuteria","la conferma della categoria arriva con lo spazio di verifica (R-08)")}</div>`;
  } else if(!co){
    corpo = `<div class="cl-vuoto"><b>Come si fa: non ancora deciso.</b><span>Proposta ◇ <span class="pr" title="modello ${esc(pr.modello)}">${esc(nomeModo(pr.modo))} · ${esc((MODELLI[pr.modello]||{}).nome||pr.modello)}</span> ${chipF(pr.fonte)} — ${esc(pr.perche)}</span>
      <span class="acts" style="display:flex;gap:8px;flex-wrap:wrap">${btnB(`/componente/${r.cid}/fornitura`, MODO_CON_CICLO.has(pr.modo)?{modo:pr.modo, conModello:"1"}:{modo:pr.modo}, "Accetta la proposta (Invio)", "", 'data-accetta-come="1"')}<button type="button" class="ma-btn ma-btn--sm" data-staz="2">Decidi in ② Come</button></span></div>`;
  } else if(!MODO_CON_CICLO.has(co.modo)){
    corpo = `<div class="cl-vuoto"><b>${esc(nomeModo(co.modo))}: nessun ciclo.</b><span>${co.modo==="cliente"?"Arriva dal cliente in conto lavoro: controllo in accettazione e data d'arrivo dall'ordine, nella Sequenza (T7).":co.modo==="escluso"?"Escluso dalla fornitura: «"+esc(co.testo)+"» va nell'offerta (T8).":"No quote: «"+esc(co.testo)+"» (KO in Esito)."}</span>
      <button type="button" class="ma-btn ma-btn--sm" data-staz="2">Cambia in ② Come</button></div>`;
  } else if(!c){
    corpo = `<div class="cl-vuoto"><b>Ciclo vuoto.</b><span>Modello ◇ ${esc((MODELLI[co.modello||pr.modello]||{}).nome||co.modello||pr.modello)} · scegli il modello o aggiungi le fasi.</span>${btnB(`/componente/${r.cid}/ciclo/modello`, {modello:co.modello||pr.modello}, `Applica «${esc((MODELLI[co.modello||pr.modello]||{}).nome||co.modello||pr.modello)}»`)}</div>${aggiungiFase(T,p,r,null)}`;
  } else {
    const ctrlC = ctrl.filter(x=>x.cid===r.cid);
    if(S.faseAperta===undefined || (S.faseAperta && !c.fasi.some(f=>f.id===S.faseAperta))){ const pr0 = c.fasi.find(f=>{ const s0 = statoFase(T,p,r.cid,f); return s0.proposte || s0.manca.length; }); S.faseAperta = pr0 ? pr0.id : null; }
    corpo = `${preparazioni(T,p,r,c)}${r.radice?rigaTrattamento(T,r,c):""}
      <div class="fasi" role="list" aria-label="Fasi del ciclo">${c.fasi.map((f,i)=>faseHtml(T,p,r,c,f,i,ctrlC)).join("")||`<p class="k3 piccolo">Nessuna fase.</p>`}</div>
      ${aggiungiFase(T,p,r,c)}
      ${controlliComponente(T,ctrlC)}`;
    barra = barraConferma(T,p,r,c,fare,pre,ctrlC);
  }

/* M2 di Lino: nel riepilogo ogni preparazione dice la SUA fase («maschera f.10 pre-unione · da quotare»); due dello stesso
   tipo e nello stesso stato si leggono insieme («2 maschere da quotare (f.10, f.30)») */
function riepilogoPrep(T, p, r, c, attive){
  const breve = v => (v.k==="altra" ? (v.nome||"altra") : nomePrep(v.k)).replace(/ di saldatura| del robot| di piega| di curvatura| di foratura| di controllo| di taglio/,"").toLowerCase();

  const parola = v => v.stato==="esiste già" ? "esiste già" : v.costo ? `${fmt(num(v.costo),0)} €` : "da quotare";
  const gruppi = [];
  for(const [,v] of attive){ const k = breve(v)+"|"+(v.costo?"€":parola(v)); const g = gruppi.find(x=>x.k===k); if(g) g.v.push(v); else gruppi.push({k, v:[v]}); }
  return gruppi.map(g=>g.v.length>1 && !g.v[0].costo ? `${esc(breve(g.v[0]).replace(/a$/,"e"))} ${esc(parola(g.v[0]))} (${g.v.map(x=>esc(fase(x))).join(", ")})`
    : g.v.map(v=>`${esc(breve(v))} ${esc(fase(v))} · ${esc(parola(v))}`).join(" · ")).join(" · ");

/* ---------------- le preparazioni (R-11 precisata): in testa, FUORI dalla sequenza delle fasi ----------------

   da fare | esiste già · costo € (e settimane) · Richiedi. In lettura: tipo, «nata dalla f.10 (pre-unione)», stato
   della richiesta, fonte. «+ preparazione ▾» è un menu con i 9 tipi. «Come si paga» lo decide Franco nell'Offerta. */

  const nome = v => v.k==="altra" ? (v.nome||"Altra") : nomePrep(v.k);

  const aperto = S.prepAperta || !!S.prepEvid;

        ${v.storico&&v.stato!=="esiste già"?`<span class="pr" title="dallo storico: ${esc(v.storico.rfq)}">◇ esiste già: ${esc(v.storico.rif)}</span>`:""}</span>
      <span class="seg" role="group" aria-label="Da fare o esiste già">${["da fare","esiste già"].map(st=>`<button type="button" data-pa-gesto="/componente/${r.cid}/preparazioni" data-pa-campi='${esc(JSON.stringify({k:v.k, key, stato:st, on:"1"}))}' aria-pressed="${!!v.on&&v.stato===st}">${st}</button>`).join("")}</span>

  return `<details class="prep" ${aperto?"open":""} data-prep-det="1"><summary title="Proposta · dopo A2 · R-11 · R-13"><span class="lab">Preparazioni</span>

    <div class="prep-corpo">${voci.map(riga).join("")||`<p class="k3 piccolo">Nascono dalla fase: «in maschera», saldatura robot, utensile o set mancante (✕), dima, calibro.</p>`}
      <span class="prep-agg"><button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-prep-menu="1" aria-expanded="${!!S.prepMenu}">+ preparazione ▾</button>${menu}</span></div></details>`;

/* ---------------- la riga di fase ---------------- */
const vF = (f,k) => f.par[k]!=null && f.par[k]!=="" ? f.par[k] : (f.prop[k] && f.prop[k][0]!=="" ? "◇"+f.prop[k][0] : "");
function nomiTerzi(s){ return String(s||"").replace(/^◇/,"").split(",").filter(Boolean).map(k=>nomeBreve(terz(k.trim()).nome)).join(", "); }
function riassuntoFase(T, r, c, f){

    case "piega": return j([x("pieghe")&&x("pieghe")+" pieghe", x("lmax")&&"L max "+x("lmax"), x("op")&&x("op")+" op.", t]);
    case "foratura": case "filettatura": case "smussatura": case "prigionieri": case "piantaggio": case "inserti": return j([x("n")?(x("n")+" × "+(x("mis")||({foratura:"fori",filettatura:"filetti",smussatura:"smussi",prigionieri:"dadi",piantaggio:"pezzi",inserti:"inserti"})[f.p])):x("mis"), t]);
    case "sald_mag": case "sald_robot": case "sald_tig": { const iu = r.figli.length ? infoUnione(T, null, r, c, f) : null;
      return j([iu ? (iu.entrano.length===r.figli.filter(y=>y.cid).length ? `tutti i ${iu.entrano.length} figli` : iu.entrano.length ? iu.entrano.map(e=>e.cod.replace(/^.*(\.\d{3})$/,"$1")).join(" + ") : "nessun figlio") : "", t, x("maschera")==="sì"||x("maschera")==="◇sì"?(x("maschera").startsWith("◇")?"◇":"")+"in maschera":"", x("norma")]); }

function corpoFase(T, p, r, c, f, i, sf, cc){

  </div>`;
}
/* un campo: dato accettato (testo normale) · proposta ◇ (corsivo prugna, Invio la accetta) · vuoto ★ «da scrivere» */
function campoB(T, p, r, c, f, d){
  const [k, l, u, star, tipo, opz] = d, val = valF(f,k), pr = propF(f,k), fonte = (f.fonti||{})[k];
  const span = tipo==="terzi"||k==="lav"||k==="norma"||k==="per"||k==="cosa"||k==="ops"||k==="masch"||k==="spec" ? "cb--3" : k===T_ ? "" : "";

  const lab = `<span class="cb-l" ${val?`title="fonte ${esc(fonte||"L")}"`:""}>${esc(l)}${star?` <span class="stella" title="serve a Franco">★</span>`:""} ${!val&&pr?chipF(pr[1]):""}</span>`;

/* un campo cambiato: una scrittura della fase (R-36); «=0,8*2,36» si calcola qui e la formula resta nel title [FE] */
function valoreEspressione(s){
  const e = String(s).slice(1).replace(/,/g,".");
  if(!/^[\d.\s+\-*/()]+$/.test(e)) return null;
  try { const v = Function(`"use strict";return (${e})`)(); return isFinite(v) ? Math.round(v*100)/100 : null; } catch(err){ return null; }
}
function scriviCampoVista(el){
  const [fid, k] = el.dataset.paCampo.split("|"), v = el.value.trim();
  if(el.dataset.prop!==undefined && v===el.dataset.prop){ eseguiB(`/fase/${fid}/accetta`, {campo:k}); return; }
  if(v.startsWith("=")){ const r = valoreEspressione(v); if(r==null){ PA.avviso = {esito:"no", testo:`L'espressione «${v}» non si calcola: usa numeri e + − × ÷.`}; render(); return; }
    eseguiB(`/fase/${fid}`, {[k]: String(r).replace(".",","), ["f_"+k]: v, fonte:"CALC"}); return; }
  eseguiB(`/fase/${fid}`, {[k]: v, fonte:"L"});
}
document.addEventListener("change", e=>{
  const el = e.target; if(!el || !el.dataset) return;
  if(el.dataset.paCampo){ scriviCampoVista(el); return; }
  if(el.dataset.paSpunta){ const [fid,k,si] = el.dataset.paSpunta.split("|"); eseguiB(`/fase/${fid}`, {[k]: el.checked ? si : "no", fonte:"L"}); return; }
  if(el.dataset.paPrep){ const [cid,key,campo] = el.dataset.paPrep.split("|"); const k = key.split("@")[0]; eseguiB(`/componente/${cid}/preparazioni`, campo==="on" ? {k, key, on: el.checked?"1":"0"} : {k, key, [campo]: el.value.trim(), on:"1"}); return; }
  if(el.dataset.paGrezzo){ const fid = el.dataset.paGrezzo, v = el.value.trim(); if(el.dataset.prop!==undefined && v===el.dataset.prop) eseguiB(`/fase/${fid}/materiale`, {accetta:"1"}); else eseguiB(`/fase/${fid}/materiale`, {cerca:v}); return; }
  if(el.dataset.diverso){ S.diverso = S.diverso || {}; S.diverso[el.dataset.diverso] = el.checked; render(); return; }
  if(el.dataset.cicloFiltroSel){ S.cicloFiltro = el.value || null; render(); return; }
});

function dopoCiclo(url, r, campi){
  if(r.esito!=="ok") return;
  if(/\/ciclo\/conferma$/.test(url)){ S.bcMenu = false; if(campi && campi.vai==="1"){ const T = threadAperto(), p = prodottoScelto(T), nx = prossimoDaFare(T,p,S.cicloCid); if(nx){ S.cicloCid = nx.cid; S.cicloRif = nx.rif; S.faseAperta = undefined; S.disCiclo = "componente"; } } }
  if(/\/(sposta|togli)$/.test(url)) S.faseMenu = null;
  if(/\/preparazioni$/.test(url) && campi && campi.k && !campi.key) S.prepMenu = false;
  if(/\/ciclo\/(copia|modello)$/.test(url)){ S.copiaDa = false; S.faseAperta = undefined; }
  if(/\/fornitura$/.test(url) && S.staz===3) S.faseAperta = undefined;
  if(/\/giunto$/.test(url)){ S.giuntoTesto = ""; S.giuntoForm = null; }
  if(/\/nota$/.test(url)) { const i = document.getElementById("nota-in"); if(i) i.value = ""; }
}

/* il confronto dei terzisti (T10): una riga per terzista con le sue risposte; il prezzo è in sola lettura (è di Franco),
   la scelta e il motivo li scrive Lino. Per un trattamento in più passi lo dice e rimanda all'altra fase. */
function confrontoTerzisti(T, r, c, f){
  const qq = [...(typeof QUOTAZIONI!=="undefined"?QUOTAZIONI:[]), ...QUOTAZIONI_B].filter(x=>x.cod===r.cod && x.p===f.p);
  const scelti = String(valF(f,"terzi")||"").split(",").filter(Boolean);
  const ids = [...new Set([...scelti, ...qq.map(x=>x.terz)])];
  const passi = TRATT.has(f.p) ? c.fasi.filter(x=>TRATT.has(x.p)) : [];
  const passo = passi.length>1 ? `<span class="cb-aiuto">trattamento in ${passi.length} passi: ${passi.map(x=>`${x===f?"<b>":""}f.${(c.fasi.indexOf(x)+1)*10} ${esc(PROC[x.p][0])}${x===f?"</b>":""}`).join(" → ")} · una sola richiesta ai verniciatori per tutti i passi</span>` : "";
  if(!ids.length) return passo;
  const sc = valF(f,"scelto");
  /* RIPROVA: una quotazione per riga (giri e storico), gli scaglioni non si spezzano a metà.
     RL-08: il materiale dichiarato accanto al prezzo, giallo se non è quello del disegno; RL-14: lo storico si dice */
  const mc = materialeComp(T, r.cid);
  const righe = ids.map(id=>{ const qs = qq.filter(x=>x.terz===id && (!x.tk || x.tk===T.key));
    const mat = qs.map(x=>x.materiale ? (mc && matDiscorde(x.materiale, mc.q) ? `<span class="cf-mat--no" title="MAT-05: non confrontabile con il disegno ${esc(mc.q)}">⚠ ${esc(x.materiale)} ≠ ${esc(mc.q)}</span>` : esc(x.materiale)) : `<span class="k3">—</span>`).join("<br>");
    return `<tr${sc===id?' class="cf-scelto"':""}><td>${esc(terz(id).nome)}</td><td class="mono">${qs.length?qs.map(x=>`<span class="cf-q">${x.lotti.map(([l,e])=>`<span class="cf-l">${fmt(l,0)} pz: ${fmt(e,2)} €</span>`).join(" · ")}${x.storico?` <span class="k3">(storico ${esc(x.storico)})</span>`:x.giro?` <span class="k3">(giro ${x.giro})</span>`:""}</span>`).join("<br>"):`<span class="k3">nessuna risposta</span>`}</td>
      <td>${qs.length?mat:"—"}</td><td class="k3">${qs.map(x=>esc(x.data)).join("<br>")||"—"}</td>
      <td>${btnB(`/fase/${f.id}`, {scelto: sc===id?"":id, fonte:"L"}, sc===id?"✓ scelto":"scegli", sc===id?"":"ma-btn--ghost", `aria-pressed="${sc===id}"`)}</td></tr>`; }).join("");
  return `${passo}<div class="cf"><span class="lab" title="R-13 R-17">Confronto dei terzisti</span>
    <div class="wrap-tb"><table class="cf-tab"><thead><tr><th>Terzista</th><th>Prezzo (sola lettura · Franco)</th><th>Materiale dichiarato</th><th>Data</th><th>Scelta</th></tr></thead><tbody>${righe}</tbody></table></div>
    <label class="cb cb--3"><span class="cb-l">Motivo della scelta</span><span class="cb-in"><input data-pa-campo="${f.id}|motivo" value="${esc(valF(f,"motivo")||"")}" placeholder="es. qualificato dal cliente, tempi più corti" aria-label="Motivo della scelta"></span></label></div>`;
}

/* ---------------- i tasti del Ciclo (chiamati da tastiStazione di 58) ---------------- */
function tastiCiclo(e){
  const k = e.key;
  if(S.blocco && S.blocco.staz===3){ if(k==="Enter"){ cliccaSe(".blocco-b [data-pa-gesto]"); e.preventDefault(); } return; }
  if(k==="ArrowRight"||k==="ArrowLeft"){ cliccaSe(`[data-ciclo-nav="${k==="ArrowRight"?1:-1}"]`); e.preventDefault(); return; }
  if(e.altKey && (k==="ArrowUp"||k==="ArrowDown") && S.faseAperta){ eseguiB(`/fase/${S.faseAperta}/sposta`, {dir: k==="ArrowUp"?"su":"giu"}); e.preventDefault(); return; }
  if(k==="d"||k==="D"){ S.disegnoNascosto = !S.disegnoNascosto; render(); e.preventDefault(); return; }
  if(k==="v"||k==="V"){ S.disCiclo = S.disCiclo==="componente" ? "prodotto" : "componente"; if(S.disegnoNascosto) S.disegnoNascosto = false; render(); e.preventDefault(); return; }
  if(k==="c"||k==="C"){ S.copiaDa = !S.copiaDa; render(); e.preventDefault(); return; }
  if(k==="n"||k==="N"){ const i = document.getElementById("nota-in"); if(i){ i.focus(); e.preventDefault(); } return; }
  if(k==="/"){ const i = document.getElementById("agg-fase"); if(i){ i.focus(); e.preventDefault(); } return; }
  if(k==="a"||k==="A"){ if(S.cicloSel && S.cicloSel.size){ S.blocco = {staz:3, cids:[...S.cicloSel], modello:null}; render(); e.preventDefault(); } return; }
}

/* ================= 49 · stazione ④ Sequenza (zona B · R-10 R-32 R-33 R-35 R-36 R-37 · R-31 R-38) =================
   SPEC_v16 §4. La Sequenza È l'albero del processo (49b), con un pannello a destra per correggere e la barra in basso.
   - Il dato: le fasi del padre (prodotto e sottoassiemi) e chi entra in quale fase (R-10 fase_componente). Gli stadi
     P · U · F · T · D · C si LEGGONO dalla lavorazione (R-12, R-32), non si salvano.
   - La proposta è un seme del server (SEQ-06): per i prodotti facili si conferma e basta. Per quelli complessi Lino la
     scrive tutta: aggiunge, toglie, rinomina, riordina stadi, sposta figli fra fasi, crea pre-unioni. OGNI gesto è una
     scrittura (R-36): nessuna bozza nella pagina. Appena scrive, il server non ripropone più («scritta da te»).
   - «Conferma la sequenza ⌃↵» manda la FIRMA di quello che si è letto, come «Conferma l'albero» (FB §6.5).
   - Un pezzo intermedio con un codice di magazzino non è una pre-unione: è un sottoassieme (R-31, «Proposte d'albero»).
     Il codice è VUOTO, senza segnaposto con un codice (DB7-7): lo scrive una persona. «L'albero non cambia».
   bloccoEntrano() e rigaMaschera() sono lo STESSO pezzo di interfaccia nel Ciclo (48) e qui (§4.7). */

const SEQ_STADI_AGG = ["foratura","raddrizzatura","sabbiatura","verniciatura_polvere","zincatura","controllo","montaggio","piantaggio","sald_mag","imballo"];
const SEQ_UNIONI_AGG = ["sald_mag","sald_robot","sald_tig","prigionieri","montaggio","piantaggio"];
const sufSeq = (T, p, cod) => { const pre = prefissoComune(righeB(T,p).map(r=>r.cod)); return suffisso(cod, pre); };
const nomeFaseSeq = (c, f) => `f.${(c.fasi.indexOf(f)+1)*10} ${valF(f,"nome") || (PROC[f.p]?PROC[f.p][0]:f.p)}`;

/* «Richiedi» di una preparazione: maschera e «altra» hanno due destinatari (Interno · Fornitore), le altre uno solo */
function richiediPrep(T, r, key, v){
  if(v.stato==="esiste già") return "";
  /* il legame preparazione → richiesta si LEGGE (P-10): le righe che la portano nelle note */
  const qq = richiesteDellaPrep(T, r.cid, key).filter(x=>x.stato!=="annullata");
  if(qq.length){ const q = qq[0]; return `<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-rq-apri="${esc(q.forn?(q.bisogno||"attrezzatura"):q.id)}" title="Apri nel cassetto ✉">${esc(q.id)}${qq.length>1?" +"+(qq.length-1):""} · ${esc(NOMI_STATO_RQ[q.stato]||q.stato)} ✉</button>`; }
  const rich = (PREP_INFO[v.k]||PREP_INFO.altra).rich, base = {cid:r.cid, fid:v.nata||"", prep:key};
  const interno = t => btnB(`/rfq/${T.id}/domanda`, Object.assign({tipo:t}, base), rich.length>1?"Interno":"Richiedi", "", `title="Bozza in Outlook a ${esc(TIPI_RICHIESTA[t].nomeDest)} (proposta R-28): costo e tempi. Niente parte da solo."`);
  const forn = apriRichiesta("attrezzatura", rich.length>1?"Fornitore":"Richiedi", "");
  if(rich.length>1) return `<span class="prep-rich"><span class="k3">Richiedi:</span>${interno(rich[0])}${forn}</span>`;
  return rich[0]==="attrezzatura" ? forn : interno(rich[0]);
}
/* sotto «in maschera»: una riga sola con lo stato della SUA maschera e «Richiedi» */
function rigaMaschera(T, p, r, c, f){
  if(valF(f,"maschera")!=="sì") return "";
  const x = prepVoci(c).find(([,v])=>v.k==="maschera" && v.nata===f.id && v.on);
  if(!x) return `<span class="prep-mini"><b>Maschera</b> · non ancora accesa</span>`;
  const [key, v] = x;
  const stato = v.stato==="esiste già" ? `esiste già · ${esc(v.riferimento||"")}` : v.costo ? `<b>${esc(v.chi||"")} ${fmt(num(v.costo),0)} €</b>${v.settimane?` · ${esc(v.settimane)} sett.`:""} ${v.fonte==="RISP"?chipF("RISP"):""}` : "da fare · da quotare";
  return `<span class="prep-mini" data-prep-riga="${esc(key)}">${I("wrench",13)} <b>Maschera</b> · ${stato} ${v.costo||v.stato==="esiste già"?"":richiediPrep(T, r, key, v)}${v.storico&&v.stato!=="esiste già"?` <span class="pr" title="dallo storico: ${esc(v.storico.rfq)}">◇ esiste già: ${esc(v.storico.rif)}</span>`:""}</span>`;
}
/* «Entrano»: la lista di scelta dei figli del padre (BOM confermata). Un clic fa entrare o uscire; un figlio in un'altra
   unione mostra «in f.10» e il clic lo SPOSTA (una scrittura sola). «dividi…» = solo una parte, campo obbligatorio e vuoto */
function bloccoEntrano(T, p, r, c, f, dove){
  const iu = infoUnione(T,p,r,c,f); if(!iu) return "";
  const u = unioniDi(c), righe = righeB(T,p);

    const altrove = u.filter(g=>g!==f && entranoDi(r,g).some(y=>y.cid===x.cid)).map(g=>`f.${(c.fasi.indexOf(g)+1)*10}`);
    const qta = e && e.qta!=null ? `${e.qta} di ${x.qta}` : x.qta;
    const lab = `${e?"✓ ":""}<span class="mono">${esc(sufSeq(T,p,x.cod))}</span> ×${qta}${rr.comm?" comm.":co&&co.modo==="cliente"?" dal cliente":""}${altrove.length?` <i>· in ${altrove.join(", ")}</i>`:""}${e&&e.fonte==="proposta"?" ◇":""}`;
    return btnB(`/fase/${f.id}/componente`, {cid:x.cid, entra: e?"0":"1"}, lab, e?"ent--su":"ent--no", `aria-pressed="${!!e}" title="${esc(x.cod)} · ${esc(x.descr||"")}${e?" · clic: esce da questa fase":altrove.length?" · clic: si sposta qui da "+altrove.join(", "):" · clic: entra in questa fase"}${e&&e.perche?" · "+esc(e.perche):""}"`); };
  const dividi = S.seqDividi===f.id ? `<form class="ent-dividi" data-pa-gesto="/fase/${f.id}/componente"><input type="hidden" name="entra" value="1"><input type="hidden" name="dividi" value="1">
      <select name="cid" aria-label="Figlio da dividere"><option value="">figlio</option>${r.figli.filter(x=>x.cid).map(x=>`<option value="${x.cid}">${esc(sufSeq(T,p,x.cod))} ×${x.qta}</option>`).join("")}</select>
      <input name="qta" value="" required inputmode="numeric" placeholder="quanti in questa fase" aria-label="Quanti pezzi in questa fase"><button class="ma-btn ma-btn--sm">Dividi</button>
      <button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-seq-dividi="">Annulla</button></form>` : "";
  const menuPrima = S.seqMenu===`prima|${f.id}|${dove}` ? `<span class="seq-menu" role="menu">${SEQ_UNIONI_AGG.map(k=>btnB(`/componente/${r.cid}/ciclo/fase`, {p:k, prima:f.id, seq:"1"}, esc(PROC[k][0]), "", 'role="menuitem"')).join("")}</span>` : "";
  const tutti = r.figli.filter(x=>x.cid), dentro = tutti.filter(x=>iu.entrano.some(y=>y.cid===x.cid));
  /* M-8: nel Ciclo una pre-unione con i suoi figli già dentro mostra solo quelli, più «+ altri figli ▾» (nella Sequenza tutti) */
  const corta = dove==="ciclo" && iu.preUnione && dentro.length>=2 && !(S.entAltri||{})[f.id], vis = corta ? dentro : tutti;
  return `<div class="ent" aria-label="Entrano nella fase ${iu.N}">
    <span class="lab" title="Dalla BOM confermata (STR). Un componente che manca non si aggiunge qui: si propone in Struttura (R-38).">Entrano${iu.preUnione?` · <b class="pp-tag pp-tag--pre">pre-unione</b>`:iu.principale&&u.length>1?" · unione principale":""}</span>
    <span class="ent-chips">${vis.map(chip).join("")}${corta?`<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-ent-altri="${f.id}" aria-expanded="false" title="Mostra gli altri figli del padre">+ altri figli (${tutti.length-dentro.length}) ▾</button>`:`<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-seq-dividi="${f.id}" title="Solo una parte dei pezzi in questa fase: il campo è obbligatorio e vuoto">dividi…</button>`}</span>
    ${dividi}
    <span class="ent-az"><button type="button" class="ma-btn ma-btn--sm" data-seq-menu="prima|${f.id}|${dove}" aria-expanded="${!!menuPrima}" title="Una fase di unione VUOTA subito prima di questa: i pezzi che vanno uniti prima di ogni altra lavorazione">+ fase di unione prima ▾</button>${menuPrima}
      ${dove==="ciclo"?`<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-vedi-albero="unione|${r.cid}|${f.id}" title="La stessa fase nell'albero del processo (④)">Vedi nell'albero →</button>`:""}</span>
  </div>`;
}

/* ---------------- la stazione ---------------- */
function stazioneSequenza(T, p){
  const banda = bandaB("R-10 · R-32 · R-33 · R-35 · R-36 · R-37","Sequenza e albero del processo: proposte, il backend di oggi non ha cicli né fasi. I motivi ⚠ vengono dalle regole R-35: senza R-35 l'albero mostra struttura e stati, senza motivi.");
  const sd = p ? stadiDi(T,p) : null;
  if(!sd || !sd.root.cid || !sd.ciclo) return `<div class="staz-vuota">${banda}${paAvvisoHtml()}<div class="empty"><span class="ib">${I("cube",22)}</span><h3>La sequenza si scrive sul prodotto confermato</h3><p>${!sd||!sd.root.cid?"Prima conferma l'albero: autorizza lo STEP, oppure aggiungi i componenti a mano (R-38).":`${esc(sd.root.cod)} non ha ancora un ciclo: prima ② Come e ③ Ciclo.`}</p>
    <div class="acts" style="justify-content:center"><button type="button" class="ma-btn" data-staz="${!sd||!sd.root.cid?1:2}">${!sd||!sd.root.cid?"← Struttura e documenti":"← ② Come"}</button></div></div>
    <div class="barra-conf seq-barra"><span class="bc-stato">sequenza non ancora scrivibile</span><span class="sp"></span><button type="button" class="ma-btn ma-btn--pri" disabled data-conferma-seq="1" title="La sequenza si scrive sul prodotto confermato: prima conferma l'albero: autorizza lo STEP, oppure aggiungi i componenti a mano (R-38).">Conferma la sequenza ⌃↵</button></div></div>`;
  const A = alberoProcesso(T,p), sq = seqDi(T,p), n = daSistemare(A), fonte = fonteSequenza(T,p);
  if(S.seqScelto && !trovaNodo(A, S.seqScelto)) S.seqScelto = null;
  const filtro = S.seqFiltro || "tutto", z = S.ppZoom || 1;
  const testa = `<div class="b-testa seq-testa"><h2>④ Sequenza</h2><span class="b-conta">${esc(sd.root.cod)} · ${esc(sd.root.descr||"")}</span><span class="sp"></span>
    <span class="seg" role="group" aria-label="Che cosa vedere">${[["tutto","tutto"],["sistemare",`solo da sistemare${n?" ("+n+")":""}`]].map(([k,l])=>`<button type="button" data-seq-filtro="${k}" aria-pressed="${filtro===k}">${l}</button>`).join("")}</span>
    <span class="seq-zoom"><button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-seq-menu="zoom" aria-expanded="${S.seqMenu==="zoom"}" title="Zoom (come nella Struttura)">⤢ ${Math.round(z*100)} % ▾</button>
      ${S.seqMenu==="zoom"?`<span class="seq-menu" role="menu"><button type="button" role="menuitem" data-pp-zoom="0">⤢ Adatta alla larghezza</button><button type="button" role="menuitem" data-pp-zoom="-1">− Rimpicciolisci</button><button type="button" role="menuitem" data-pp-zoom="1">+ Ingrandisci</button></span>`:""}</span>
    ${(()=>{ const ch = S.ppChiusi || new Set(), k = []; const giro = n => { if((n.tipo==="unione" || (n.tipo==="componente" && n.sottoassieme)) && (n.figli||[]).length) k.push(ppChiave(n)); (n.figli||[]).forEach(giro); }; (A.figli||[]).forEach(giro);
      return `<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-pp-tutti="apri" ${k.some(x=>ch.has(x))?"":"disabled"}>Apri tutto</button><button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-pp-tutti="chiudi" ${k.length&&!k.every(x=>ch.has(x))?"":"disabled"}>Chiudi tutto</button>`; })()}</div>`;
  const conf = A.confermata;
  const statoTxt = conf ? `<span class="ma-st ma-st--ok ma-st--piatto">✓ confermata il ${esc(sq.quando)}</span>` : fonte==="L" ? `<span class="ma-st ma-st--prop ma-st--piatto">◐ scritta da te</span>` : `<span class="ma-st ma-st--prop ma-st--piatto">◇ proposta del sistema</span>`;
  const firma = firmaSequenza(T,p);
  /* A1 di Lino: la domanda dice che cosa si toglie e che cosa resta aperto, letto dal piano del server (nessuna scrittura) */
  const piano = S.seqChiediRip ? pianoRipristino(T,p) : null;
  const chiedi = piano ? `<span class="seq-chiedi" role="alertdialog" aria-modal="false" aria-labelledby="seq-chiedi-t" aria-describedby="seq-chiedi-d"><b id="seq-chiedi-t">Torna la proposta del sistema?</b>
      <span id="seq-chiedi-d">${piano.togli.length?`Si tolgono: ${esc(piano.togli.map(x=>`${sufSeq(T,p,x.cod)} ${x.testo}`).join(", "))}.`:"Le unioni restano; chi entra torna come proposto."}${piano.aperte.length?` Resta aperta: ${esc(piano.aperte.map(x=>x.testo).join(", "))} (PREP-04).`:""}</span>
      ${btnB(`/prodotto/${sd.root.cid}/sequenza/ripristina`, {firma}, "Sì, ripristina", "", 'data-seq-ripristina="si"')}<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-seq-ripristina="no" id="seq-chiedi-no">No</button></span>` : "";
  const barra = `<div class="barra-conf seq-barra" role="group" aria-label="Conferma della sequenza">

    ${n?`<button type="button" class="ma-btn ma-btn--sm seq-manca" data-seq-filtro="sistemare" title="Mostra solo i nodi da sistemare">⚠ ${n} da sistemare</button>`:""}
    <span class="sp"></span>${chiedi}
    ${fonte==="L"&&!chiedi?`<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-seq-ripristina="chiedi">Ripristina la proposta</button>`:""}
    ${btnB(`/prodotto/${sd.root.cid}/sequenza/conferma`, {firma}, conf?"✓ Confermata":"Conferma la sequenza ⌃↵", "ma-btn--pri", `data-conferma-seq="1" title="Conferma quello che hai letto (con la firma): se nel frattempo è cambiato, il server dice di rileggere"`)}</div>`;
  return `<div class="staz-b seq16">${banda}${paAvvisoHtml()}<div class="seq16-main">${testa}
    <div class="seq16-corpo${S.seqScelto||S.seqPropAperte||S.r38descr?"":" seq16-corpo--vuoto"}">
      <section class="seq16-tela" aria-label="Albero del processo">${alberoProcessoHtml(T,p,A)}</section>
      <aside class="seq16-pannello" aria-label="Pannello del nodo scelto">${pannelloSeq(T,p,A)}</aside>
    </div>${barra}</div></div>`;
}
function trovaNodo(n, x){
  if(!n || !x) return null;
  const ok = x.tipo==="stadio" ? (n.cid===x.cid && ((n.tra||[]).concat(n.trasu||[], n.ultime||[], n.prima||[], n.dopo||[]).some(f=>f.fid===x.fid))) :
    n.tipo===x.tipo && n.cid===x.cid && (x.tipo!=="unione" || n.fid===x.fid) && (x.tipo!=="componente" || !x.padre || n.padre===x.padre);
  if(ok) return n;
  for(const y of (n.figli||[])){ const t = trovaNodo(y, x); if(t) return t; }
  return null;
}

/* ---------------- il pannello a destra: lo stadio, chi entra, i gesti ---------------- */
function pannelloSeq(T, p, A){
  const x = S.seqScelto;
  if(!x) return (S.seqPropAperte||S.r38descr) ? pannelloProdotto(T,p,A) : `<p class="seq-vuoto">Scegli un nodo: qui compaiono lo stadio, chi entra e i gesti.</p>`;
  const chiudi = `<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost seq-chiudi" data-seq-chiudi="1" title="Richiudi il pannello (Esc)">⇥ richiudi</button>`;
  if(x.tipo==="prodotto") return chiudi + pannelloProdotto(T,p,A);
  const r = rigaB(T,p,x.tipo==="componente"?x.padre:x.cid), c = r ? cicloB(T,r.cid) : null;
  if(x.tipo==="unione" || x.tipo==="stadio"){ const f = c ? c.fasi.find(y=>y.id===x.fid) : null; if(!f) return chiudi+`<p class="seq-vuoto">La fase non c'è più: scegli un altro nodo.</p>`; return chiudi + pannelloStadio(T,p,r,c,f); }
  if(x.tipo==="senza_fase") return chiudi + pannelloSenza(T,p,rigaB(T,p,x.cid));
  if(x.tipo==="componente") return chiudi + pannelloFiglio(T,p,A,x);
  return chiudi;
}

function pannelloStadio(T, p, r, c, f){
  const sc = stadiCiclo(T,p,r,c), st = (sc[c.fasi.indexOf(f)]||{}).st || "", est = PROC[f.p] && PROC[f.p][1]==="est";
  const testa = `<header class="seq-p-testa"><span class="pp-lett">${esc(st)}</span><h3>${UNIONE.has(f.p)?"◆ ":est?"⇄ ":""}${esc(nomeFaseSeq(c,f))}</h3>${menuFase(T,r,c,f)}</header>
    <p class="seq-p-sotto">${UNIONE.has(f.p)?"unione":est?"stadio esterno":"stadio"} · fase del padre <span class="mono">${esc(sufSeq(T,p,r.cod))}</span>${valF(f,"nome")?` · <span class="k3" title="nome della lavorazione">${esc(PROC[f.p][0])}</span>`:""}</p>${rinominaForm(f)}`;
  const vai = `<button type="button" class="ma-btn ma-btn--sm ma-btn--ghost" data-vai="3|${r.cid}|${f.id}">Apri nel Ciclo →</button>`;
  if(UNIONE.has(f.p)){
    const iu = infoUnione(T,p,r,c,f);
    const rifSel = `<label class="seq-rif"><span>Riferimento</span><select data-seq-rif="${f.id}" aria-label="Riferimento della fase di unione"><option value="">${iu.rif&&iu.rif.fonte==="CALC"?`◇ ${esc(sufSeq(T,p,iu.rif.cod))} (il più pesante · CALC)`:"scegli"}</option>${iu.entrano.map(e=>`<option value="${e.cid}" ${valF(f,"rif")===e.cid?"selected":""}>${esc(sufSeq(T,p,e.cod))}</option>`).join("")}</select></label>`;

    return `${testa}${bloccoEntrano(T,p,r,c,f,"seq")}${rifSel}${masch}
      <div class="seq-p-az">${menuStadio(T,r,c,f)}${vai}</div>
      <details class="seq-det"><summary>Pezzo intermedio con un codice di magazzino?</summary><p class="piccolo">Non è una pre-unione: è un sottoassieme vero. Si propone in <b>Proposte d'albero</b> (R-31): il codice lo scrive una persona e l'albero torna da confermare in Struttura.</p><button type="button" class="ma-btn ma-btn--sm" data-seq-scegli="prodotto|${A_root(T,p)}|prop">Proposte d'albero →</button></details>`;
  }
  const pre = suPreUnione(T,p,r,c,f);

  if(D.seqMenu!==undefined){ S.seqMenu = S.seqMenu===D.seqMenu ? null : D.seqMenu; render(); return; }
  if(D.ppZoom!==undefined){ const z = +D.ppZoom; S.ppZoom = z===0 ? zoomAdatta() : Math.min(1.5, Math.max(.5, +((S.ppZoom||1) + z*.1).toFixed(2))); render(); return; }
  if(D.ppTutti){ const T = threadAperto(), A = alberoProcesso(T, prodottoScelto(T)); const s = S.ppChiusi = new Set();
    if(D.ppTutti==="chiudi"){ const giro = n => { if(n.tipo==="unione" || (n.tipo==="componente" && n.sottoassieme)) s.add(ppChiave(n)); (n.figli||[]).forEach(giro); }; (A&&A.figli||[]).forEach(giro); }
    S.seqMenu = null; render(); return; }
  if(D.seqChiudi){ S.seqScelto = null; S.seqPropAperte = false; render(); return; }
  if(D.seqDividi!==undefined){ S.seqDividi = D.seqDividi || null; render(); return; }

  if(D.r31){ const c = document.getElementById("r31-cid"), k = document.getElementById("r31-codice"); if(!c||!k) return;

/* «da proteggere» (M): UN gesto (P-12): il server sceglie le fasi di trattamento del padre e aggiunge o toglie il figlio */
function proteggiFiglio(cid){
  const T = threadAperto(), p = prodottoScelto(T), x = S.seqScelto, r = rigaB(T,p,(x&&x.padre)||""), c = r ? cicloB(T,r.cid) : null;
  const tratt = c ? c.fasi.filter(f=>TRATT.has(f.p)) : [];
  if(!tratt.length){ PA.avviso = {esito:"no", testo:"Niente è cambiato: il padre non ha un trattamento, non c'è niente da proteggere."}; render(); return; }
  const on = tratt.some(f=>String(valF(f,"proteggi")||"").split(",").includes(cid));
  eseguiB(`/fase/${tratt[0].id}/proteggi`, {cid, on: on?"0":"1"});
}
/* riferimento (C): il figlio diventa il riferimento della fase di unione in cui entra */
function rifFiglio(cid){
  const T = threadAperto(), p = prodottoScelto(T), x = S.seqScelto, r = rigaB(T,p,(x&&x.padre)||""), c = r ? cicloB(T,r.cid) : null;
  const f = c ? unioniDi(c).find(g=>entranoDi(r,g).some(e=>e.cid===cid)) : null;
  if(!f){ PA.avviso = {esito:"no", testo:"Niente è cambiato: il figlio non entra in nessuna fase di unione (SEQ-01)."}; render(); return; }
  eseguiB(`/fase/${f.id}`, {rif: valF(f,"rif")===cid ? "" : cid, fonte:"L"});
}

/* ---------------- i tasti della stazione (chiamati da tastiStazione di 58) ---------------- */
function tastiSequenza(e){
  const k = e.key;
  if(k==="Enter" && !e.shiftKey && S.seqScelto && S.seqScelto.tipo==="componente"){
    /* Invio accetta la proposta ◇ così com'è (niente da scrivere) e scende al figlio dopo */
    const vis = ppNodiVisibili().filter(x=>x.dataset.ppTipo==="componente"), i = vis.findIndex(x=>x.dataset.ppNodo===ppSceltoChiave());
    if(vis[i+1]) ppScegliDa(vis[i+1]); e.preventDefault(); return; }
  if(tastiAlbero(e)){ e.preventDefault(); return; }
  const x = S.seqScelto; if(!x) return;
  const T = threadAperto(), p = prodottoScelto(T);
  if(/^[1-9]$/.test(k) && x.tipo==="componente"){ const r = rigaB(T,p,x.padre), c = r ? cicloB(T,r.cid) : null, f = unioniDi(c)[+k-1];
    if(f){ eseguiB(`/fase/${f.id}/componente`, {cid:x.cid, entra:"1"}); } else { PA.avviso = {esito:"no", testo:`Niente è cambiato: il padre ha ${unioniDi(c).length} fasi di unione.`}; render(); } e.preventDefault(); return; }
  if((k==="m"||k==="M") && x.tipo==="componente"){ proteggiFiglio(x.cid); e.preventDefault(); return; }
  if((k==="c"||k==="C") && x.tipo==="componente"){ rifFiglio(x.cid); e.preventDefault(); return; }
}
/* Alt+↑↓ riordina lo stadio scelto (il gestore globale lascia passare Alt solo nel Ciclo); Esc richiude il pannello */
document.addEventListener("keydown", e=>{
  if(S.tab!=="rfq" || S.staz!==4) return;
  const t = e.target, campo = t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT");
  if(e.altKey && (e.key==="ArrowUp"||e.key==="ArrowDown") && !campo && S.seqScelto && S.seqScelto.fid && ["unione","stadio"].includes(S.seqScelto.tipo)){
    eseguiB(`/fase/${S.seqScelto.fid}/sposta`, {dir: e.key==="ArrowUp"?"su":"giu"}); e.preventDefault(); e.stopPropagation(); return; }
  if(e.key==="Escape" && !campo && !S.cassetto && !S.menu && !S.dialogo && !document.getElementById("ma-domanda")){
    if(S.seqMenu||S.seqDividi||S.seqRinomina||S.seqChiediRip){ S.seqMenu = S.seqDividi = S.seqRinomina = null; S.seqChiediRip = false; render(); e.preventDefault(); e.stopPropagation(); return; }
    if(S.seqScelto){ S.seqScelto = null; render(); e.preventDefault(); e.stopPropagation(); } }
}, true);

/* dopo un gesto B della Sequenza: i menu si chiudono, la fase nuova diventa il nodo scelto */
function dopoSequenza(url, r){
  if(/\/sequenza\/ripristina$/.test(url)) S.seqChiediRip = false;
  if(r.esito!=="ok") return;
  if(/\/fase\/[^/]+\/componente$/.test(url)) S.seqDividi = null;
  if(/\/ciclo\/fase$/.test(url) && r.fid && S.staz===4){ const T = threadAperto(), x = faseDelThread(T, r.fid); if(x) S.seqScelto = {tipo: UNIONE.has(x.f.p)?"unione":"stadio", cid:x.cid, fid:r.fid, padre:null}; }
  if(/\/fase\/[^/]+$/.test(url)) S.seqRinomina = null;
  if(/\/togli$/.test(url) && S.staz===4) S.seqScelto = null;
  S.seqMenu = null;
}

/* ================= 49b · l'albero del processo (zona B · R-10 R-32 R-37) =================

   zoom «⤢ 100 % ▾», Apri tutto / Chiudi tutto, rastrello oltre 5 foglie), ma un COMPONENTE SEPARATO:

const PP_STATO = { ok:["✓","completo"], bozza:["◐","bozza"], proposta:["◇","proposta"], manca:["⚠","da sistemare"], vuota:["○","scegli chi entra"] };

function ppMot(n){

      <span class="pp-u-d">${n.stato==="vuota"?"":n.rif?`rif <span class="mono">${esc(n.rif.cod.replace(/^F\+800\.514263/,""))}</span>${n.rif.fonte==="CALC"?" ◇":""}`:"rif —"}${ppStato(n.stato)}${n.stato==="vuota"?"":mot}</span>

/* un livello dell'organigramma; le foglie oltre 5 vanno nel rastrello (una colonna con il pettine) */
function ppLi(n, liv){

/* la catena delle unioni porta su ogni rombo le fasi che lo SEGUONO fino alla prossima unione: il ramo che sale.
   Le ultime fasi del prodotto (anche il controllo finale e l'imballo) e quelle di un sottoassieme stanno sul ramo della loro
   ultima unione: così sono tutte nodi dell'albero, raggiungibili da tastiera (M-2) */
function ppPrepara(n, sopra){
  if(!n) return n;
  if(n.tipo==="prodotto"){ const top = (n.figli||[]).find(x=>x.tipo==="unione"); if(top) top.trasu = (n.ultime||[]); }
  if(n.tipo==="componente" && n.sottoassieme){ const top = (n.figli||[]).find(x=>x.tipo==="unione"); if(top){ top.trasu = (n.dopo||[]); n.fasi = []; } }
  if(n.tipo==="unione"){ const giu = (n.figli||[]).find(x=>x.tipo==="unione"); if(giu) giu.trasu = giu.tra; }

}
function alberoProcessoHtml(T, p, A){

    <ul class="pp-albero${A.confermata?" pp-albero--conf":""}" role="tree" aria-label="Albero del processo di ${esc(A.cod)}" aria-describedby="pp-tasti">${ppLi(A, 1)}</ul></div></div>

/* lista piatta dei nodi visibili (per la tastiera): l'ordine del DOM */
function ppNodiVisibili(){ return [...document.querySelectorAll(".pp-albero [data-pp-nodo]")]; }
/* la catena verticale di un li: le fasi del ramo (dall'alto) e poi la casella o il rombo */
const ppCatenaLi = li => li ? [...li.querySelectorAll(":scope > .pp-ramo [data-pp-nodo]"), ...li.querySelectorAll(":scope > [data-pp-nodo]")] : [];
const ppFigliLi = li => li ? [...li.querySelectorAll(":scope > ul > li.pp-li, :scope > ul > li.pp-li--rastrello > ul > li.pp-li")].filter(x=>!x.classList.contains("pp-li--rastrello")) : [];
const ppFratelliLi = li => { if(!li) return []; const su = li.parentElement && li.parentElement.closest("li.pp-li:not(.pp-li--rastrello)"); return su ? ppFigliLi(su) : [li]; };
function ppScegliDa(el){

  S.seqScelto = {tipo:D.ppTipo, cid:D.ppCid||null, fid:D.ppFid||null, padre:D.ppPadre||null};
  render(); const x = ppNodiVisibili().find(y=>y.dataset.ppNodo===D.ppNodo); if(x) ppMostra(x);
}
/* A-1, M9: il nodo scelto prende il fuoco senza far saltare la tela; se è fuori vista, la tela lo centra */
function ppMostra(x){
  try{ x.focus({preventScroll:true}); }catch(e){ try{ x.focus(); }catch(e2){} }
  const tela = x.closest(".seq16-tela"); if(!tela || !x.getBoundingClientRect) return;
  const a = x.getBoundingClientRect(), b = tela.getBoundingClientRect();
  const fuori = a.left < b.left || a.right > b.right || a.top < b.top || a.bottom > b.bottom;

}
/* M-1: i tasti come la Struttura e motore_a.mjs (tastiAlbero): ↓ il nodo sotto (apre se chiuso), ↑ quello sopra,
   ← → i nodi accanto, Home e Fine, + e −. Invio sceglie; Maiusc+Invio apre il ciclo del nodo */
function tastiAlbero(e){
  const vis = ppNodiVisibili(); if(!vis.length) return false;
  const k = e.key, el = vis.find(x=>x.dataset.ppNodo===ppSceltoChiave()) || (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.ppNodo ? document.activeElement : null);
  if(!el){ if(["ArrowDown","ArrowUp","ArrowLeft","ArrowRight","Home","End"].includes(k)){ ppScegliDa(k==="End"?vis[vis.length-1]:vis[0]); return true; } return false; }
  const li = el.closest("li.pp-li"), cat = ppCatenaLi(li), i = cat.indexOf(el);
  const box = l => l ? l.querySelector(":scope > [data-pp-nodo]") : null;
  if(k==="ArrowUp"){ if(i>0) ppScegliDa(cat[i-1]); else { const su = li.parentElement && li.parentElement.closest("li.pp-li:not(.pp-li--rastrello)"); if(su) ppScegliDa(box(su)); } return true; }
  if(k==="ArrowDown"){ if(i<cat.length-1){ ppScegliDa(cat[i+1]); return true; }
    if(el.getAttribute("aria-expanded")==="false"){ const s = S.ppChiusi || (S.ppChiusi = new Set()); s.delete(el.dataset.ppNodo); render(); }
    const l2 = document.querySelector(`.pp-albero [data-pp-nodo="${(window.CSS&&window.CSS.escape)?window.CSS.escape(el.dataset.ppNodo):el.dataset.ppNodo}"]`), li2 = l2 && l2.closest("li.pp-li"), f = ppFigliLi(li2)[0];
    if(f) ppScegliDa(ppCatenaLi(f)[0]); return true; }
  if(k==="ArrowLeft"||k==="ArrowRight"){ const fr = ppFratelliLi(li), j = fr.indexOf(li), d = fr[j + (k==="ArrowRight"?1:-1)]; if(d) ppScegliDa(box(d)); return true; }
  if(k==="Home"){ ppScegliDa(vis[0]); return true; }
  if(k==="End"){ ppScegliDa(vis[vis.length-1]); return true; }
  if((k==="+"||k==="-") && el.hasAttribute("aria-expanded")){ const s = S.ppChiusi || (S.ppChiusi = new Set()); if(k==="-") s.add(el.dataset.ppNodo); else s.delete(el.dataset.ppNodo); render(); const x = ppNodiVisibili().find(y=>y.dataset.ppNodo===el.dataset.ppNodo); if(x) ppMostra(x); return true; }

  return false;
}
document.addEventListener("click", e=>{

  if(ap){ const s = S.ppChiusi || (S.ppChiusi = new Set()); const k = ap.dataset.ppApri; if(s.has(k)) s.delete(k); else s.add(k); render(); e.stopPropagation(); return; }
  if(e.target.closest && e.target.closest("[data-vai],[data-pp-stadio]")) return;   /* le sigle e le chiavi inglesi portano al Ciclo (48); gli stadi li sceglie 49 */
  const n = e.target.closest && e.target.closest(".pp-albero [data-pp-nodo]");
  if(n){ const gia = n.dataset.ppNodo===ppSceltoChiave(); if(gia && e.detail>1) return; ppScegliDa(n); }
});
/* M9: entrando nella stazione, se l'albero è più largo della tela, «Adatta» da solo (una volta per prodotto) */
function adattaAlberoProcesso(){
  if(S.staz!==4) return;
  const T = threadAperto(), p = T ? prodottoScelto(T) : null, chiave = (T?T.key:"")+"|"+(p?p.rif:"");
  if(S.ppAdattato===chiave) return;
  const tela = document.querySelector(".seq16-tela"); if(!tela || !tela.clientWidth) return;
  S.ppAdattato = chiave;
  const z = zoomAdatta(); if(z < (S.ppZoom||1)){ S.ppZoom = z; render(); }
}
/* «Adatta alla larghezza», come nella Struttura (zoom CSS, non transform: la tela scorre davvero sul contenuto) */
function zoomAdatta(){
  const tela = document.querySelector(".seq16-tela"); if(!tela) return 1;
  const largo = tela.scrollWidth / (S.ppZoom||1); if(!largo || !tela.clientWidth) return 1;
  return Math.max(.5, Math.min(1, Math.floor((tela.clientWidth-28)/largo*20)/20));
}

/* ================= 51 · stazione ⑤ Esito → Franco (zona B · D-01 D-02 R-35 R-40) =================
   SPEC_v15 §2.7. Una riga per componente con UNA colonna «esito» (B3): la proposta del server è il segmento con ◇, la
   decisione di Lino lo rende pieno. «Accetta le N proposte OK…» elenca le righe prima di scrivere (gesto B esplicito,
   non tocca BOM, fonte o documenti). Le firme sono segmenti (M3). «Consegna a Franco» registra la firma dell'area
   tecnica, fotografa la Distinta PER OGNI LOTTO SPUNTATO (partono non spuntati) e avvisa Franco: NON tocca la fase,
   l'albero, la fonte o i documenti (RV-29). Con un KO diventa «Consegna come no quote»; un DUBBIO non blocca.
   La stessa stazione apre, per il ruolo Franco, il Foglio per Franco, i Costi, i Listini e l'Offerta (52). */

/* P-07: «minuteria a norma» non si conferma qui: è della zona C (R-08), spenta con lo stesso motivo (minuteriaSpenta, 47) */
const VISTE_5 = [["esito","Esito (Lino)"],["foglio","Foglio per Franco"],["costi","Costi"],["listini","Listini"],["offerta","Offerta"]];
/* v16 (SE §4.10): il sottomenu dipende dal ruolo. Lino vede «Esito» e il collegamento al Foglio; Costi, Listini e Offerta
   stanno nel «⋯». Con il ruolo Franco si vedono le sue quattro viste, ed «Esito» resta raggiungibile. */
function navEsito(){
  const b = ([k,l]) => `<button type="button" data-esito-vista="${k}" aria-current="${S.esitoVista===k?"page":"false"}">${esc(l)}</button>`;
  const piuV = l => `<details class="piu"><summary aria-label="Altre viste della stazione ⑤" title="Altre viste">⋯</summary><div class="piu-corpo" role="group" aria-label="Altre viste">${l.map(([k,x])=>`<button type="button" class="ma-btn ma-btn--sm" data-esito-vista="${k}">${esc(x)}</button>`).join("")}</div></details>`;
  if(S.ruolo==="Franco") return `<nav class="off-nav" aria-label="Viste della stazione ⑤">${VISTE_5.slice(1).map(b).join("")}${b(VISTE_5[0])}</nav>`;
  const cur = VISTE_5.find(x=>x[0]===S.esitoVista) || VISTE_5[0];
  const vis = [VISTE_5[0], VISTE_5[1]]; if(!vis.includes(cur)) vis.push(cur);
  return `<nav class="off-nav" aria-label="Viste della stazione ⑤">${vis.map(b).join("")}${piuV(VISTE_5.filter(x=>!vis.includes(x)))}</nav>`;
}

/* RL-17: «Matematica (3D)» è SI solo con un documento 3D (STEP) nel thread o con lo STEP autorizzato; altrimenti «NO · solo 2D» */
function tre3D(T, p){
  if(p.fonte.stato==="confermata") return "SI";
  const step = Object.values(T.allegati).some(a=>/^(step|stp|igs)$/i.test(a.tipo||"") || /\.(step|stp|igs)$/i.test(a.nome));
  return step ? "da verificare" : "NO";
}
function stazioneEsito(T, p){
  const banda = bandaB("D-01 · D-02 · R-35 · R-40 · R-11","esiti, firme, attrezzature e consegna non sono nel backend di oggi; la fase cambia solo con un gesto registrato");
  if(!S.esitoVista) S.esitoVista = S.ruolo==="Franco" ? "foglio" : "esito";
  const nav = navEsito();
  const bandaF = S.esitoVista==="foglio" ? bandaB("R-40 · D-01","il Foglio per Franco è la fotografia della consegna")
    : bandaB("R-10…R-36 · costi","costi, listini e offerta: tariffe di esempio nella forma del Mod 99 o marcate «inventato»");
  if(S.esitoVista!=="esito") return `<div class="staz-b">${bandaF}${paAvvisoHtml()}<div class="b-testa">${nav}</div><div class="b-corpo">${vistaFrancesco(T,p)}</div></div>`;
  const righe = p ? righeB(T,p).filter(r=>r.cid) : [];
  if(!righe.length) return `<div class="staz-vuota">${banda}<div class="b-testa">${nav}</div><div class="empty"><span class="ib">${I("cube",22)}</span><h3>Nessun componente confermato</h3><p>L'esito si dà sui componenti: prima la stazione ①.</p></div></div>`;
  const S2 = a2Di(T), root = righe.find(r=>r.radice) || righe[0];
  const prop = Object.fromEntries(righe.map(r=>[r.cid, esitoProposto(T,p,r.cid)]));
  const deciso = r => (S2.esiti[r.cid]||{}).v || null;
  const val = r => deciso(r) || prop[r.cid].v;
  const peggio = ["OK","DUBBIO","KO"][Math.max(...righe.map(r=>["OK","DUBBIO","KO"].indexOf(val(r))))];
  const nDB = controlliB(T,p).filter(x=>x.liv==="DB").length;
  const {fare} = elencoCiclo(T,p), nCicli = fare.filter(r=>{ const c=cicloB(T,r.cid); return c&&c.stato==="confermato"; }).length;
  const rq = REQUISITI[T.key]||[], rqOk = rq.filter(q=>requisitoCoperto(T,p,q).ok).length;
  /* RL-23: le risposte arrivate e non ancora registrate sono richieste ancora aperte */
  const daReg = S2.richieste.filter(q=>["offerta_ricevuta","risposta"].includes(q.stato) && !registrazioneDi(T,q)).length;
  const aperte = S2.richieste.filter(q=>["inviata","bozza"].includes(q.stato)).length + daReg, sq = seqDi(T,p);
  if(!S.esitoRiga || !righe.some(r=>r.cid===S.esitoRiga)) S.esitoRiga = righe[0].cid;
  const okProposti = righe.filter(r=>!deciso(r) && prop[r.cid].v==="OK");
  const pre = prefissoComune(righe.map(r=>r.cod));
  const LIV_ORD = {KO:0, DB:1, AV:2};
  /* la riga corrente ha OK · DUBBIO · KO interi; le altre il solo valore (S-06): un clic lo apre, i tasti O B X restano */
  const riga = r => { const pv = prop[r.cid], dv = deciso(r), cur = S.esitoRiga===r.cid, nota = (S2.esiti[r.cid]||{}).nota||"";
    const regole = pv.perche.filter(x=>x.cod!=="DOC-02").slice().sort((a,b)=>(LIV_ORD[a.liv]??3)-(LIV_ORD[b.liv]??3));
    const regola = x => `<span><span class="liv liv--${x.liv}">${x.cod}</span> ${esc(x.testo.replace(r.cod+": ","").replace(r.cod+" ",""))}</span>`;
    /* M-8: le regole in più si leggono sulla riga scelta (un clic sulla riga); sulle altre resta «+n» come testo */

    const seg = cur ? `<span class="seg seg--esito" role="group" aria-label="Esito di ${esc(r.cod)}">${["OK","DUBBIO","KO"].map(v=>`<button type="button" data-v="${v}" data-pa-gesto="/componente/${r.cid}/fattibilita" data-pa-campi='${JSON.stringify({esito:v})}' aria-pressed="${dv===v}" class="${!dv&&pv.v===v?"seg--prop":""}" title="${!dv&&pv.v===v?"proposta del sistema ◇":""}"><kbd>${{OK:"O",DUBBIO:"B",KO:"X"}[v]}</kbd>${!dv&&pv.v===v?"◇ ":""}${v}</button>`).join("")}</span>`
      : `<span class="seg seg--esito seg--compatta" role="group" aria-label="Esito di ${esc(r.cod)}"><button type="button" data-v="${dv||pv.v}" data-esito-apri="${r.cid}" aria-pressed="${!!dv}" class="${dv?"":"seg--prop"}" title="${dv?"deciso da te":"proposta del sistema ◇"}: clic per cambiarlo (O B X)">${dv?"":"◇ "}${dv||pv.v}</button></span>`;
    const campoNota = cur || dv==="DUBBIO" || dv==="KO" ? `<input class="nota" data-esito-nota="${r.cid}" value="${esc(nota)}" placeholder="nota per il cliente o l'ufficio" aria-label="Nota per ${esc(r.cod)}">`
      : nota ? `<span class="es-nota" title="clic sulla riga per cambiarla">${esc(nota)}</span>` : `<span class="es-nota es-nota--agg" data-esito-apri="${r.cid}" data-esito-fuoco="1" title="clic: scrivi una nota su questa riga">+ nota</span>`;
    return `<tr class="${cur?"es-cur":""}" data-esito-riga="${r.cid}"><td><b class="mono" title="${esc(r.cod)}">${esc(suffisso(r.cod,pre))}</b> <span class="k3 piccolo">${esc(r.descr)}</span></td>
      <td>${seg}</td><td><span class="esito-perche">${perche}${r.comm&&cur?minuteriaSpenta():""}</span></td><td>${campoNota}</td></tr>`; };
  const anteprima = S.esitoAnteprima ? `<div class="blocco-b"><b>Accetterai ${okProposti.length} proposte OK, una per riga:</b><ul>${okProposti.map(r=>`<li><span class="mono">${esc(r.cod)}</span> ${esc(r.descr)}</li>`).join("")}</ul>

      <span class="k3 piccolo">Non tocca BOM, fonte o documenti. I DUBBI e i KO si decidono uno per uno.</span></div></div>` : "";
  const reqs = rq.map(q=>{ const c = requisitoCoperto(T,p,q), visto = S2.visti[q.id];
    if(q.tipo==="condizione") return `<div><span title="fonte: ${esc(NOME_FONTE[q.fonte]||q.fonte||"")}">${esc(q.testo)}</span>${visto?`<span class="ma-st ma-st--ok">vista da ${esc(visto.da)} ${esc(visto.data)}</span>`:`${q.avvisa?(richiesteDi(T,root.cid).some(x=>x.tipo==="commerciale"&&x.stato!=="annullata")?`<span class="ma-st ma-st--prop">avvisato: attende il commerciale</span>`:btnB(`/rfq/${T.id}/domanda`, {tipo:"commerciale", cid:root.cid, testo:`Condizione dell'ordine: ${q.testo}. Rispondere entro la scadenza.`}, "✉ Avvisa il commerciale", "pa-btn")):""} <span class="liv liv--DB" title="ORD-01">da vedere</span>`}</div>`;
    return `<div><span title="fonte: ${esc(NOME_FONTE[q.fonte]||q.fonte||"")}">${esc(q.testo)}</span>${c.ok?`<span class="ma-st ma-st--ok">→ ${esc(c.dove)} ✓</span>`:`<span class="ma-st ma-st--ver">nessuna fase</span> <span class="liv liv--DB">REQ-01</span> <button type="button" class="ma-btn ma-btn--sm" data-vai="3|${root.cid}">→ aggiungi o correggi la fase</button>`}</div>`; }).join("");
  /* Dati e documenti (Mod 99): sei interruttori; la proposta ◇ si accetta con un clic o tutte insieme */

  const att = righe.filter(r=>r.b==="attr").reduce((a,r)=>a+r.eur,0), sub = righe.filter(r=>r.b!=="attr"&&r.b!=="trasp").reduce((a,r)=>a+r.eur,0);
  /* RL-15: senza una quotazione il trasporto è il 5 % del subtotale più il ricarico acquisti (Mod 99, Q111: × 1,10) */
  const tr = righe.filter(r=>r.b==="trasp"), trasp = tr.length ? tr.reduce((a,r)=>a+r.eur,0) : sub*RIC.trasp.v/100*(1+RIC.acq.v/100);
  const tot = sub+trasp, conAtt = tot+att, mdc = mdcDi(C0), calc = conAtt/(1-mdc), off = num(C0.prezzo[i]), prezzo = off!=null ? off : arrot(calc);
  const peso = foto.righe.filter(r=>!r.radice && SEMI[r.cod] && SEMI[r.cod].netto).reduce((a,r)=>a+num(SEMI[r.cod].netto[0])*r.qtaProd,0);
  return {L, righe, esclusi, aParte, nq, sub, trasp, trConQuot:tr.length>0, tot, att, conAtt, calc, prezzo, mdcEff: prezzo ? (prezzo-conAtt)/prezzo : null, peso, manca: righe.filter(r=>r.manca).length};
}

/* le preparazioni dei prodotti consegnati: dal finto server A2 (preparazioniRFQ, C2) o, prima, dai cicli fotografati */
function prepDi(T, foto){
  const cids = new Set(foto.righe.map(r=>r.cid));
  const norm = x => Object.assign({}, x, {key: x.cid+"|"+(x.key||x.k+(x.fid?"@"+x.fid:"")), nome: x.nome || nomePrep(x.k), esiste: x.stato==="esiste già" || x.stato==="esiste_gia"});
  if(typeof preparazioniRFQ==="function"){ try { return preparazioniRFQ(T).filter(x=>cids.has(x.cid) && x.stato!=="proposta").map(norm); } catch(err){} }
  const out = [];
  for(const r of foto.righe) Object.entries(((foto.cicli[r.cid]||{}).prep)||{}).forEach(([k,v])=>{ if(v.on) out.push(norm({cid:r.cid, cod:r.cod, k, fid:v.nata||null, stato:v.stato, costo:v.costo, settimane:v.settimane||null, fonte:v.fonte||""})); });
  return out;
}
/* le settimane dell'attrezzatura pesano sul primo ordine (Cabine Omega: 20 settimane): proposta ◇, decide Franco */
const settAttrezzature = (T, foto) => Math.max(0, ...prepDi(T,foto).filter(x=>!x.esiste).map(x=>num(x.settimane)||0));

function campoCosto(T, foto, r){
  const e = r.edit; if(!e) return "";
  const C0 = costoDi(T,foto);
  if(e.t==="mat") return `<span class="cedit"><label>kg <input data-cs="kg|${e.id}" value="${e.kg!=null?String(e.kg).replace(".",","):""}" placeholder="${e.kgPh?fmt(e.kgPh,2):"kg"}" inputmode="decimal"></label>
    <label>€/kg <input data-cs="eurkg|${e.id}" value="${e.ek!=null?String(e.ek).replace(".",","):""}" placeholder="${e.ekPh!=null?fmt(e.ekPh,2):"€/kg"}" inputmode="decimal"></label></span>`;
  if(e.t==="int" && (e.laser||e.incl)) return `<span class="cedit"><label><input type="checkbox" data-cs="incl|${e.id}" ${e.incl?"checked":""}> compresa</label></span>`;
  if(e.t==="int") return `<span class="cedit"><label>pz/h <input data-cs="pzh|${e.id}" value="${esc(C0.pzh[e.id]||"")}" placeholder="${esc(e.ph||"pz/h")}" inputmode="decimal"></label><label><input type="checkbox" data-cs="incl|${e.id}"> compresa</label></span>`;
  if(e.t==="est"){
    /* RL-04: la quotazione si sceglie PER LOTTO (C0.qsel[fase@lotto]); vuoto = la più conveniente fra quelle utilizzabili */
    const mc = r.r && foto.cicli[r.r.cid] ? matCiclo(foto.cicli[r.r.cid]) : null;
    const opz = sel => `<option value="" ${!sel?"selected":""}>la più conveniente</option>${e.cands.map(x=>`<option value="${x.id}" ${sel===x.id?"selected":""}>${esc(nomeBreve(terz(x.terz).nome))} · ${x.lotti.map(([l,p])=>l+" pz "+fmtE(p)).join(" / ")}${x.f==="risp"?" · RISP"+(x.giro?" giro "+x.giro:""):""}${x.storico?" · storico "+esc(x.storico):""}${mc&&matDiscorde(x.materiale,mc)?" · ⚠ "+esc(x.materiale):""}</option>`).join("")}<option value="man" ${sel==="man"?"selected":""}>prezzo a mano</option>`;
    const selDi = L => C0.qsel[e.id+"@"+L]!=null && C0.qsel[e.id+"@"+L]!=="" ? C0.qsel[e.id+"@"+L] : (C0.qsel[e.id]||"");
    const piu = C0.scen.length>1, anyMan = C0.scen.some(L=>selDi(L)==="man");
    return `<span class="cedit cedit--lotti">${C0.scen.map(L=>`<label class="qsel-l">${piu?`<span class="k3">lotto ${fmt(L,0)}</span>`:""}<select data-cs="qsel|${e.id}@${L}" aria-label="Quotazione usata${piu?" per il lotto "+L:""}">${opz(selDi(L))}</select></label>`).join("")}
    ${anyMan||!e.cands.length?`<label>€/pz <input data-cs="man|${e.id}" value="${e.man!=null?String(e.man).replace(".",","):""}" inputmode="decimal" placeholder="€/pz"></label>`:""}</span>`; }
  if(e.t==="manC") return `<span class="cedit"><label>€/pz <input data-cs="manC|${e.id}" value="${esc(C0.manC[e.id]||"")}" placeholder="${esc(e.ph)}" inputmode="decimal"></label></span>`;
  return "";
}

function tastiCome(e){

<style>
/* ================= v3: richiesta, blocco RFQ, gestione RFQ, documenti ================= */
.btn.xl{min-height:46px;padding:0 20px;font-size:var(--t-md);font-weight:600;border-radius:var(--r2);gap:9px}
.btn.xl svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover{border-color:var(--line2);color:inherit}
.btn.pri[disabled]:hover{color:var(--acc-ink);background:var(--acc)}

/* blocco RFQ: sempre sotto il cartiglio, stessa forma in ogni richiesta */
.rfqblock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp4) var(--sp5);align-items:center;margin-top:var(--sp4);
  padding:var(--sp4) var(--sp5);border-radius:var(--r2);border:1.5px solid var(--acc-line);background:var(--surf);box-shadow:var(--sh1)}
.rfqblock.nuova{border-style:dashed;border-color:var(--line2);background:var(--surf2)}
.rfqblock .ib{width:42px;height:42px;border-radius:var(--r2);display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.rfqblock.nuova .ib{background:var(--sunken);color:var(--ink2)}
.rfqblock h3{font-size:var(--t-lg);display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap}
.rfqblock .num{font-family:var(--fm);font-weight:600;color:var(--acc)}
.rfqblock p{margin:3px 0 0;font-size:var(--t-ms);color:var(--ink2)}
.rfqblock .acts{margin:0;justify-content:flex-end}
.rfqmini{display:grid;gap:var(--sp3)}
.rfqmini .btn{justify-content:center}

/* filtro per prodotto: uno strumento dentro la richiesta */
.pfilter{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap;margin-top:var(--sp4);font-size:var(--t-sm);color:var(--ink3)}
.pfilter .pf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surf);border-radius:999px;
  padding:4px 11px;cursor:pointer;font-size:var(--t-sm);color:var(--ink2)}
.pfilter .pf:hover{border-color:var(--ink3)}
.pfilter .pf[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pfilter .pf .n{font-family:var(--fm);font-size:var(--t-xs);opacity:.8}
.pfilter .pf .mono{font-size:var(--t-sm)}
.catena{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-xs);color:var(--warn);background:var(--warn-soft);
  border:1px solid var(--warn-line);border-radius:999px;padding:2px 9px;align-self:flex-start}
.msg.out .catena{align-self:flex-end}

/* riquadro destro: prodotti della richiesta */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp3);align-items:center;width:100%;text-align:left;
  padding:var(--sp3);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);cursor:pointer;margin-bottom:6px}
.prow:hover{border-color:var(--ink3)}
.prow[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc-line);background:var(--acc-soft)}
.prow .docs{margin-top:5px}

/* gestione RFQ */
.gest{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;background:var(--paper)}
.ghead{display:flex;align-items:flex-end;gap:var(--sp4);flex-wrap:wrap;padding:var(--sp5) var(--sp6) var(--sp4)}
.ghead h2{font-size:var(--t-xl)}
.ghead .sp{flex:1}
.ghead .search{margin:0;min-width:260px}
.ghead select{padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);font-size:var(--t-ms)}
.stati{display:flex;gap:3px;padding:0 var(--sp6);border-bottom:1.5px solid var(--line2);overflow-x:auto}
.stato{display:flex;align-items:center;gap:var(--sp3);padding:10px var(--sp5) 12px;border:1.5px solid transparent;border-bottom:0;
  border-radius:var(--r2) var(--r2) 0 0;background:none;cursor:pointer;margin-bottom:-1.5px;font-family:var(--fd);font-weight:700;
  font-size:var(--t-md);color:var(--ink2);white-space:nowrap}
.stato:hover{background:var(--surf2)}
.stato[aria-selected="true"]{background:var(--surf);border-color:var(--line2);border-bottom:1.5px solid var(--surf);color:var(--ink)}
.stato .cnt{font-family:var(--fm)}
.stato[aria-selected="true"] .cnt{background:var(--acc);color:#fff}
.gbody{overflow:auto;min-height:0;background:var(--surf);padding:var(--sp5) var(--sp6) var(--sp7);display:grid;gap:var(--sp5);align-content:start}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:var(--surf2)}
.senza{border:1.5px dashed var(--line2);border-radius:var(--r2);background:var(--surf2);padding:var(--sp4) var(--sp5);display:grid;gap:var(--sp3)}
.senza .riga{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp4);align-items:center;padding:var(--sp3) 0;border-top:1px solid var(--line)}
.senza .riga:first-of-type{border-top:0}
.cards{display:none;gap:var(--sp3)}
.rcard{border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:var(--sp4);display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}

/* pagina RFQ: documenti */
.rfqgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--sp5);align-items:start}
.rfqgrid>.side{display:grid;gap:var(--sp5);position:sticky;top:0}
.toolbar{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap;padding:var(--sp4);border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf2)}
.toolbar .sum{margin:0}
.toolbar .sp{flex:1}
.ptabs{display:flex;gap:var(--sp2);flex-wrap:wrap}
.ptab{display:flex;align-items:center;gap:var(--sp3);padding:8px 13px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);cursor:pointer;text-align:left}
.ptab[aria-selected="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.ptab .mono{font-weight:600}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp4)}
.slot{display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--sp4);padding:var(--sp4);border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);box-shadow:var(--sh1)}
.slot.vuoto{border-style:dashed;background:var(--surf2);box-shadow:none}
.slot.verifica{border-color:var(--warn-line);background:var(--warn-soft)}
.slot .tt{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap;margin-bottom:4px}
.slot .tt .lab{color:var(--ink2)}
.slot .fname{font-family:var(--fm);font-weight:600;font-size:var(--t-ms);overflow-wrap:anywhere}
.slot .meta{font-size:var(--t-sm);color:var(--ink2);margin-top:3px}
.slot .why{font-size:var(--t-sm);margin-top:4px}
.slot .acts{margin-top:var(--sp3)}
.thumb{width:112px;height:80px;border:1px solid var(--line2);border-radius:var(--r1);background:#fff;overflow:hidden;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.thumb.v{background:var(--sunken);color:var(--ink3)}
.cellslot{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.cellslot .fn{font-size:var(--t-xs);max-width:170px}
.cellslot .btn{padding:2px 7px;font-size:var(--t-xs)}
.esito{display:flex;align-items:flex-start;gap:var(--sp3);padding:10px var(--sp4);border-radius:var(--r2);font-size:var(--t-ms);border:1px solid}
.esito.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.esito.no{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.esito b{font-weight:600}
.nasbox .miss{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:var(--t-sm)}
.nasbox .miss li{display:flex;gap:6px;align-items:baseline}
.tree2{display:grid;gap:5px}
.tree2 .tn{display:flex;align-items:center;gap:var(--sp3);padding:8px var(--sp4);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);flex-wrap:wrap}

/* pannello Ispeziona */
.backdrop{position:fixed;inset:0;background:rgba(23,23,21,.32);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:41;background:var(--surf);border-left:1px solid var(--line2);
  box-shadow:-8px 0 30px rgba(23,23,21,.16);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:flex-start;gap:var(--sp3);padding:var(--sp5);border-bottom:1px solid var(--line)}
.drawer header h3{font-size:var(--t-lg);overflow-wrap:anywhere}
.drawer header .sp{flex:1}
.drawer .dbody{overflow:auto;padding:var(--sp5);display:grid;gap:var(--sp5);align-content:start}
.drawer footer{display:flex;gap:var(--sp2);flex-wrap:wrap;padding:var(--sp4) var(--sp5);border-top:1px solid var(--line);background:var(--surf2)}
.bigthumb{height:220px;border:1px solid var(--line2);border-radius:var(--r2);background:#fff;overflow:hidden}
.bigthumb svg{width:100%;height:100%}
.alt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp3);align-items:center;padding:8px var(--sp3);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}

@media (max-width:1100px){.rfqgrid{grid-template-columns:1fr}.rfqgrid>.side{position:static}}
@media (max-width:820px){
  .rfqblock{grid-template-columns:auto minmax(0,1fr)}
  .rfqblock .acts{grid-column:1/-1;justify-content:stretch}
  .rfqblock .acts .btn{flex:1;justify-content:center}
  .slots{grid-template-columns:1fr}
  .slot{grid-template-columns:84px minmax(0,1fr)}
  .thumb{width:84px;height:62px}
  .ghead,.stati,.gbody{padding-left:var(--sp4);padding-right:var(--sp4)}
  .ghead .search{min-width:0;flex:1 1 100%}
  .wrap-tb.desk{display:none}
  .cards{display:grid}
}
</style>
<input type="file" id="upl" hidden>

.st3 .ib{width:28px;height:28px;border-radius:var(--r2);display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)}

</style>
<style>

.form-nuovo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.tela{border:1px solid var(--line);border-radius:var(--r2);background-color:var(--surf);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;overflow-x:auto;padding:26px 16px 30px}
.dtree,.dtree ul{margin:0;padding:0}

.dtree li::before,.dtree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:28px;border-top:1.5px solid var(--line2)}

.dtree ul ul::before{content:"";position:absolute;top:0;left:50%;height:28px;border-left:1.5px solid var(--line2)}
.dtree li:only-child>.nodo-box::before{content:"";position:absolute;top:-28px;left:50%;height:28px;border-left:1.5px solid var(--line2)}
.dtree>ul>li:only-child>.nodo-box::before{display:none}
.nodo-box{position:relative;display:flex;flex-direction:column;align-items:center}
.qta-arco{font-family:var(--fm);font-size:var(--t-sm);font-weight:600;background:var(--surf);border:1px solid var(--line2);border-radius:999px;padding:0 8px;margin-bottom:5px}
.nodo{width:236px;text-align:left;background:var(--surf);border:1.5px solid var(--line2);border-top-width:5px;border-radius:var(--r2);padding:10px 11px 11px;cursor:grab;box-shadow:var(--sh2);display:grid;gap:7px}

.miniatura .note-mini{position:absolute;left:5px;bottom:5px;font-size:var(--t-xs);font-weight:700;background:#0f5a66;color:#fff;border-radius:4px;padding:0 6px}
.miniatura:hover{border-color:var(--acc)}
.miniatura.vuota{cursor:default;background:var(--sunken);display:grid;place-items:center;align-content:center;gap:4px;color:var(--ink2);font-size:var(--t-sm);text-align:center;padding:8px}
.miniatura.vuota svg{width:38px;height:38px}

.cella.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.cella.sugg{background:var(--prop-soft);color:var(--prop);border-color:var(--prop-line)}

.dett.proposto{background:var(--warn-soft);border-color:var(--warn-line)}

<style>
/* ================= riadattamento automatico allo schermo =================
   <html data-schermo="telefono|tablet|portatile|desktop|ampio|ultra"> lo imposta lo script in base alla finestra.
   Le regole sotto valgono dal portatile in su; telefono e tablet restano sulle regole di prima. */
.rfq.largo{max-width:none}
.gwrap{display:grid;gap:var(--sp5)}
.gwrap .senza{order:-1}
.strgrid{display:grid;gap:var(--sp5)}
.strmain,.strside{display:grid;gap:var(--sp5);align-content:start;min-width:0}
.wfside{grid-column:1/-1;min-width:0}
.maschera{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.chk-m{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:var(--t-sm);cursor:pointer}
.chk-m input{transform:translateY(2px)}
.chk-m.off{opacity:.55;cursor:default}
/* colonne che crescono con lo schermo */
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .panes{grid-template-columns:clamp(220px,13vw,320px) clamp(320px,20vw,480px) minmax(0,1fr) clamp(300px,18vw,460px)}

:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .stream{max-width:none}
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .msg,
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .card,
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .xref{max-width:min(92%,1100px)}
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .form{max-width:min(100%,1500px)}
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .rfqgrid{grid-template-columns:minmax(0,1fr) clamp(300px,22vw,480px)}
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .drawer{width:clamp(460px,30vw,720px)}

/* Struttura: dal portatile in su la scheda del pezzo sta accanto all'albero */
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .strgrid{grid-template-columns:minmax(0,1fr) clamp(380px,30vw,620px);align-items:start}
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .strside{position:sticky;top:0}
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .strside .dettaglio-griglia{grid-template-columns:1fr}
:root:is([data-schermo=portatile],[data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .strside .salva-barra{position:static}
/* elenco RFQ: dal desktop in su le richieste senza RFQ stanno accanto alla tabella */

:root:is([data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .gwrap.con-senza .senza{order:0;position:sticky;top:0}
/* Ciclo: dal desktop in su tre colonne, disegno · fasi · controlli */
:root:is([data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .rfq.ciclo .wfgrid{grid-template-columns:minmax(0,1.25fr) minmax(440px,1fr) clamp(300px,19vw,460px)}
:root:is([data-schermo=desktop],[data-schermo=ampio],[data-schermo=ultra]) .rfq.ciclo .wfside{grid-column:auto;position:sticky;top:0}

</style>

<style>

<style>

<style>

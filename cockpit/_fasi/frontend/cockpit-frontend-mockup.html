<title>Cockpit Inbox Promatec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
/* Promatec lavora lamiera su disegno del cliente: il guscio prende dal disegno tecnico la cornice con i trattini,
   il cartiglio dei dati e il monospaziato dei codici. Quattro riquadri: sezioni · elenco · conversazione · dati. */
:root{
  /* carta e inchiostro */
  --paper:#f1f1ee; --surf:#ffffff; --surf2:#fafaf9; --sunken:#eaeae6; --ink:#171715; --ink2:#5b5b55; --ink3:#8d8d86;
  --line:#e2e2dd; --line2:#c9c9c2; --ink-line:#3a3a36;
  /* acciaio e verde officina */
  --acc:#0f5a66; --acc-ink:#ffffff; --acc-soft:#e4eff0; --acc-line:#9dc2c7;
  --ok:#1c6f44; --ok-soft:#e7f3ec; --ok-line:#a8cfb8;
  --warn:#8a5300; --warn-soft:#fbf2e2; --warn-line:#dec28a;
  --bad:#a93127; --bad-soft:#fbeae7; --bad-line:#e2b1aa;
  --prop:#574099; --prop-soft:#efecf9; --prop-line:#bdb2e0;
  /* settori serviti da Promatec */
  --s-agri:#4a6b2a; --s-off:#8a5300; --s-lift:#2b5d9e; --s-rail:#4f5a63; --s-auto:#574099; --s-constr:#8a4b2a;
  /* misure */
  --t-xs:.6875rem; --t-sm:.78125rem; --t-ms:.84375rem; --t-base:.90625rem; --t-md:1rem; --t-lg:1.1875rem; --t-xl:1.5rem;
  --sp1:4px; --sp2:6px; --sp3:8px; --sp4:12px; --sp5:16px; --sp6:20px; --sp7:28px;
  --r1:3px; --r2:6px; --r3:10px;
  --sh1:0 1px 1px rgba(23,23,21,.04), 0 1px 2px rgba(23,23,21,.06);
  --sh2:0 1px 2px rgba(23,23,21,.05), 0 6px 16px rgba(23,23,21,.07);
  --sh3:0 -4px 24px rgba(23,23,21,.10);
  --fd:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --fb:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --fm:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--t-base)/1.5 var(--fb);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--fd);line-height:1.12;text-wrap:balance;font-weight:700}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
::selection{background:var(--acc-soft)}
svg{display:block;flex:none}
.mono{font-family:var(--fm);font-weight:500;letter-spacing:-.01em}
.k{color:var(--ink2)}
.k3{color:var(--ink3)}
.lab{font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.hr{height:1px;background:var(--line);border:0;margin:0}
/* cornice a trattini, come il bordo di una tavola */
.ticks{height:6px;background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 8px);opacity:.75}
@media (prefers-reduced-motion:no-preference){
  .row,.navb,.btn,.chip,.cardcli,.seg button{transition:background-color .13s ease,border-color .13s ease,color .13s ease}
}

/* ---------------- guscio ---------------- */
.shell{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--sp5);padding:10px var(--sp5);padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surf);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:var(--sp3);min-width:0}
.brand .mark{width:26px;height:26px;border-radius:5px;background:var(--ink);display:grid;place-items:center}
.brand .mark svg{color:#fff}
.brand .nm{font-family:var(--fd);font-weight:700;font-size:1.0625rem;letter-spacing:.02em;line-height:1}
.brand .sub{font-size:var(--t-xs);color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;font-family:var(--fd);font-weight:600}
.tabs{display:flex;gap:2px;margin-left:var(--sp5)}
.tabs button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:7px 12px;border-radius:var(--r2);cursor:pointer;
  font-weight:500;color:var(--ink2)}
.tabs button:hover{background:var(--sunken);color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--ink);color:#fff}
.top .sp{flex:1}
.tag{font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.me{display:flex;align-items:center;gap:var(--sp3);font-size:var(--t-ms);color:var(--ink2)}
/* barra di contesto: filtro attivo e modalità */
.ctxbar{display:flex;align-items:center;gap:var(--sp4);padding:7px var(--sp5);background:var(--surf2);border-bottom:1px solid var(--line);
  font-size:var(--t-ms);color:var(--ink2);flex-wrap:wrap}
.ctxbar .sp{flex:1}
.ctxbar b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;background:var(--surf)}
.seg button{display:flex;align-items:center;gap:6px;border:0;border-left:1px solid var(--line2);background:none;padding:5px 11px;cursor:pointer;
  font-family:var(--fd);font-weight:600;font-size:var(--t-ms);color:var(--ink2);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--surf2)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.body{min-height:0;display:grid}
.panes{display:grid;grid-template-columns:238px 350px minmax(0,1fr) 312px;min-height:0}
.pane{min-width:0;min-height:0;overflow:auto;border-right:1px solid var(--line);background:var(--surf)}
.pane:last-child{border-right:0}
.p-rail{background:var(--surf2)}
.p-conv{background:var(--paper)}
.p-ctx{background:var(--surf2)}

/* ---------------- rail ---------------- */
.search{position:relative;margin:var(--sp4)}
.search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);font-size:var(--t-ms)}
.search input::placeholder{color:var(--ink3)}
.search .ic{position:absolute;left:9px;top:8px;color:var(--ink3)}
.railg{padding:var(--sp4) var(--sp4) var(--sp2)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 var(--sp3)}
.navb{display:flex;align-items:center;gap:var(--sp3);width:100%;text-align:left;background:none;border:0;border-radius:var(--r2);
  padding:7px var(--sp3);cursor:pointer;color:var(--ink);font-size:var(--t-ms)}
.navb:hover{background:var(--sunken)}
.navb[aria-current="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600;box-shadow:inset 0 0 0 1px var(--acc-line)}
.navb .ic{color:var(--ink3)}
.navb[aria-current="true"] .ic{color:var(--acc)}
.navb .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-family:var(--fm);font-size:var(--t-xs);background:var(--sunken);color:var(--ink2);border-radius:999px;padding:1px 7px}
.navb[aria-current="true"] .cnt{background:var(--surf);color:var(--acc)}
.mono-av,.av{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;font-family:var(--fd);font-size:var(--t-xs);
  font-weight:700;letter-spacing:.02em;color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.av.lg{width:30px;height:30px;font-size:var(--t-sm);border-radius:var(--r2)}
.sett{display:inline-block;width:6px;height:6px;border-radius:2px;flex:none}

/* ---------------- elenco ---------------- */
.lhead{position:sticky;top:0;z-index:4;background:var(--surf);border-bottom:1px solid var(--line2);padding:var(--sp4) var(--sp5) var(--sp3)}
.lhead h2{font-size:var(--t-lg)}
.lhead .meta{display:flex;align-items:center;gap:var(--sp2);margin-top:3px;font-size:var(--t-sm);color:var(--ink3);flex-wrap:wrap}
.sub{display:flex;align-items:center;gap:var(--sp3);padding:9px var(--sp5) 7px;background:var(--surf2);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.sub .n{font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp4);width:100%;text-align:left;background:var(--surf);
  border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;padding:11px var(--sp5);cursor:pointer;color:var(--ink)}
.row:hover{background:var(--surf2)}
.row[aria-current="true"]{background:var(--acc-soft);border-left-color:var(--acc)}
.row.unread{border-left-color:var(--ink)}
.row.unread .nm{font-weight:600}
.r1{display:flex;align-items:baseline;gap:var(--sp3)}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tm{margin-left:auto;font-family:var(--fm);font-size:var(--t-xs);color:var(--ink3);white-space:nowrap}
.snip{font-size:var(--t-sm);color:var(--ink2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rchips{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:7px}

/* ---------------- pastiglie ---------------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:500;border-radius:var(--r1);padding:2px 7px;
  border:1px solid transparent;white-space:nowrap;line-height:1.35}
.chip svg{width:12px;height:12px}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.chip.prop{background:var(--prop-soft);color:var(--prop);border-color:var(--prop-line)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.chip.neu{background:var(--sunken);color:var(--ink2);border-color:var(--line2)}
.chip.ghost{background:transparent;color:var(--ink3);border-color:var(--line2)}
.chip.lg{font-size:var(--t-sm);padding:3px 9px}
.tipo{display:inline-block;font-family:var(--fd);font-weight:700;font-size:var(--t-xs);letter-spacing:.07em;text-transform:uppercase;
  padding:1px 6px;border-radius:var(--r1);background:var(--sunken);color:var(--ink2)}
.tipo.finito{background:var(--acc-soft);color:var(--acc)}
.tipo.sottoass{background:#e9eff8;color:var(--s-lift)}
.tipo.sciolto{background:var(--prop-soft);color:var(--prop)}
.tipo.comm{background:var(--warn-soft);color:var(--warn)}

/* ---------------- conversazione ---------------- */
.chead{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);padding:var(--sp5) var(--sp5) var(--sp4)}
.bc{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink3);margin-bottom:var(--sp4)}
.bc b{color:var(--ink2);font-weight:500}
.bc svg{width:13px;height:13px;color:var(--line2)}
/* cartiglio */
.cart{border:1.5px solid var(--ink-line);border-radius:var(--r1);background:var(--surf);overflow:hidden;box-shadow:var(--sh1)}
.cart .grid{display:grid;grid-template-columns:2.2fr repeat(4,1fr)}
.cart .cell{padding:9px var(--sp4);border-left:1px solid var(--line2);min-width:0}
.cart .cell:first-child{border-left:0;background:var(--surf2);display:flex;flex-direction:column;gap:2px;justify-content:center}
.cart .cell.r2{border-top:1px solid var(--line2)}
.cart .span4{grid-column:span 4}
.cart h1{font-family:var(--fm);font-weight:600;font-size:1.3125rem;letter-spacing:-.02em;color:var(--acc)}
.cart .nome{font-size:var(--t-ms);color:var(--ink2)}
.cart .v{font-weight:500;font-size:var(--t-base);overflow-wrap:anywhere}
.cart .v.mono{font-size:var(--t-sm)}
.stream{padding:var(--sp5) var(--sp5) var(--sp7);display:flex;flex-direction:column;gap:var(--sp5);max-width:900px}
.day{display:flex;align-items:center;gap:var(--sp4);font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3)}
.day::before,.day::after{content:"";height:5px;flex:1;background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 7px)}
.msg{display:flex;flex-direction:column;gap:5px;max-width:92%}
.msg.out{align-self:flex-end;align-items:flex-end}
.who{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink3)}
.who b{color:var(--ink);font-weight:600}
.who .rl{font-size:var(--t-xs)}
.bub{background:var(--surf);border:1px solid var(--line);border-radius:var(--r3);border-top-left-radius:var(--r1);padding:12px 14px;box-shadow:var(--sh1)}
.msg.out .bub{background:var(--acc-soft);border-color:var(--acc-line);border-top-left-radius:var(--r3);border-top-right-radius:var(--r1)}
.bub p{margin:0 0 7px}.bub p:last-child{margin-bottom:0}
.quote{border-left:2px solid var(--line2);padding:1px 0 1px 10px;margin:var(--sp3) 0;color:var(--ink3);font-size:var(--t-ms)}
mark.hl{background:linear-gradient(0deg,var(--warn-soft),var(--warn-soft));box-shadow:inset 0 -1.5px 0 var(--warn-line);
  border-radius:2px;padding:0 3px;color:inherit;font-weight:500}
.files{display:grid;gap:var(--sp2);margin-top:var(--sp4)}
.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp3);align-items:center;background:var(--surf2);
  border:1px solid var(--line);border-radius:var(--r2);padding:7px 9px}
.msg.out .file{background:rgba(255,255,255,.72);border-color:var(--acc-line)}
.ext{width:34px;height:26px;border-radius:var(--r1);display:grid;place-items:center;font-family:var(--fd);font-size:var(--t-xs);
  font-weight:700;letter-spacing:.04em;background:var(--sunken);color:var(--ink2);border:1px solid var(--line2)}
.ext.pdf{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.ext.step,.ext.stp,.ext.dxf{background:#e9eff8;color:var(--s-lift);border-color:#b9cbe4}
.ext.zip{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.ext.xlsx{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.ext.msg{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.fn{font-family:var(--fm);font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{font-size:var(--t-xs);color:var(--ink3)}
.mline{display:flex;align-items:flex-start;gap:var(--sp2);font-size:var(--t-sm);color:var(--ink2);padding-left:2px}
.mline svg{width:14px;height:14px;color:var(--acc);margin-top:2px}
.msg.out .mline{flex-direction:row-reverse}
/* riquadri di collegamento */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp3);margin-top:var(--sp3);padding:9px var(--sp4);border-radius:var(--r2);
  font-size:var(--t-ms);border:1px solid var(--line2);background:var(--surf2)}
.strip svg{width:15px;height:15px}
.strip.congiunta{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.strip.terzisti{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.strip b{font-weight:600}
.xref{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp4);align-items:center;max-width:92%;background:var(--surf);
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r2);padding:10px var(--sp4);box-shadow:var(--sh1)}
.xref .ib{width:28px;height:28px;border-radius:var(--r2);background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.xref b{display:block;font-family:var(--fd);font-size:var(--t-md)}
.xref .m{font-size:var(--t-sm);color:var(--ink3)}
/* carta neutra per il triage */
.card{border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf2);padding:var(--sp4);max-width:92%;box-shadow:var(--sh1)}
.card>.lab{display:flex;align-items:center;gap:6px;margin-bottom:var(--sp3)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp4);align-items:start;padding:9px 0;border-top:1px dashed var(--line2)}
.cand:first-of-type{border-top:0;padding-top:0}
.src{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:5px}
.why{font-size:var(--t-ms);color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:var(--sp2);margin-top:var(--sp4)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r2);border:1px solid var(--line2);
  background:var(--surf);font-weight:500;cursor:pointer;white-space:nowrap;font-size:var(--t-ms);box-shadow:var(--sh1)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.pri:hover{background:#0c4b55;color:#fff}
.btn.sm{padding:3px 9px;font-size:var(--t-sm);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.empty{max-width:420px;margin:var(--sp7) auto;text-align:center;color:var(--ink2);padding:0 var(--sp5)}
.empty .ib{width:44px;height:44px;border-radius:var(--r3);background:var(--sunken);color:var(--ink3);display:grid;place-items:center;margin:0 auto var(--sp4)}
.empty h3{font-size:var(--t-md);margin-bottom:var(--sp2);color:var(--ink)}
.empty p{margin:0;font-size:var(--t-ms)}

/* ---------------- dati a destra ---------------- */
.sec{padding:var(--sp5);border-bottom:1px solid var(--line)}
.sec h3{display:flex;align-items:center;gap:6px;margin-bottom:var(--sp4)}
.dati{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px var(--sp4);margin:0;font-size:var(--t-ms)}
.dati dt{color:var(--ink3)}
.dati dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sum{display:flex;flex-wrap:wrap;gap:var(--sp1) var(--sp4);font-size:var(--t-sm);color:var(--ink2);margin-bottom:var(--sp4)}
.sum b{font-family:var(--fm);color:var(--ink)}
.comp{padding:var(--sp3) 0;border-top:1px solid var(--line)}
.comp:first-of-type{border-top:0;padding-top:0}
.comp .ct{display:flex;align-items:baseline;gap:var(--sp2);margin-bottom:var(--sp2)}
.comp .cc{font-family:var(--fm);font-size:var(--t-ms);font-weight:500}
.docs{display:flex;flex-wrap:wrap;gap:var(--sp1)}
.doc{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);border-radius:var(--r1);padding:2px 6px;border:1px solid}
.doc b{font-family:var(--fd);font-weight:700;letter-spacing:.06em}
.doc.has{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.doc.prop{background:var(--prop-soft);color:var(--prop);border-color:var(--prop-line)}
.doc.port{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.doc.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.doc.nr{background:transparent;color:var(--ink3);border-color:var(--line)}
.leg{display:flex;flex-wrap:wrap;gap:4px var(--sp4);font-size:var(--t-xs);color:var(--ink3);margin-top:var(--sp3)}
.go{display:flex;align-items:center;gap:var(--sp3);margin-top:var(--sp4);padding:9px var(--sp4);border-radius:var(--r2);
  background:var(--surf);border:1px solid var(--line2);font-size:var(--t-sm);color:var(--ink2)}
.go span{flex:1;min-width:0}
.itm{display:flex;align-items:flex-start;gap:var(--sp3);padding:var(--sp3) 0;border-top:1px solid var(--line);font-size:var(--t-ms)}
.itm:first-of-type{border-top:0}
.itm .g{flex:1;min-width:0}
.pers{display:flex;align-items:center;gap:var(--sp3);padding:5px 0}
</style>
<style>
/* ---------------- impostazioni ---------------- */
.set{display:grid;grid-template-columns:238px 358px minmax(0,1fr);min-height:0}
.form{padding:var(--sp6) var(--sp6) var(--sp7);max-width:860px;display:grid;gap:var(--sp6)}
.fs{border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:var(--sp5);display:grid;gap:var(--sp4);box-shadow:var(--sh1)}
.fs>header{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap}
.fs>header h3{font-size:var(--t-md)}
.fs>header .sp{flex:1}
.fs .hint{font-size:var(--t-sm);color:var(--ink3);max-width:70ch}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--sp4)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp4)}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:var(--t-sm);color:var(--ink2);font-weight:500}
.fld input,.fld select,.fld textarea{padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);width:100%}
.fld input:hover,.fld select:hover{border-color:var(--ink3)}
.fld small{font-size:var(--t-xs);color:var(--ink3)}
.fld.mono input{font-family:var(--fm);font-size:var(--t-sm)}
/* mittenti autorizzati */
.send{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:var(--sp4);align-items:center;padding:10px var(--sp4);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.send.off{opacity:.62}
.send .em{font-family:var(--fm);font-size:var(--t-sm)}
.send .nmr{font-weight:500}
.send .rl{font-size:var(--t-xs);color:var(--ink3)}
.addsend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) auto;gap:var(--sp3);align-items:end;
  padding:var(--sp4);border:1px dashed var(--line2);border-radius:var(--r2);background:var(--surf2)}
/* interruttore */
.sw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp4);align-items:start;padding:11px var(--sp4);border:1px solid var(--line);
  border-radius:var(--r2);background:var(--surf);cursor:pointer;text-align:left;width:100%}
.sw:hover{border-color:var(--ink3)}
.sw .tr{width:38px;height:22px;border-radius:999px;background:var(--sunken);border:1px solid var(--line2);position:relative;flex:none;margin-top:1px}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surf);
  box-shadow:var(--sh1);transition:left .15s ease}
.sw[aria-pressed="true"] .tr{background:var(--acc);border-color:var(--acc)}
.sw[aria-pressed="true"] .tr::after{left:18px}
.sw .t{font-weight:500}
.sw .d{font-size:var(--t-sm);color:var(--ink3);margin-top:2px}
.radios{display:grid;gap:var(--sp3)}
.radio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp4);align-items:start;padding:11px var(--sp4);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);cursor:pointer;text-align:left;width:100%}
.radio:hover{border-color:var(--ink3)}
.radio[aria-checked="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.radio .dot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surf);flex:none;margin-top:1px;display:grid;place-items:center}
.radio[aria-checked="true"] .dot{border-color:var(--acc)}
.radio[aria-checked="true"] .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
.radio .t{font-weight:500}
.radio .d{font-size:var(--t-sm);color:var(--ink2);margin-top:2px}
.radio .ex{margin-top:var(--sp3);padding:var(--sp3);border-radius:var(--r1);background:var(--surf2);border:1px solid var(--line);
  font-size:var(--t-xs);color:var(--ink2);font-family:var(--fm);line-height:1.6}
table.tb{width:100%;border-collapse:collapse}
table.tb th{font-family:var(--fd);font-size:var(--t-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:7px var(--sp4);background:var(--surf2);border-bottom:1px solid var(--line2);white-space:nowrap}
table.tb td{padding:9px var(--sp4);border-bottom:1px solid var(--line);vertical-align:middle;font-size:var(--t-ms)}
table.tb tr:last-child td{border-bottom:0}
.wrap-tb{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surf)}


@media (max-width:1320px){.panes{grid-template-columns:224px 330px minmax(0,1fr)}.p-ctx{display:none}
  .set{grid-template-columns:224px 320px minmax(0,1fr)}}
@media (max-width:1040px){.panes{grid-template-columns:320px minmax(0,1fr)}.p-rail{display:none}
  .set{grid-template-columns:300px minmax(0,1fr)}.set .p-rail{display:none}}
@media (max-width:820px){
  html,body{height:auto}.shell{height:auto}
  .panes,.set{grid-template-columns:1fr}
  .pane{overflow:visible;border-right:0;border-bottom:1px solid var(--line2)}
  .p-rail,.p-ctx{display:block}
  .stream{max-width:none}.msg,.card,.xref{max-width:100%}
  .cart .grid{grid-template-columns:1fr 1fr}
  .cart .cell:first-child{grid-column:1/-1}
  .cart .cell{border-left:0;border-top:1px solid var(--line2)}
  .cart .span4{grid-column:1/-1}
  .tabs{margin-left:0}.top{flex-wrap:wrap;gap:var(--sp3)}
  .form,.kit{padding:var(--sp5) var(--sp4) var(--sp7)}
  .send{grid-template-columns:auto minmax(0,1fr);row-gap:var(--sp2)}
}
</style>

<style>
/* ---------------- pagina RFQ: i quattro passi ---------------- */
.steps{display:flex;gap:3px;padding:0 var(--sp6);background:var(--paper);border-bottom:1.5px solid var(--line2);overflow-x:auto}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:9px var(--sp5) 11px;border:1.5px solid transparent;
  border-bottom:0;border-radius:var(--r2) var(--r2) 0 0;background:none;cursor:pointer;margin-bottom:-1.5px;min-width:178px;text-align:left}
.step:hover{background:var(--surf2)}
.step[aria-selected="true"]{background:var(--surf);border-color:var(--line2);border-bottom:1.5px solid var(--surf)}
.step .n{grid-row:span 2;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;
  font-size:var(--t-ms);border:1.5px solid var(--line2);color:var(--ink2);background:var(--surf)}
.step[aria-selected="true"] .n{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.step .t{font-family:var(--fd);font-weight:700;font-size:var(--t-md);line-height:1.1}
.step .s{font-size:var(--t-xs);color:var(--ink3)}
.step .s.ok{color:var(--ok)}.step .s.warn{color:var(--warn)}.step .s.bad{color:var(--bad)}
.rfqbody{overflow:auto;min-height:0;background:var(--surf)}
.rfq{padding:var(--sp6);display:grid;gap:var(--sp5);max-width:1060px}
.rfqhead{padding:var(--sp5) var(--sp6) var(--sp4);background:var(--paper)}
.tree{display:grid;gap:6px}
.tnode{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp4);align-items:start;padding:10px var(--sp4);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--surf)}
.tnode.prop{border-style:dashed;background:var(--surf2)}
.tnode .top{display:flex;align-items:baseline;gap:var(--sp2);flex-wrap:wrap}
.tnode .cod{font-family:var(--fm);font-weight:600;font-size:var(--t-base)}
.tnode .nome{color:var(--ink2);font-size:var(--t-ms)}
.qta{font-family:var(--fm);font-size:var(--t-sm);border:1px solid var(--line2);border-radius:999px;padding:0 7px;color:var(--ink2);background:var(--surf)}
.ind{display:inline-flex;align-items:center;gap:4px;color:var(--line2);margin-right:2px}
.fonti{display:grid;gap:3px;margin:7px 0 0;padding:0;list-style:none;font-size:var(--t-sm);color:var(--ink2)}
.fonti li{display:flex;gap:7px;align-items:baseline}
.navsteps{display:flex;gap:var(--sp4);align-items:center;padding:10px var(--sp6);border-top:1px solid var(--line2);background:var(--surf)}
.navsteps .dove{flex:1;text-align:center;color:var(--ink3);font-size:var(--t-sm)}
.strip.okk{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.chk{display:flex;align-items:flex-start;gap:var(--sp3);padding:5px 0;font-size:var(--t-ms)}
.chk .b{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex:none;margin-top:1px}
.chk .b.ok{background:var(--ok);color:#fff}.chk .b.wait{border:1.5px solid var(--line2);color:var(--ink3)}
.chk .b.warn{background:var(--warn);color:#fff}
.pick{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:var(--sp3);align-items:center;padding:8px var(--sp4);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}
.pick input{width:17px;height:17px;accent-color:var(--acc)}
.codechip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc-line);background:var(--acc-soft);color:var(--acc);
  border-radius:var(--r1);padding:3px 8px;font-family:var(--fm);font-size:var(--t-sm);font-weight:500}
.codechip input{width:15px;height:15px;accent-color:var(--acc)}
</style>

<style>
/* ================= v3: richiesta, blocco RFQ, gestione RFQ, documenti ================= */
.btn.xl{min-height:46px;padding:0 20px;font-size:var(--t-md);font-weight:600;border-radius:var(--r2);gap:9px}
.btn.xl svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover{border-color:var(--line2);color:inherit}
.btn.pri[disabled]:hover{color:var(--acc-ink);background:var(--acc)}

/* blocco RFQ: sempre sotto il cartiglio, stessa forma in ogni richiesta */
.rfqblock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp4) var(--sp5);align-items:center;margin-top:var(--sp4);
  padding:var(--sp4) var(--sp5);border-radius:var(--r2);border:1.5px solid var(--acc-line);background:var(--surf);box-shadow:var(--sh1)}
.rfqblock.nuova{border-style:dashed;border-color:var(--line2);background:var(--surf2)}
.rfqblock .ib{width:42px;height:42px;border-radius:var(--r2);display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.rfqblock.nuova .ib{background:var(--sunken);color:var(--ink2)}
.rfqblock h3{font-size:var(--t-lg);display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap}
.rfqblock .num{font-family:var(--fm);font-weight:600;color:var(--acc)}
.rfqblock p{margin:3px 0 0;font-size:var(--t-ms);color:var(--ink2)}
.rfqblock .acts{margin:0;justify-content:flex-end}
.rfqmini{display:grid;gap:var(--sp3)}
.rfqmini .btn{justify-content:center}

/* filtro per prodotto: uno strumento dentro la richiesta */
.pfilter{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap;margin-top:var(--sp4);font-size:var(--t-sm);color:var(--ink3)}
.pfilter .pf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surf);border-radius:999px;
  padding:4px 11px;cursor:pointer;font-size:var(--t-sm);color:var(--ink2)}
.pfilter .pf:hover{border-color:var(--ink3)}
.pfilter .pf[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pfilter .pf .n{font-family:var(--fm);font-size:var(--t-xs);opacity:.8}
.pfilter .pf .mono{font-size:var(--t-sm)}
.catena{display:flex;align-items:center;gap:var(--sp2);font-size:var(--t-xs);color:var(--warn);background:var(--warn-soft);
  border:1px solid var(--warn-line);border-radius:999px;padding:2px 9px;align-self:flex-start}
.msg.out .catena{align-self:flex-end}

/* riquadro destro: prodotti della richiesta */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp3);align-items:center;width:100%;text-align:left;
  padding:var(--sp3);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);cursor:pointer;margin-bottom:6px}
.prow:hover{border-color:var(--ink3)}
.prow[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc-line);background:var(--acc-soft)}
.prow .docs{margin-top:5px}

/* gestione RFQ */
.gest{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;background:var(--paper)}
.ghead{display:flex;align-items:flex-end;gap:var(--sp4);flex-wrap:wrap;padding:var(--sp5) var(--sp6) var(--sp4)}
.ghead h2{font-size:var(--t-xl)}
.ghead .sp{flex:1}
.ghead .search{margin:0;min-width:260px}
.ghead select{padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);font-size:var(--t-ms)}
.stati{display:flex;gap:3px;padding:0 var(--sp6);border-bottom:1.5px solid var(--line2);overflow-x:auto}
.stato{display:flex;align-items:center;gap:var(--sp3);padding:10px var(--sp5) 12px;border:1.5px solid transparent;border-bottom:0;
  border-radius:var(--r2) var(--r2) 0 0;background:none;cursor:pointer;margin-bottom:-1.5px;font-family:var(--fd);font-weight:700;
  font-size:var(--t-md);color:var(--ink2);white-space:nowrap}
.stato:hover{background:var(--surf2)}
.stato[aria-selected="true"]{background:var(--surf);border-color:var(--line2);border-bottom:1.5px solid var(--surf);color:var(--ink)}
.stato .cnt{font-family:var(--fm)}
.stato[aria-selected="true"] .cnt{background:var(--acc);color:#fff}
.gbody{overflow:auto;min-height:0;background:var(--surf);padding:var(--sp5) var(--sp6) var(--sp7);display:grid;gap:var(--sp5);align-content:start}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:var(--surf2)}
.senza{border:1.5px dashed var(--line2);border-radius:var(--r2);background:var(--surf2);padding:var(--sp4) var(--sp5);display:grid;gap:var(--sp3)}
.senza .riga{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp4);align-items:center;padding:var(--sp3) 0;border-top:1px solid var(--line)}
.senza .riga:first-of-type{border-top:0}
.cards{display:none;gap:var(--sp3)}
.rcard{border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:var(--sp4);display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}

/* pagina RFQ: documenti */
.rfqgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--sp5);align-items:start}
.rfqgrid>.side{display:grid;gap:var(--sp5);position:sticky;top:0}
.toolbar{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap;padding:var(--sp4);border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf2)}
.toolbar .sum{margin:0}
.toolbar .sp{flex:1}
.ptabs{display:flex;gap:var(--sp2);flex-wrap:wrap}
.ptab{display:flex;align-items:center;gap:var(--sp3);padding:8px 13px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);cursor:pointer;text-align:left}
.ptab[aria-selected="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.ptab .mono{font-weight:600}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp4)}
.slot{display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--sp4);padding:var(--sp4);border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf);box-shadow:var(--sh1)}
.slot.vuoto{border-style:dashed;background:var(--surf2);box-shadow:none}
.slot.verifica{border-color:var(--warn-line);background:var(--warn-soft)}
.slot .tt{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap;margin-bottom:4px}
.slot .tt .lab{color:var(--ink2)}
.slot .fname{font-family:var(--fm);font-weight:600;font-size:var(--t-ms);overflow-wrap:anywhere}
.slot .meta{font-size:var(--t-sm);color:var(--ink2);margin-top:3px}
.slot .why{font-size:var(--t-sm);margin-top:4px}
.slot .acts{margin-top:var(--sp3)}
.thumb{width:112px;height:80px;border:1px solid var(--line2);border-radius:var(--r1);background:#fff;overflow:hidden;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.thumb.v{background:var(--sunken);color:var(--ink3)}
.cellslot{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.cellslot .fn{font-size:var(--t-xs);max-width:170px}
.cellslot .btn{padding:2px 7px;font-size:var(--t-xs)}
.esito{display:flex;align-items:flex-start;gap:var(--sp3);padding:10px var(--sp4);border-radius:var(--r2);font-size:var(--t-ms);border:1px solid}
.esito.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.esito.no{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.esito b{font-weight:600}
.nasbox .miss{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:var(--t-sm)}
.nasbox .miss li{display:flex;gap:6px;align-items:baseline}
.tree2{display:grid;gap:5px}
.tree2 .tn{display:flex;align-items:center;gap:var(--sp3);padding:8px var(--sp4);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);flex-wrap:wrap}

/* pannello Ispeziona */
.backdrop{position:fixed;inset:0;background:rgba(23,23,21,.32);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:41;background:var(--surf);border-left:1px solid var(--line2);

  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:flex-start;gap:var(--sp3);padding:var(--sp5);border-bottom:1px solid var(--line)}
.drawer header h3{font-size:var(--t-lg);overflow-wrap:anywhere}
.drawer header .sp{flex:1}
.drawer .dbody{overflow:auto;padding:var(--sp5);display:grid;gap:var(--sp5);align-content:start}
.drawer footer{display:flex;gap:var(--sp2);flex-wrap:wrap;padding:var(--sp4) var(--sp5);border-top:1px solid var(--line);background:var(--surf2)}
.bigthumb{height:220px;border:1px solid var(--line2);border-radius:var(--r2);background:#fff;overflow:hidden}
.bigthumb svg{width:100%;height:100%}
.alt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp3);align-items:center;padding:8px var(--sp3);border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2)}

@media (max-width:1100px){.rfqgrid{grid-template-columns:1fr}.rfqgrid>.side{position:static}}
@media (max-width:820px){
  .rfqblock{grid-template-columns:auto minmax(0,1fr)}
  .rfqblock .acts{grid-column:1/-1;justify-content:stretch}

  .ghead,.stati,.gbody{padding-left:var(--sp4);padding-right:var(--sp4)}
  .ghead .search{min-width:0;flex:1 1 100%}
  .wrap-tb.desk{display:none}
  .cards{display:grid}
}
</style>
<input type="file" id="upl" hidden>
<style>.cart .span2{grid-column:span 2}.cart .span3{grid-column:span 3}</style>
<style>
.stati3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp3)}
.st3{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp3);align-items:start;padding:10px var(--sp4);border:1px solid var(--line2);border-radius:var(--r2);background:var(--surf)}

/* ================= documenti: regole e conteggi (contratto A1c: §1.0, §1.6; E1R R103 C, K-01 A; T-E1-18) =================
   I sette assi per prodotto stanno in 40_rfq.js (assiProdotto). Qui il fabbisogno dei documenti:
   - il finito chiede lo STEP strutturale (asse della fonte) e il 2D;
   - ogni componente del perimetro chiede il 2D, commerciali compresi (R103 C: «la sola classificazione
     commerciale non costituisce un'esenzione»);
   - l'unica esenzione è la MINUTERIA CONFERMATA (T-E1-18): una minuteria solo proposta non toglie niente.
   La categoria (fabbricato · commerciale · minuteria) è una dimensione distinta dal tipo (E1 §6, Classificazione).
   3D e DXF dei pezzi sono informativi: si mostrano, non bloccano. */
const OBBL = {sottoass:{d3:false,d2:true,dxf:false}, sciolto:{d3:false,d2:true,dxf:false}, comm:{d3:false,d2:true,dxf:false}};
const minuteriaConfermata = p=>!!p&&p.cat==="minuteria"&&!!p.catConf;
const richiesto = (tipo,col,p)=>!!(OBBL[tipo]||{})[col]&&!(col==="d2"&&minuteriaConfermata(p));
const COL = {d3:"3D",d2:"2D",dxf:"DXF"};
const previsto = (tipo,c)=>!(tipo==="comm"&&c==="dxf");
const nomeTipo = t=>({finito:"prodotto",sottoass:"assieme",sciolto:"particolare",comm:"commerciale"}[t]||t);
function getSlot(pid,k){const D=DOCS[pid]; if(k==="step"||k==="pdf")return D[k]; const[,i,c]=k.split(":"); return D.parti[+i][c];}
function setSlot(pid,k,v){const D=DOCS[pid]; if(k==="step"||k==="pdf"){D[k]=v;return;} const[,i,c]=k.split(":"); D.parti[+i][c]=v;}
function obblig(pid,k){if(k==="step"||k==="pdf")return true; const[,i,c]=k.split(":"); const p=DOCS[pid].parti[+i]; return richiesto(p.tipo,c,p);}
function etichetta(pid,k){
  if(k==="step") return "STEP strutturale"; if(k==="pdf") return "PDF del prodotto";
  const[,i,c]=k.split(":"); const p=DOCS[pid].parti[+i]; return `${COL[c]} di ${p.cod}`;
}
function chiavi(pid){const D=DOCS[pid]; const ks=["step","pdf"];
  D.parti.forEach((p,i)=>["d3","d2","dxf"].forEach(c=>{if(previsto(p.tipo,c))ks.push(`p:${i}:${c}`);})); return ks;}
function stat(pids){
  const r={o:0,pres:0,conf:0,daconf:0,ver:0,manca:0,port:0,mancanti:[],pdfO:0,pdfConf:0,fonteOk:0,fonteTot:0};
  for(const pid of [].concat(pids)){ const st=DOCS[pid].step; r.fonteTot++; if(st&&!st.portale&&st.stato==="ok") r.fonteOk++; }
  for(const pid of [].concat(pids)) for(const k of chiavi(pid)){
    if((k==="pdf"||k.endsWith(":d2"))&&obblig(pid,k)){ r.pdfO++; const s0=getSlot(pid,k); if(s0&&!s0.portale&&s0.stato==="ok") r.pdfConf++; }
    const s=getSlot(pid,k), ob=obblig(pid,k);
    if(ob) r.o++;
    if(!s){ if(ob){r.manca++; r.mancanti.push([pid,k,"manca"]);} continue; }
    if(s.portale){ r.port++; if(ob) r.mancanti.push([pid,k,"sul portale"]); continue; }
    r.pres++;
    if(s.stato==="ok"){ if(ob) r.conf++; }
    else { r.daconf++; if(s.stato==="verifica") r.ver++; if(ob) r.mancanti.push([pid,k,s.stato==="verifica"?"da verificare":"da confermare"]); }
  }
  r.pronto = r.mancanti.length===0;
  return r;
}
const SK = {mail:["has","Mail"],"mail?":["prop","Mail ✓?"],"mail!":["warn","Mail ⚠"],port:["has","Portale"],"port?":["prop","Portale ✓?"],

function skey(s,ob){if(!s)return ob?"no":"fac"; if(s.portale)return "portale"; return s.prov+(s.stato==="ok"?"":s.stato==="verifica"?"!":"?");}

function filtroRFQ(q){
  const d=datiRFQ(q), c=cl(d.cli);
  if(S.fcli&&d.cli!==S.fcli) return false;

  const hay=[q.num,c.nome,d.titolo,d.buyer,...d.prodotti.map(p=>PROD[p].cod+" "+PROD[p].nome)].join(" ").toLowerCase();
  return hay.includes(S.q.toLowerCase());
}

/* ================= creazione e apertura dell'RFQ ================= */
function creaRFQ(rid){
  const r=rq(rid);
  if(r.rfq){ apriRFQ(r.rfq); return; }                       /* esiste già: si riapre, niente doppioni */
  const c=cl(r.cli), [g,mm,aa]=r.aperta.split("/"), cogn=r.buyer.split(" ").pop();
  const num=r.numCli||("P-2026-0"+(++contatoreRFQ));
  const q={id:"q-"+rid,num,numProvvisorio:!r.numCli,req:rid,faseBase:"RICEVUTA",passo:0,resp:"Franco",agg:"adesso",
    nas:`${c.nas}\\WIP\\${aa} ${mm} ${g} ${cogn} ${r.titolo.replace(/[\\/:*?"<>|]/g," ").replace(/\s+/g," ").trim()}`};
  RFQ.push(preparaRFQ(q)); r.rfq=q.id;
  apriRFQ(q.id); S.creato=q.id;
}
function apriRFQ(id){ S.tab="rfq"; S.rfq=id; S.step=0; S.dview="struttura"; S.rp=datiRFQ(rf(id)).prodotti[0]; S.insp=null; S.esito=null; S.creato=null; }

/* ---- i sette assi del prodotto e lo stato del fascicolo (contratto A1c §1.0, R79, R88, R89) ----
   Il frontend MOSTRA gli assi che il backend calcola (ProdottoValutato, StatoFascicolo): qui il mockup li simula
   con i suoi dati. Il composto non sostituisce mai gli assi, e «pronto» non vuol dire «partito» (FaseThread). */
const ASSE_ETI={confermata:["ok","confermata"],in_attesa_di_conferma:["prop","da confermare"],assente:["bad","assente"],
  verificata:["ok","verificata"],da_verificare:["prop","da verificare"],non_verificabile:["neu","non verificabile"],conflitto:["bad","conflitto"],
  verificato:["ok","verificato"],completa:["ok","completa"],incompleta:["bad","incompleta"],non_calcolabile:["neu","non calcolabile"],
  pronto_fattibilita:["ok","pronto per la fattibilità"],non_pronto:["warn","non pronto"],da_riesaminare:["warn","da riesaminare"]};
function assiProdotto(q,pid){
  const D=DOCS[pid], st=D.step, B=bomDi(pid), chiusa=!!q.bomOk;
  const fonte=st&&!st.portale?(st.stato==="ok"?"confermata":"in_attesa_di_conferma"):"assente";
  const senzaFigli=B.nodes.length===1, ver=bomVerificata(pid);
  const nom=ver?"verificata":senzaFigli&&!chiusa?"non_verificabile":"da_verificare";
  const ger=nom==="non_verificabile"?"non_verificabile":ver&&fonte==="confermata"?"verificata":"da_verificare";
  const s1=stat(pid), libere=(D.liberi||[]).length;
  const smist=s1.daconf||libere?"da_verificare":"verificato";
  const mancaCerto=s1.mancanti.some(x=>x[2]==="manca"||x[2]==="sul portale"), perimetro=fonte==="confermata"&&ver;
  const doc=mancaCerto?"incompleta":perimetro&&s1.pronto?"completa":"non_calcolabile";
  const tutti=fonte==="confermata"&&nom==="verificata"&&ger==="verificata"&&smist==="verificato"&&doc==="completa";
  return [["target","Prodotto della RFQ","confermata","codice confermato alla creazione dell’RFQ"],
    ["fonte","Fonte strutturale (STEP)",fonte,fonte==="assente"?(st&&st.portale?"lo STEP è sul portale":"nessuno STEP"):fonte==="in_attesa_di_conferma"?"STEP proposto: va autorizzato":"STEP autorizzato come fonte"],
    ["nom","Nomenclatura della BOM",nom,nom==="non_verificabile"?"nessun figlio, né proposto né confermato":ver?"codici confermati":"codici da confermare nella Distinta"],
    ["ger","Gerarchia della BOM",ger,ger==="da_verificare"&&fonte!=="confermata"?"serve la fonte confermata":ver?"archi e quantità confermati":"archi e quantità da confermare"],
    ["smi","Smistamento dei file",smist,smist==="verificato"?"ogni file è confermato o escluso":plur(s1.daconf+libere,"file da decidere","file da decidere")],
    ["doc","Completezza documentale",doc,doc==="incompleta"?"manca un documento obbligatorio":doc==="non_calcolabile"?"il perimetro non è chiuso: PDF previsti":"ogni 2D obbligatorio confermato"],
    ["stato","Stato del prodotto",tutti?"pronto_fattibilita":"non_pronto",tutti?"può passare alla fattibilità":"un motivo per ogni asse aperto"]];
}
function treStati(q){
  const d=datiRFQ(q), pid=S.rp&&d.prodotti.includes(S.rp)?S.rp:d.prodotti[0], A=assiProdotto(q,pid);
  const pronti=d.prodotti.filter(p=>assiProdotto(q,p)[6][2]==="pronto_fattibilita").length, congelabile=pronti===d.prodotti.length;
  return `<div class="assi-box"><div class="assi-testa"><span class="lab">Assi del prodotto <span class="mono">${esc(PROD[pid].cod)}</span></span>
      <span class="sp"></span>${q.req||q.stato==="avviata"?bottoneConferma(pid):""}<span class="k3" style="font-size:var(--t-xs)">Fascicolo: ${pronti} su ${plur(d.prodotti.length,"prodotto","prodotti")} pronti · ${congelabile?C("ok","congelabile","check"):C("neu","non congelabile")}</span></div>
    <div class="assi">${A.map(([k,t,v,why],i)=>{const [c,l]=ASSE_ETI[v]; return `<div class="asse ${c}${i===6?" tot":""}" data-asse="${k}"><span class="lab">${i<6?(i+1)+" · ":""}${t}</span><b>${C(c,l)}</b><span class="k3">${esc(why)}</span></div>`;}).join("")}</div></div>`;
}

/* ---- il modello: una distinta per prodotto, costruita dalle proposte e dai documenti ---- */
const BOM={};
const clona=x=>JSON.parse(JSON.stringify(x));
function rfqDelProdotto(pid){return RFQ.find(q=>datiRFQ(q).prodotti.includes(pid));}
function fontiDa(p){
  return [["neu","STEP",p.d3&&!p.d3.portale?p.d3.perche:"figlio della radice nello STEP d’assieme"],
    p.d2&&!p.d2.portale?["ok","Disegno",p.d2.perche]:null].filter(Boolean);
}
function bomDi(pid){
  if(BOM[pid]) return BOM[pid];
  const D=DOCS[pid], P=PROD[pid], q=rfqDelProdotto(pid), A=ANALISI[pid]||{}, chiusa=!!(q&&q.bomOk);
  const nodes=[{id:"r",codice:P.cod,nome:P.nome,tipo:"finito",padre:null,qta:1,proposto:false,
    fonti:[["acc","Richiesta","codice richiesto"+(q?" nella RFQ "+q.num:"")],
      D.pdf&&!D.pdf.portale?["ok","Disegno","cartiglio di "+D.pdf.f]:null,
      D.step&&!D.step.portale?["neu","STEP","radice di "+D.step.f]:null].filter(Boolean)}];
  D.parti.forEach((p,i)=>{p.pk=p.pk||pid+"-"+i;});
  D.parti.forEach(p=>{
    const su=p.sotto?D.parti.find(x=>x.cod===p.sotto):null;
    nodes.push({id:p.pk,pk:p.pk,codice:p.cod,nome:p.nome,tipo:p.tipo,padre:su?su.pk:"r",qta:p.qta,proposto:!(p.conf||chiusa),fonti:p.fonti||fontiDa(p),cat:p.cat||(p.tipo==="comm"?"commerciale":"fabbricato"),catConf:!!p.catConf});
  });
  const conStep=D.step&&!D.step.portale;
  return BOM[pid]={nodes,salvati:clona(nodes),verificata:chiusa||!!A.verificata,interni:0,analisi:A.motivo&&!D.parti.length?"senza":conStep||D.parti.length?"ok":"senza"};
}
const nodo=(B,id)=>B.nodes.find(n=>n.id===id);
const figliDi=(B,id)=>B.nodes.filter(n=>n.padre===id);
const discende=(B,a,b)=>{let x=nodo(B,b);while(x&&x.padre){if(x.padre===a)return true;x=nodo(B,x.padre);}return false;}; /* b sta sotto a */
const inOrdine=B=>{const out=[];const giu=(id,l)=>{const n=nodo(B,id);if(!n)return;out.push([n,l]);figliDi(B,id).forEach(f=>giu(f.id,l+1));};giu("r",0);return out;};
const qtaTot=(B,n)=>{let q=1,x=n;while(x&&x.padre){q*=x.qta||1;x=nodo(B,x.padre);}return q;};
const puoContenere=(B,verso,id)=>{const v=nodo(B,verso);return !!v&&CONTENITORI.has(v.tipo)&&verso!==id&&!discende(B,id,verso);};
const CAMPI=["codice","nome","tipo","padre","qta","proposto"];
function modifiche(B){
  let n=0; const m=new Map(B.salvati.map(c=>[c.id,c]));
  for(const c of B.nodes){const s=m.get(c.id); if(!s||CAMPI.some(k=>s[k]!==c[k])) n++;}
  for(const s of B.salvati) if(!nodo(B,s.id)) n++;
  return n;
}
const parteDi=(pid,n)=>n.pk?DOCS[pid].parti.find(p=>p.pk===n.pk):null;
function slotNodo(pid,n,col){
  const D=DOCS[pid];
  if(n.id==="r") return col==="d3"?D.step:col==="d2"?D.pdf:null;
  const p=parteDi(pid,n); return p?p[col]:null;
}
/* le celle 3D · 2D · DXF della casella: regole del passo 1 (R82: il commerciale non chiede il 2D) */
function cellaNodo(pid,n,col){
  if(n.id==="r"&&col==="dxf") return "nr";
  const s=slotNodo(pid,n,col);
  if(s&&!s.portale) return s.stato==="ok"?"ok":"sugg";
  if(n.id==="r") return "manca";
  const p=parteDi(pid,n)||n;
  if(richiesto(n.tipo,col,p)) return "manca";
  return n.tipo==="comm"||minuteriaConfermata(p)?"nr":"fac";
}
function bomVerificata(pid){const B=bomDi(pid); return B.verificata&&!B.nodes.some(n=>n.proposto)&&!modifiche(B);}
function bomOkRFQ(q){return !!q.bomOk||datiRFQ(q).prodotti.every(bomVerificata);}
function statoDistinta(pids){
  const Bs=pids.map(bomDi), p=Bs.reduce((n,b)=>n+b.nodes.filter(x=>x.proposto).length,0), m=Bs.reduce((n,b)=>n+modifiche(b),0);
  if(p) return ["warn",plur(p,"proposta","proposte")+" da confermare"];
  if(m) return ["warn","da salvare"];
  if(pids.every(bomVerificata)) return ["ok","verificata · "+plur(Bs.reduce((n,b)=>n+b.nodes.length,0),"pezzo","pezzi")];
  return ["warn","da confermare"];
}
/* salvare: la distinta diventa le righe dei documenti del passo 1; i file dei pezzi tolti restano, senza pezzo */
function syncParti(pid,B){
  const D=DOCS[pid], vecchie=D.parti, nuove=[];
  inOrdine(B).forEach(([n])=>{
    if(n.id==="r") return;
    let p=n.pk?vecchie.find(x=>x.pk===n.pk):null;
    if(!p){p={pk:n.id,d3:null,d2:null,dxf:null}; n.pk=n.id;}
    const su=nodo(B,n.padre);
    Object.assign(p,{cod:n.codice,nome:n.nome,tipo:n.tipo,qta:n.qta,sotto:su&&su.id!=="r"?su.codice:undefined,conf:!n.proposto,fonti:n.fonti,cat:n.cat,catConf:n.catConf});
    if(!previsto(p.tipo,"dxf")&&p.dxf){ if(!p.dxf.portale) D.liberi.push([p.dxf.f,p.cod+" è diventato commerciale: lo sviluppo non serve più",""]); p.dxf=null; }
    nuove.push(p);
  });
  vecchie.filter(p=>!nuove.includes(p)).forEach(p=>["d3","d2","dxf"].forEach(c=>{const s=p[c];
    if(s&&!s.portale) D.liberi.push([s.f,"il suo pezzo "+p.cod+" è stato tolto dalla distinta",""]);}));
  D.parti=nuove;
}
function sposta(B,id,verso){
  const c=nodo(B,id), v=nodo(B,verso);
  if(!c||!c.padre||!v||id===verso) return null;
  if(!CONTENITORI.has(v.tipo)) return {ok:false,t:`<b>${esc(v.codice)}</b> è un ${TIPI[v.tipo].toLowerCase()}: sotto non ci va niente. Mettilo sotto il prodotto o sotto un assieme.`};
  if(discende(B,id,verso)) return {ok:false,t:`Non si può: <b>${esc(v.codice)}</b> sta già sotto <b>${esc(c.codice)}</b>.`};
  if(c.padre===verso) return null;
  c.padre=verso; return {ok:true,t:`<b>${esc(c.codice)}</b> ora è sotto <b>${esc(v.codice)}</b>.`};
}

function pdfDellaRFQ(){
  const q=rf(S.rfq); if(!q) return [];
  const out=[], visti=new Set();
  for(const pid of datiRFQ(q).prodotti){
    const D=DOCS[pid], B=bomDi(pid);
    for(const [n] of inOrdine(B)){const s=slotNodo(pid,n,"d2");

}

function fattibilita(q,d){

function azioneDistinta(a){
  const pid=S.rp, B=bomDi(pid), n=nodo(B,DIST.sel);
  if(a==="rifai"){
    const D=DOCS[pid];
    if(B.analisi==="senza"&&D.step&&!D.step.portale){B.analisi="ok";
      DIST.msg={ok:true,t:`<b>Analisi rifatta.</b> Lo STEP <span class="mono">${esc(D.step.f)}</span> ha una sola radice e nessun figlio: il prodotto è un pezzo unico.`};}
    else DIST.msg={ok:true,t:B.analisi==="senza"?"<b>Analisi rifatta:</b> lo STEP strutturale non c’è ancora, la struttura resta da costruire.":"<b>Analisi rifatta.</b> Il worker rilegge disegni e STEP e rifà la proposta. Quello che hai già confermato resta."};
  }
  if(a==="accetta"){const k=B.nodes.filter(x=>x.proposto).length; B.nodes.forEach(x=>x.proposto=false);
    DIST.msg={ok:true,t:`<b>${plur(k,"casella confermata","caselle confermate")}.</b> Ricordati di salvare la distinta.`};}
  if(a==="scarta") DIST.scarta=true;
  if(a==="scartano") DIST.scarta=false;
  if(a==="scartaok"){
    const via=new Set(B.nodes.filter(x=>x.proposto&&x.padre).map(x=>x.id));
    const su=id=>{let p=nodo(B,id).padre; while(via.has(p)) p=nodo(B,p).padre; return p;};
    B.nodes.filter(x=>!via.has(x.id)&&via.has(x.padre)).forEach(x=>x.padre=su(x.id));
    B.nodes=B.nodes.filter(x=>!via.has(x.id)); DIST.scarta=false; DIST.sel="r";
    DIST.msg={ok:true,t:`<b>${plur(via.size,"casella scartata","caselle scartate")}.</b> I loro file restano, senza pezzo, quando salvi.`};
  }
  if(a==="annullanuovo") DIST.nuovo=null;
  if(a==="aggiungi"){
    const codice=($("dn-cod").value||"").trim(), padre=$("dn-padre").value, qta=Math.max(1,parseInt($("dn-qta").value,10)||1), nome=($("dn-nome").value||"").trim();
    if(!codice){$("dn-cod").focus();$("dn-cod").style.borderColor="var(--bad)";return;}
    if(B.nodes.some(x=>x.codice.toUpperCase()===codice.toUpperCase())){DIST.msg={ok:false,t:`<b>${esc(codice)}</b> c’è già nella distinta.`};return render();}
    if(DIST.nuovo==="sottoass"&&codice.startsWith(PROD[pid].cod+"-A")) B.interni++;
    const id="n"+(++contaNuovi);
    B.nodes.push({id,pk:null,codice,nome,tipo:DIST.nuovo,padre,qta,proposto:false,fonti:[["acc","A mano","aggiunto da SV · adesso"]]});
    DIST.msg={ok:true,t:`<b>${esc(codice)}</b> aggiunto sotto <b>${esc(nodo(B,padre).codice)}</b>.${DIST.nuovo==="sottoass"?" Trascina qui sopra i pezzi che contiene.":""}`};
    DIST.sel=id; DIST.nuovo=null;
  }
  if(a==="eliminasel"){ if(!n||!n.padre) DIST.msg={ok:false,t:"Scegli prima una casella: il prodotto non si elimina."}; else DIST.elimina=true; }
  if(a==="elimina") DIST.elimina=true;
  if(a==="eliminano") DIST.elimina=false;
  if(a==="eliminaok"&&n&&n.padre){
    const via=new Set([n.id,...B.nodes.filter(x=>discende(B,n.id,x.id)).map(x=>x.id)]);
    B.nodes=B.nodes.filter(x=>!via.has(x.id)); DIST.sel=n.padre; DIST.elimina=false;
    DIST.msg={ok:true,t:`<b>${esc(n.codice)}</b> eliminato dalla distinta. I suoi file restano: quando salvi, vanno fra i file non associati del passo 1.`};
  }
  if(a==="conferma"&&n){n.proposto=false; DIST.msg={ok:true,t:`<b>${esc(n.codice)}</b> confermato.`};}
  if(a==="annullatutto"){B.nodes=clona(B.salvati); DIST.sel="r"; DIST.msg={ok:true,t:"Modifiche annullate."};}
  if(a==="salva"){
    syncParti(pid,B); B.salvati=clona(B.nodes); const k=B.nodes.filter(x=>x.proposto).length; B.verificata=!k;
    const q=rf(S.rfq); if(q) q.agg="adesso";
    DIST.msg=k?{ok:false,t:`<b>Distinta salvata</b>, tutta in una volta. Restano ${plur(k,"proposta","proposte")} da confermare: la BOM non è ancora verificata.`}
      :{ok:true,t:`<b>Distinta salvata e verificata</b> per <span class="mono">${esc(PROD[pid].cod)}</span>. I documenti del passo 1 seguono la distinta nuova.`};
  }
  render();
  if(a==="aggiungi"||a==="eliminaok"){const x=document.querySelector(`.nodo[data-dsel="${DIST.sel}"]`); if(x) x.focus();}
}
function azioneVisore(a,e,t){
  if(a==="sfondo"){ if(e.target===t){VIS.file=null;render();} return; }
  if(a==="pop") return;
  if(a==="chiudi"){VIS.file=null;return render();}
  if(a==="zpiu"){VIS.zoom=Math.min(ZOOM.length-1,VIS.zoom+1);return render();}
  if(a==="zmeno"){VIS.zoom=Math.max(0,VIS.zoom-1);return render();}
  if(a==="zadatta"){VIS.zoom=0;return render();}
  if(a==="arma"){VIS.armato=!VIS.armato;VIS.nuovo=null;return render();}
  if(a==="carta"){
    if(!VIS.armato){VIS.sel=null;return render();}
    const r=t.getBoundingClientRect();
    const x=r.width?Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)):.5, y=r.height?Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)):.5;
    VIS.nuovo={x,y}; VIS.armato=false; render(); const ta=$("nota-testo"); if(ta) ta.focus(); return;
  }
  if(a.startsWith("pin:")){VIS.sel=+a.slice(4);return render();}
  if(a.startsWith("togli:")){const id=+a.slice(6); NOTE[VIS.file]=(NOTE[VIS.file]||[]).filter(x=>x.id!==id); VIS.sel=null; return render();}
  if(a==="annullanota"){VIS.nuovo=null;return render();}
  if(a==="salvanota"){
    const ta=$("nota-testo"), tx=ta?ta.value.trim():"";
    if(!tx){if(ta)ta.focus();return;}
    (NOTE[VIS.file]=NOTE[VIS.file]||[]).push({id:prossimaNota++,x:VIS.nuovo.x,y:VIS.nuovo.y,testo:tx,autore:"SV",quando:"adesso",mia:true});
    VIS.sel=prossimaNota-1; VIS.nuovo=null; return render();
  }
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-dsel],[data-dnuovo],[data-dx],[data-dvis],[data-dvx]"); if(!t) return;
  const D=t.dataset;
  if(D.dvx!==undefined) return azioneVisore(D.dvx,e,t);
  if(D.dvis){Object.assign(VIS,{file:D.dvis,zoom:0,armato:false,sel:null,nuovo:null});render();const b=document.querySelector('[data-dvx="chiudi"]');if(b)b.focus();return;}
  if(D.dsel){if(DIST.sel!==D.dsel){DIST.sel=D.dsel;DIST.elimina=false;DIST.msg=null;}return render();}
  if(D.dnuovo){DIST.nuovo=D.dnuovo;render();const x=$(D.dnuovo==="sottoass"?"dn-nome":"dn-cod");if(x)x.focus();return;}
  if(D.dx) return azioneDistinta(D.dx);
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="vis-file"){Object.assign(VIS,{file:e.target.value,sel:null,nuovo:null,armato:false});return render();}
  if(!/^dd-/.test(id)) return;
  const B=bomDi(S.rp), n=nodo(B,DIST.sel); if(!n) return;
  const v=e.target.value;
  if(id==="dd-cod"){const c=v.trim();
    if(c&&B.nodes.some(x=>x!==n&&x.codice.toUpperCase()===c.toUpperCase())) DIST.msg={ok:false,t:`<b>${esc(c)}</b> c’è già nella distinta.`};
    else if(c) n.codice=c;}
  if(id==="dd-nome") n.nome=v;
  if(id==="dd-cat"||id==="dd-catconf"){const p=parteDi(S.rp,n);
    if(id==="dd-cat"){n.cat=v; n.catConf=false;} else n.catConf=e.target.checked;
    if(p){p.cat=n.cat; p.catConf=n.catConf;} /* la classificazione è una decisione a sé: vale subito anche per i documenti */
    const sv=B.salvati.find(x=>x.id===n.id); if(sv){sv.cat=n.cat; sv.catConf=n.catConf;}}
  if(id==="dd-tipo"){
    if(!CONTENITORI.has(v)&&figliDi(B,n.id).length) DIST.msg={ok:false,t:`<b>${esc(n.codice)}</b> ha dei pezzi sotto: prima spostali, poi può diventare ${TIPI[v].toLowerCase()}.`};
    else n.tipo=v;}
  if(id==="dd-padre") DIST.msg=sposta(B,n.id,v);
  if(id==="dd-qta"){const q=parseInt(v,10); if(q>0) n.qta=q;}
  render();
});

const CAT=[
 ["taglio","Taglio",[["laser","Taglio laser lamiera","int"],["lasertubo","Taglio laser tubo","int"],["sega","Taglio a sega","int"]]],
 ["forma","Piegatura e formatura",[["piega","Piegatura lamiera","int"],["curva","Curvatura tubi","int"],["stampa","Stampaggio","int"],["curvatura_tubi","Curvatura tubi da terzi","est"]]],
 ["mecc","Lavorazioni meccaniche",[["fresa","Fresatura CNC","int"],["foratura","Foratura","int"],["filettatura","Filettatura","int"],["sbavatura","Sbavatura","int"],["tornitura","Tornitura","est"],["fresatura_est","Fresatura da terzi","est"]]],

const cicloDi=(pid,n)=>CICLI[pid+"|"+n.id]||null;

function statoCiclo(pid,n){ if(n.tipo==="comm") return "acquisto"; const c=cicloDi(pid,n); return !c||!c.fasi.length?"vuoto":c.stato;}
const CHIP_CICLO={vuoto:["ghost","senza ciclo"],proposto:["prop","da confermare"],confermato:["ok","ciclo confermato"],acquisto:["warn","da acquistare"]};
function contaCicli(pid){const B=bomDi(pid), da=B.nodes.filter(n=>n.tipo!=="comm"); return [da.filter(n=>statoCiclo(pid,n)==="confermato").length,da.length];}
function faseDi(id){for(const k in CICLI){const c=CICLI[k], i=c.fasi.findIndex(f=>f.id===id); if(i>=0) return [c,i,c.fasi[i],k];} return [null,-1,null,null];}
function tagFase(nt){ if(!nt||!nt.fase) return ""; const [,i,f]=faseDi(nt.fase); return f?` · fase ${(i+1)*10} ${PROC[f.p][0]}`:""; }

  if(!n.padre) return null; const cp=cicloDi(pid,nodo(B,n.padre)); if(!cp) return null;
  const i=cp.fasi.findIndex(f=>f.figli&&f.figli[n.id]!=null); return i<0?null:[i,cp.fasi[i]];
}
function proponiTipico(pid,B,n){
  const c=cicloPer(pid,n), figli=figliDi(B,n.id), tutti=Object.fromEntries(figli.map(f=>[f.id,f.qta]));
  if(n.tipo==="sciolto") c.fasi=[fase({p:"laser"}),fase({p:"piega"}),fase({p:"sbavatura"})];
  else { c.fasi=[fase({p:"puntatura",figli:tutti,maschera:true}),fase({p:"sald_robot",maschera:true}),fase({p:"controllo"})]; c.prep={maschera:{on:true,nota:""},robot:{on:true,nota:""}}; }
  c.stato="proposto"; c.fonte="ciclo tipico per "+TIPI[n.tipo].toLowerCase()+": da controllare sul disegno";
}
/* i controlli: che cosa manca perché il ciclo si possa confermare */
function controlliNodo(pid,B,n,cli){
  const out=[], c=cicloDi(pid,n);
  if(n.tipo==="comm") return out;
  if(!c||!c.fasi.length){ out.push(["warn","Nessuna fase: il ciclo è vuoto."]); return out; }
  if(n.tipo==="sciolto"&&!(c.mat&&c.mat.m)) out.push(["warn","Manca il materiale."]);
  figliDi(B,n.id).forEach(f=>{ if(!c.fasi.some(x=>x.figli&&x.figli[f.id]!=null)) out.push(["bad",`${f.codice} non entra in nessuna fase: indica dove si monta, si punta o si salda.`]); });
  let saldato=false;
  c.fasi.forEach((f,i)=>{const num=(i+1)*10, P=PROC[f.p];
    if(SALD.has(f.p)) saldato=true;
    if(f.p==="sald_robot"&&!f.maschera) out.push(["warn",`Fase ${num}: saldatura robotizzata senza maschera. È voluto?`]);
    if(CON_MASCHERA.has(f.p)&&f.maschera&&!((c.prep||{}).maschera||{}).on&&!out.some(x=>x[1].startsWith("Saldatura in maschera"))) out.push(["info","Saldatura in maschera: se la maschera non c’è ancora, spuntala fra le preparazioni in alto."]);
    if(CON_FIGLI.has(f.p)&&!SALD.has(f.p)&&!Object.keys(f.figli||{}).length) out.push(["warn",`Fase ${num}: quali componenti entrano qui?`]);
    if(P[1]==="est"){
      if(!f.terz) out.push(["warn",`Fase ${num}: ${P[0].toLowerCase()} senza terzista.`]);
      else { const t=terz(f.terz), q=qualificato(t,cli,f.p); if(q===false) out.push(["bad",`Fase ${num}: ${t.nome} non è qualificato per ${cl(cli).nome} per ${P[0].toLowerCase()}.`]); }
      if(TRATT.has(f.p)&&!saldato&&c.fasi.slice(i+1).some(x=>SALD.has(x.p))) out.push(["warn",`Fase ${num}: trattamento prima della saldatura. È voluto?`]);
    }
  });
  /* regola di Lino: il materiale lo mettiamo noi, tranne quando il pezzo non passa prima da una nostra lavorazione (es. boccole) */
  const primaEst=c.fasi.length&&PROC[c.fasi[0].p][1]==="est";
  if(primaEst&&c.fasi[0].matNostro!==false) out.push(["info","Nessuna nostra lavorazione prima della fase esterna: di solito il materiale lo mette il terzista."]);
  if(n.tipo==="sciolto"&&c.mat&&primaEst&&c.mat.forn==="noi"&&c.fasi[0].matNostro===false) out.push(["warn","Il materiale risulta nostro, ma la fase esterna dice che lo mette il terzista."]);
  return out;
}

function azioneCiclo(a){
  const q=rf(S.rfq), d=datiRFQ(q), pid=S.rp, B=bomDi(pid), ord=inOrdine(B), i=ord.findIndex(([x])=>x.id===WF.cur), n=nodo(B,WF.cur)||nodo(B,"r");
  const vai=id=>{WF.cur=id;WF.vis={armato:false,nuovo:null,sel:null,zoom:WF.vis.zoom};WF.invio=null;WF.msg=null;};
  const [cmd,a1,a2]=a.split(":");
  if(cmd==="prev"&&i>0) vai(ord[i-1][0].id);
  if(cmd==="next"&&i<ord.length-1) vai(ord[i+1][0].id);
  if(cmd==="proponi"){proponiTipico(pid,B,n); WF.msg={ok:true,t:`<b>Ciclo tipico proposto</b> per <span class="mono">${esc(n.codice)}</span>: controllalo sul disegno.`};}
  if(cmd==="aggiungi"){const k=$("wf-nuova").value, c=cicloPer(pid,n), o={p:k};
    if(CON_FIGLI.has(k)) o.figli=Object.fromEntries(figliDi(B,n.id).filter(m=>!c.fasi.some(x=>x.figli&&x.figli[m.id]!=null)).map(m=>[m.id,m.qta]));
    if(PROC[k][1]==="est") Object.assign(o,{terz:"",spec:"",istr:"",matNostro:true});
    if(CON_MASCHERA.has(k)) o.maschera=k!=="sald_mag"&&k!=="sald_tig";
    c.fasi.push(fase(o)); tocca(c); WF.msg=null;}
  const trova=()=>{const [c,j,f]=faseDi(a1); return {c,j,f};};
  if(cmd==="su"||cmd==="giu"){const {c,j}=trova(), k=cmd==="su"?j-1:j+1; if(c&&k>=0&&k<c.fasi.length){[c.fasi[j],c.fasi[k]]=[c.fasi[k],c.fasi[j]]; tocca(c);}}
  if(cmd==="via"){const {c,j}=trova(); if(c){c.fasi.splice(j,1); tocca(c);}}
  if(cmd==="conferma"){const c=cicloDi(pid,n); c.stato="confermato"; c.fonte="confermato da Lino adesso";
    const nx=ord[i+1]; WF.msg={ok:true,t:`<b>Ciclo di <span class="mono">${esc(n.codice)}</span> confermato.</b>${nx?` Prossimo: <span class="mono">${esc(nx[0].codice)}</span>.`:" Era l’ultimo componente."}`};}
  if(cmd==="riapri"){const c=cicloDi(pid,n); c.stato="proposto"; c.fonte="riaperto da Lino"; WF.msg=null;}
  if(cmd==="usa"){const {c,f}=trova(), e=STORICO_EST.find(x=>x.id===a2);
    Object.assign(f,{terz:e.terz,spec:e.spec,istr:e.istr,matNostro:e.matNostro,daCat:e.id}); tocca(c);
    f.allegati=f.allegati||allegatiIniziali(pid,n);
    if(e.cod!==n.codice&&!f.allegati.some(x=>x.f===e.file)) f.allegati.push({f:e.file,s:"",da:"dallo storico: "+e.cod+" · "+e.quando});
    WF.msg={ok:true,t:`<b>Ripreso dallo storico:</b> ${esc(terz(e.terz).nome)}, istruzioni del ${esc(e.quando)} per <span class="mono">${esc(e.cod)}</span>. Controllale prima di inviare.`};}
  if(cmd==="prepara"){const {f}=trova(); f.allegati=f.allegati||allegatiIniziali(pid,n); WF.invio=a1;}
  if(cmd==="stacca"){const {f}=trova(); f.allegati.splice(+a2,1);}
  if(cmd==="catdis"){WF.cat="disegni"; WF.catFase=a1; WF.catq="";}
  if(cmd==="allega"){const file=a.slice(7), [,,f]=faseDi(WF.catFase), o=archivioPdf().find(x=>x.f===file);
    if(f&&o&&!(f.allegati||[]).some(x=>x.f===file)){ f.allegati=f.allegati||[]; f.allegati.push({f:o.f,s:o.s||"",da:"dall’archivio · "+cl(o.cli).nome+" · "+o.prod}); }}
  if(cmd==="carica"){WF.uplFase=a1; const inp=$("wf-upl"); if(inp){inp.value=""; inp.click();} return;}
  if(cmd==="annullainvio") WF.invio=null;
  if(cmd==="invia"){const {f}=trova(), t=terz(f.terz), s=slotNodo(pid,n,"d2");
    let ch=t.chat.find(x=>x.req===q.req&&x.cod===n.codice);
    if(!ch){ch={req:q.req,pid,cod:n.codice,nome:n.nome,stato:C("prop","bozza da inviare"),ultimo:"adesso",msg:[]}; t.chat.push(ch);}
    ch.msg.push({d:"oggi",t:"adesso",dir:"out",chi:"Lino",r:"ufficio tecnico · noi",
      txt:`<p>Buongiorno, richiesta di quotazione per <mark class="hl">${esc(PROC[f.p][0].toLowerCase())}</mark>${f.spec?" ("+esc(f.spec)+")":""} di <mark class="hl">${esc(n.codice)}</mark> ${esc(n.nome||"")}, ${esc(PROD[pid].qta)}.</p><p>${esc(f.istr||"")}</p><p>${f.matNostro!==false?"Il materiale lo forniamo noi.":"Il materiale è a vostro carico."} In allegato ${(f.allegati||[]).length===1?"il disegno":"i disegni"}${f.conNote!==false&&(NOTE[(s||{}).f]||[]).length?", con le nostre note":""}.</p>`,
      files:(f.allegati||[]).map(x=>F(x.f,"pdf",x.s||"")),meta:"bozza preparata dalla Distinta con "+plur((f.allegati||[]).length,"disegno","disegni")+(f.conNote!==false?" (note stampate sul PDF del pezzo)":"")+" e istruzioni: controllala e inviala"});
    f.inviata=true; WF.invio=null;
    if(!STORICO_EST.some(e=>e.cod===n.codice&&e.p===f.p)) STORICO_EST.unshift({id:"e"+(STORICO_EST.length+1)+"n",cod:n.codice,nome:n.nome,cli:d.cli,p:f.p,terz:f.terz,quando:"oggi",rif:"RFQ "+q.num,prezzo:"in attesa di offerta",file:s?s.f:"—",matNostro:f.matNostro!==false,spec:f.spec||"",istr:f.istr||""});
    WF.msg={ok:true,t:`<b>Bozza pronta nella chat di ${esc(t.nome)}</b> (Inbox › Terzisti), con il disegno e le istruzioni. La lavorazione entra nello storico: la prossima volta si riprende da lì.`};}
  if(cmd==="catalogo"){WF.cat="disegni"; WF.catq=""; WF.catFase=null;}
  if(cmd==="cattab"){WF.cat=a1; WF.catq="";}
  if(cmd==="catchiudi"){WF.cat=null; WF.catFase=null;}
  render();
  if(cmd==="aggiungi"){const el=document.querySelectorAll(".fase select[data-wff]"); if(el.length) el[el.length-1].focus();}
}
function azioneVistaPdf(a,e,t){
  const V=WF.vis, pid=S.rp, n=nodo(bomDi(pid),WF.cur||"r"), s=slotNodo(pid,n,"d2"), file=s&&s.f;
  if(a==="pop") return;
  if(a==="zpiu"){V.zoom=Math.min(ZOOM.length-1,V.zoom+1);return render();}
  if(a==="zmeno"){V.zoom=Math.max(0,V.zoom-1);return render();}
  if(a==="arma"){V.armato=!V.armato;V.nuovo=null;return render();}
  if(a==="carta"){ if(!V.armato){V.sel=null;return render();}
    const r=t.getBoundingClientRect(), x=r.width?Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)):.5, y=r.height?Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)):.5;
    V.nuovo={x,y}; V.armato=false; render(); const ta=$("wf-nota"); if(ta) ta.focus(); return; }
  if(a.startsWith("pin:")){V.sel=+a.slice(4);return render();}
  if(a.startsWith("togli:")){const id=+a.slice(6); NOTE[file]=(NOTE[file]||[]).filter(x=>x.id!==id); V.sel=null; return render();}
  if(a==="annullanota"){V.nuovo=null;return render();}
  if(a==="salvanota"){const ta=$("wf-nota"), tx=ta?ta.value.trim():""; if(!tx){if(ta)ta.focus();return;}
    (NOTE[file]=NOTE[file]||[]).push({id:prossimaNota++,x:V.nuovo.x,y:V.nuovo.y,testo:tx,autore:"Lino",quando:"adesso",mia:true,fase:($("wf-nota-fase")||{}).value||null});
    V.sel=prossimaNota-1; V.nuovo=null; return render();}
}

/* ================= CONFERMA FASCICOLO: il gesto cumulativo (R67 A, R108; E2 §3.3, spazio di verifica) =================
   Un riepilogo delle singole decisioni del prodotto, raggruppate come le chiede R108: fonte STEP, nomenclatura,
   relazioni e quantità, classificazioni, associazioni dei file. Si spuntano quelle verificate e si confermano
   con un solo gesto e un esito unico. Le alternative irrisolte non si scelgono mai in silenzio: restano fuori,
   con il motivo. Il gesto non congela il fascicolo e non avvia la fattibilità.
   Nel backend sarà un servizio dello spazio di verifica con controllo della versione esaminata (l'impronta). */
const CF={aperto:false,sel:{},impronta:""};
function decisioniPendenti(pid){
  const D=DOCS[pid], B=bomDi(pid), out=[], fuori=[];
  if(D.step&&!D.step.portale&&D.step.stato!=="ok") (D.step.stato==="verifica"?fuori:out).push({id:"fonte",g:"Fonte strutturale (STEP)",t:`Autorizza ${D.step.f} come fonte della distinta`,why:D.step.perche});
  if(modifiche(B)) fuori.push({g:"Struttura",t:`${plur(modifiche(B),"modifica non salvata","modifiche non salvate")} nella Distinta`,why:"salvale o annullale prima: il riepilogo vale sulla versione salvata"});
  else B.nodes.filter(n=>n.proposto).forEach(n=>{
    out.push({id:"nodo:"+n.id,g:"Nomenclatura",t:`Codice ${n.codice} · ${TIPI[n.tipo]}`,why:(n.fonti||[])[0]?.[2]||"proposto dall’analisi"});
    const p=nodo(B,n.padre); if(p) out.push({id:"arco:"+n.id,g:"Relazioni e quantità",t:`${n.codice} ×${n.qta} sotto ${p.codice}`,why:"dallo STEP strutturale",dipende:"nodo:"+n.id});
  });
  D.parti.forEach((p,i)=>{ if(p.cat==="minuteria"&&!p.catConf) out.push({id:"cat:"+i,g:"Classificazioni",t:`${p.cod} è minuteria`,why:p.catPerche||"categoria proposta dalla grammatica"}); });
  chiavi(pid).forEach(k=>{const s=getSlot(pid,k); if(!s||s.portale||s.stato==="ok"||k==="step") return;
    if(s.stato==="verifica") fuori.push({g:"Associazioni dei file",t:`${s.f} come ${etichetta(pid,k)}`,why:s.nota||"fonti discordanti: va risolto prima"});
    else out.push({id:"file:"+k,g:"Associazioni dei file",t:`${s.f} come ${etichetta(pid,k)}`,why:s.perche});});
  return {out,fuori};
}
const GRUPPI_CF=["Fonte strutturale (STEP)","Nomenclatura","Relazioni e quantità","Classificazioni","Associazioni dei file"];
function bottoneConferma(pid){
  const n=decisioniPendenti(pid).out.length;
  return `<button class="btn sm ${n?"pri":""}" data-cf="apri" ${n?"":"disabled"}>${I("check",13)} Conferma fascicolo${n?` · ${n} decisioni`:""}</button>`;
}
function riepilogoConferma(){
  if(!CF.aperto) return "";
  const pid=S.rp, {out,fuori}=decisioniPendenti(pid), scelte=out.filter(x=>CF.sel[x.id]!==false);
  return `<div class="backdrop" data-cf="chiudi"></div><aside class="drawer largo" role="dialog" aria-label="Conferma fascicolo">
    <header><div style="min-width:0"><span class="lab">Conferma fascicolo · ${esc(PROD[pid].cod)}</span><h3>Riepilogo delle decisioni</h3></div><span class="sp"></span>
      <button class="btn sm ghost" data-cf="chiudi" aria-label="Chiudi">${I("x",15)}</button></header>
    <div class="dbody">
      <p class="hint" style="margin:0">Spunta quello che hai verificato. Si conferma tutto insieme, con un esito unico; ogni decisione resta registrata da sola. Il gesto <b>non congela</b> il fascicolo e <b>non avvia</b> la fattibilità.</p>
      ${GRUPPI_CF.map(g=>{const v=out.filter(x=>x.g===g); return v.length?`<div class="cf-g"><span class="lab">${g} · ${v.length}</span>${v.map(x=>`<label class="cf-i"><input type="checkbox" data-cfsel="${esc(x.id)}" ${CF.sel[x.id]!==false?"checked":""}>
          <span style="min-width:0"><b>${esc(x.t)}</b><span class="k3">${esc(x.why||"")}</span></span></label>`).join("")}</div>`:"";}).join("")||`<p class="ctrlok">${I("check",14)} Nessuna decisione da confermare per questo prodotto.</p>`}
      ${fuori.length?`<div class="cf-g fuori"><span class="lab">${I("alert",13)} Non comprese · da risolvere prima</span>${fuori.map(x=>`<div class="cf-i"><span></span><span><b>${esc(x.t)}</b><span class="k3">${esc(x.why)}</span></span></div>`).join("")}</div>`:""}
      <p class="k3" style="margin:0;font-size:var(--t-xs)">Versione esaminata: <span class="mono">${esc(CF.impronta)}</span>. Se il fascicolo cambia prima della conferma, il gesto si ferma e il riepilogo va riaperto.</p></div>
    <footer><button class="btn pri" data-cf="conferma" ${scelte.length?"":"disabled"}>${I("check",14)} Conferma ${plur(scelte.length,"decisione","decisioni")}</button>
      <button class="btn ghost" data-cf="chiudi">Annulla</button></footer></aside>`;
}
function improntaFascicolo(pid){return impronta(JSON.stringify([DOCS[pid].step&&DOCS[pid].step.stato,bomDi(pid).nodes.map(n=>[n.id,n.proposto,n.padre,n.qta]),DOCS[pid].parti.map(p=>[p.cat,p.catConf,p.d2&&p.d2.stato])]));}
function confermaFascicolo(){
  const pid=S.rp;
  if(improntaFascicolo(pid)!==CF.impronta){S.esito={ok:false,righe:["<b>Il fascicolo è cambiato</b> dal riepilogo: riaprilo e ricontrolla."]};CF.aperto=false;return;}
  const {out}=decisioniPendenti(pid), sc=out.filter(x=>CF.sel[x.id]!==false&&(!x.dipende||CF.sel[x.dipende]!==false)), B=bomDi(pid), conta={};
  sc.forEach(x=>{conta[x.g]=(conta[x.g]||0)+1; const [tipo,...r]=x.id.split(":"), ref=r.join(":");
    if(tipo==="fonte") DOCS[pid].step.stato="ok";
    if(tipo==="nodo"){const n=nodo(B,ref); if(n) n.proposto=false;}
    if(tipo==="cat"){const p=DOCS[pid].parti[+ref]; p.catConf=true; const n=B.nodes.find(m=>m.pk===p.pk); if(n) n.catConf=true;}
    if(tipo==="file"){const s=getSlot(pid,ref); if(s) s.stato="ok";}});
  if(sc.some(x=>x.id.startsWith("nodo:"))){syncParti(pid,B); B.salvati=clona(B.nodes); B.verificata=!B.nodes.some(n=>n.proposto);}
  CF.aperto=false; CF.sel={};
  S.esito={ok:true,righe:[`<b>Fascicolo confermato: ${plur(sc.length,"decisione","decisioni")}</b> in un solo gesto.`,
    GRUPPI_CF.filter(g=>conta[g]).map(g=>`${g}: ${conta[g]}`).join(" · "),"Non è congelato e la fattibilità non è partita: si decidono a parte."]};
}

  const a=t.dataset.cf;
  if(a==="apri"){CF.aperto=true; CF.sel={}; CF.impronta=improntaFascicolo(S.rp);}
  if(a==="chiudi") CF.aperto=false;
  if(a==="conferma") confermaFascicolo();
  render();
});
